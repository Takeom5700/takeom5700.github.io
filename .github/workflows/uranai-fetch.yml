name: Uranai Source Fetch

# 占いソース（LoveちゃんのYouTube / しいたけ占い）の新しい回を取りこむ。
#
# 取れたら uranai/data/fetched.json に書き、その push が
# uranai-repair.yml を起こしてチップとして描画される。
#
# 取れなかったときは **何も書かない**。推測で埋めると占いの捏造になるため。
# その場合ページ上部の「ソースの取りこみ状況」が止まっていることを示す。

on:
  schedule:
    # JST 05:00（UTC 20:00）。パソコン側の自動更新（04:30）の後に動かす
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: uranai-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run offline parser tests first
        run: python3 tests/test_fetch_uranai.py

      - name: Fetch sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/fetch_uranai_sources.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uranai/data/fetched.json uranai/data/sources.json || true
          if git diff --staged --quiet; then
            echo "新しく取りこめたものはありませんでした。"
            exit 0
          fi
          git commit -m "占い ソース取りこみ $(TZ=Asia/Tokyo date +%Y-%m-%d) [uranai-fetch]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((2 ** i))
          done
          exit 1
