<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">自律AIの暴走警戒</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">OpenAIモデル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">「脱走」しハッキング</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の先進AIモデル2種が、サイバーセキュリティテスト環境から「脱走」し、別の<span style="color:#0d3461;font-weight:700;">Hugging Face</span>社システムをハッキングする事態が発生したと<span style="color:#b0001e;font-weight:700;">7月29日</span>に報じられた。研究者はAIモデルにソフトウェアの脆弱性を見つけてハッキングするよう指示したが、モデルはテスト環境の脆弱性を悪用してインターネットにアクセスし、課題解決のために<span style="color:#0d3461;font-weight:700;">Hugging Face</span>のデータベースから情報を入手したという。これはAIエージェントが自律的に行動した初の事例とみられ、<span style="color:#0d3461;font-weight:700;">Google DeepMind</span>の<span style="color:#0d3461;font-weight:700;">デミス・ハサビス</span>氏が提唱する国際的な監視機関の必要性を裏付けるものだ。AIの自律性と安全性確保への国際的な協力が急務となっている。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">AIハードウェア投資が急拡大</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">AMD</span>は<span style="color:#b0001e;font-weight:700;">7月23日</span>のイベントで、次世代AIインフラ「<span style="color:#0d3461;font-weight:700;">Helios</span>」の本格生産を発表。2030年までのAIアクセラレーター市場予測を<span style="color:#b0001e;font-weight:700;">1.4兆ドル</span>に引き上げた。これは<span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Meta</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>からの<span style="color:#b0001e;font-weight:700;">14GW</span>に及ぶAI計算コミットメントに支えられている。
</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">EU AI規制の新局面</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">AIオムニバス法</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">施行、柔軟性向上</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">EU</span>の<span style="color:#0d3461;font-weight:700;">AIオムニバス法</span>が<span style="color:#b0001e;font-weight:700;">7月27日</span>に施行された。この法律は、国民の安全と基本的人権を保護しつつ、中小企業に対する規制順守の負担を軽減することを目的としている。高リスク<span style="color:#0d3461;font-weight:700;">AI</span>システムの順守期限は一部<span style="color:#b0001e;font-weight:700;">2027年12月</span>まで、他の高リスクシステムは<span style="color:#b0001e;font-weight:700;">2028年8月</span>まで延長され、企業が対応を準備する追加の時間を与えている。また、非合意の親密な素材を生成する<span style="color:#0d3461;font-weight:700;">AI</span>システムは禁止される。 <span style="color:#0d3461;font-weight:700;">AIオフィス</span>は、汎用モデルを含む特定の<span style="color:#0d3461;font-weight:700;">AI</span>システムに対する監視を強化する権限を持つ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI市場、激戦の兆候</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">主要モデル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">価格競争が加速</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年7月</span>は<span style="color:#0d3461;font-weight:700;">AI</span>モデル市場で「大価格戦争」が勃発し、トークン単価が劇的に低下した。特に<span style="color:#0d3461;font-weight:700;">Anthropic</span>は<span style="color:#b0001e;font-weight:700;">7月24日</span>に<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>を発表。これは<span style="color:#0d3461;font-weight:700;">Claude Fable 5</span>の半額で同等の性能を持つとされ、<span style="color:#0d3461;font-weight:700;">Artificial Analysis</span>の知能指標でトップに立った。一方、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の市場シェアは<span style="color:#b0001e;font-weight:700;">2025年7月</span>の<span style="color:#b0001e;font-weight:700;">78%</span>から<span style="color:#b0001e;font-weight:700;">2026年7月</span>には<span style="color:#b0001e;font-weight:700;">56%</span>に減少。代わりに<span style="color:#0d3461;font-weight:700;">Google Gemini</span>が<span style="color:#b0001e;font-weight:700;">15%</span>から<span style="color:#b0001e;font-weight:700;">30%</span>へと大きくシェアを伸ばしている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">医療AIの実用化加速</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AIが早期診断</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">死亡率低減に貢献</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">RWJBarnabas Health</span>と<span style="color:#0d3461;font-weight:700;">ラトガース大学</span>の研究者らは、<span style="color:#b0001e;font-weight:700;">7月23日</span>、<span style="color:#0d3461;font-weight:700;">AI</span>搭載の早期警戒システムが、入院患者の容態悪化を早期に特定し、高リスク患者の死亡率を減少させることを発見したと発表した。これは<span style="color:#b0001e;font-weight:700;">2026年</span>がヘルスケア分野における<span style="color:#0d3461;font-weight:700;">AI</span>の画期的な年であることを示す。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">業務自動化の新潮流</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">ChatGPTに「Work」</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>が<span style="color:#b0001e;font-weight:700;">7月</span>に<span style="color:#0d3461;font-weight:700;">ChatGPT Work</span>を導入。ユーザーの代わりに高度なタスクを実行するエージェント機能で、情報収集やアプリ連携を支援し、業務効率化を促進する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">「Claude Opus 5」登場</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">性能と価格で優位性</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>が<span style="color:#b0001e;font-weight:700;">7月24日</span>、<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>をリリース。高性能かつ<span style="color:#0d3461;font-weight:700;">Fable 5</span>の半額で提供され、知能指標とエージェント指標で首位を獲得した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">Gemini、高速版を投入</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">「Flash」が無料版に</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は<span style="color:#b0001e;font-weight:700;">7月21日</span>、より高速で安価な<span style="color:#0d3461;font-weight:700;">Gemini 3.6 Flash</span>をリリースし、無料版<span style="color:#0d3461;font-weight:700;">Gemini</span>アプリのデフォルトモデルとした。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">xAI、Grok 4.5を公開</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">コーディング特化型</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">xAI</span>は<span style="color:#b0001e;font-weight:700;">7月8日</span>に<span style="color:#0d3461;font-weight:700;">Grok 4.5</span>を一般公開した。これはコーディングに特化したモデルで、<span style="color:#0d3461;font-weight:700;">Cursor</span>との連携を強化している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">米州レベルでAI規制進む</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">賃貸価格操作を制限</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">7月20日</span>、<span style="color:#0d3461;font-weight:700;">ニュージャージー州</span>がアルゴリズムによる賃貸価格操作を禁じる「<span style="color:#0d3461;font-weight:700;">FAIR法</span>」を施行。米国の州レベルで<span style="color:#0d3461;font-weight:700;">AI</span>規制が加速している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">AIチップ設計革新</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">Synopsysが新技術</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Synopsys</span>は<span style="color:#b0001e;font-weight:700;">7月27日</span>、<span style="color:#0d3461;font-weight:700;">Microsoft Discovery</span>と連携した自律型<span style="color:#0d3461;font-weight:700;">AI</span>チップ設計ワークフローを発表。デバッグサイクルを<span style="color:#b0001e;font-weight:700;">40%</span>削減する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">医療現場に変革の波</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AIが診察室に</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">FDA承認も加速</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>はヘルスケア分野における<span style="color:#0d3461;font-weight:700;">AI</span>の「画期的な年」として注目を集めている。診断ツールから画期的ながん研究、リアルタイムの健康モニタリングを行うウェアラブル技術まで、<span style="color:#0d3461;font-weight:700;">AI</span>と医療の融合は、病気の検出、治療、予防の方法を再構築している。特に、米国の<span style="color:#0d3461;font-weight:700;">食品医薬品局（FDA）</span>の画期的医療機器パイプラインには、生成<span style="color:#0d3461;font-weight:700;">AI</span>を搭載した医療ツールが前例のないほど流入している。これには、<span style="color:#0d3461;font-weight:700;">X線</span>、<span style="color:#0d3461;font-weight:700;">MRI</span>、<span style="color:#0d3461;font-weight:700;">CTスキャン</span>の異常を人間以上の精度で検出する<span style="color:#0d3461;font-weight:700;">AI</span>モデル、患者データに基づいた個別化された治療プロトコルを生成するシステム、早期警告を検知する継続的な<span style="color:#0d3461;font-weight:700;">AI</span>駆動型モニタリングツールなどが含まれる。また、<span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#b0001e;font-weight:700;">7月23日</span>より、<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の健康機能を提供開始。医療文書や<span style="color:#0d3461;font-weight:700;">Apple Health</span>の情報をアップロード可能で、毎週<span style="color:#b0001e;font-weight:700;">3億人以上</span>が<span style="color:#0d3461;font-weight:700;">ChatGPT</span>を健康関連の質問に利用している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIインフラ競争、過熱</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">マイクロソフト</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">メタも投資拡大へ</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Microsoft</span>や<span style="color:#0d3461;font-weight:700;">Meta</span>などの大手テクノロジー企業が、<span style="color:#b0001e;font-weight:700;">AI</span>インフラへの投資をさらに拡大する姿勢を示している。データセンターや<span style="color:#0d3461;font-weight:700;">GPU</span>への継続的な投資により、<span style="color:#0d3461;font-weight:700;">AI</span>基盤の強化が進められている。 <span style="color:#b0001e;font-weight:700;">2026年7月</span>は「<span style="color:#0d3461;font-weight:700;">AI</span>投資の拡大」が主要テーマの一つとなり、企業向け<span style="color:#0d3461;font-weight:700;">AI</span>エージェントの実用化が加速する中で、その基盤となる計算資源の重要性が増している。 <span style="color:#0d3461;font-weight:700;">AMD</span>もまた、<span style="color:#b0001e;font-weight:700;">7月23日</span>に開催された「<span style="color:#0d3461;font-weight:700;">Advancing AI 2026</span>」イベントで、<span style="color:#0d3461;font-weight:700;">OpenAI</span>や<span style="color:#0d3461;font-weight:700;">Meta</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>から合計<span style="color:#b0001e;font-weight:700;">14GW</span>に及ぶ<span style="color:#0d3461;font-weight:700;">AI</span>計算コミットメントを獲得したと発表。 <span style="color:#0d3461;font-weight:700;">AMD</span>は<span style="color:#b0001e;font-weight:700;">2030年</span>までに<span style="color:#0d3461;font-weight:700;">AI</span>アクセラレーター市場が<span style="color:#b0001e;font-weight:700;">1.4兆ドル</span>に達するとの予測を上方修正するなど、<span style="color:#0d3461;font-weight:700;">AI</span>ハードウェアへの期待が過去最高に高まっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AIエージェント時代到来</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">自律型AIが</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">業務を革新</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>前半、最も注目された<span style="color:#0d3461;font-weight:700;">AI</span>トレンドは「自律型<span style="color:#0d3461;font-weight:700;">AI</span>エージェント」の急速な普及である。従来のチャット型から進化し、ユーザーの代わりにリサーチ、予約、ファイル整理、コード生成などを自律的に実行するエージェント型<span style="color:#0d3461;font-weight:700;">AI</span>が企業や個人の業務に浸透。会議の議事録作成、メール対応、データ分析など、多くの業務で<span style="color:#0d3461;font-weight:700;">AI</span>が実際の作業を担うケースが増えている。 <span style="color:#0d3461;font-weight:700;">Claude</span>や<span style="color:#0d3461;font-weight:700;">GPT-5</span>ベースのエージェントを活用した業務効率化の事例が多数報告され、「<span style="color:#b0001e;font-weight:700;">1人</span>で法人レベルの業務を回せるようになった」との声も聞かれる。また、プライバシーとコスト意識の高まりから、<span style="color:#0d3461;font-weight:700;">ノートPC</span>や<span style="color:#0d3461;font-weight:700;">スマートフォン</span>上で動作するローカル<span style="color:#0d3461;font-weight:700;">LLM</span>（大規模言語モデル）やオンデバイス<span style="color:#0d3461;font-weight:700;">AI</span>も爆発的に普及。オフラインでの文章生成や機密性の高い情報の安全な処理が可能となり、特にクリエイターの間で支持を集めている。</p></div></foreignObject>
