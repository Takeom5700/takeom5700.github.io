<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">GitHub開発者向け</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">Copilotモデル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">6種を段階廃止</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">GitHub</span>は、<span style="color:#0d3461;font-weight:700;">Copilot</span>の<span style="color:#b0001e;font-weight:700;">6</span>つのモデルを<span style="color:#b0001e;font-weight:700;">2026年10月19日</span>に全<span style="color:#0d3461;font-weight:700;">Copilot</span>環境から廃止すると発表しました。代替モデルとして、<span style="color:#0d3461;font-weight:700;">Gemini 3.7 Flash</span>は<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>へ、<span style="color:#0d3461;font-weight:700;">GPT-5.5</span>および<span style="color:#0d3461;font-weight:700;">GPT-5.4</span>は<span style="color:#0d3461;font-weight:700;">GPT-5.6 Sol</span>へ、<span style="color:#0d3461;font-weight:700;">GPT-5.4 mini</span>と<span style="color:#0d3461;font-weight:700;">GPT-5 mini</span>は<span style="color:#0d3461;font-weight:700;">GPT-5.6 Luna</span>へ、そして<span style="color:#0d3461;font-weight:700;">Grok 4.5</span>は<span style="color:#0d3461;font-weight:700;">Grok 4.6</span>へとそれぞれ移行が推奨されています。この廃止は、段階的な警告期間ではなく、期日以降は対象モデルが選択できなくなるため、開発チームは早急な対応が求められます。特に、明示的にモデルを指定している場合は、<span style="color:#b0001e;font-weight:700;">10月19日</span>の期限までに代替モデルへの切り替えを完了する必要があります。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">移行計画の重要性</p><p style="text-indent:1em;margin:0 0 2px;">企業は、<span style="color:#b0001e;font-weight:700;">10月19日</span>の期限までに固定されたモデルIDやポリシーのデフォルト設定を確認し、変更計画を立てることが不可欠です。<span style="color:#0d3461;font-weight:700;">GitHub</span>は、既存のエントリを削除するだけであれば特にアクションは不要としていますが、明示的なモデル選択を行っているチームは代替モデルへの変更が必須となります。発行されたマッピングは移行の出発点であり、後続モデルが以前と全く同じ動作をするという保証ではないため、綿密な評価とテストが推奨されます。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">モデル性能向上</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">Claude Sonnet</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">5.5を発表</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>は、<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>をリリースしました。この新しいモデルは、既存の<span style="color:#0d3461;font-weight:700;">Sonnet 5</span>と同等の価格設定（入力<span style="color:#b0001e;font-weight:700;">2ドル</span>/出力<span style="color:#b0001e;font-weight:700;">10ドル</span>）でありながら、キャッシュ読み取りは<span style="color:#b0001e;font-weight:700;">0.20ドル</span>とされています。タスク処理速度は<span style="color:#b0001e;font-weight:700;">30%以上</span>向上し、タスクごとのコストも最大<span style="color:#b0001e;font-weight:700;">30%</span>削減されました。<span style="color:#0d3461;font-weight:700;">Artificial Analysis Intelligence Index</span>では<span style="color:#b0001e;font-weight:700;">56.0</span>ポイントを獲得し、世界で<span style="color:#b0001e;font-weight:700;">2位</span>の評価を得ています。また、<span style="color:#0d3461;font-weight:700;">Terminal-Bench 4.0</span>では<span style="color:#b0001e;font-weight:700;">63.6%</span>という高いスコアを記録し、<span style="color:#0d3461;font-weight:700;">Opus 5.5</span>の<span style="color:#b0001e;font-weight:700;">59.6%</span>を上回りました。このモデルは、<span style="color:#0d3461;font-weight:700;">claude.ai</span>の無料ティアの基盤モデルとしても採用されています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">非営利団体向け</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">AIエージェント</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">新たなリスク</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">非営利団体は、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>の導入により新たなサイバーセキュリティリスクに直面しています。<span style="color:#0d3461;font-weight:700;">AIエージェント</span>は攻撃を迅速化し、検知を困難にする可能性があるため、組織はより厳格なアクセス制御と不審な動作に対する計画を策定する必要があります。特に小規模組織では、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>がアクセスできるシステムだけでなく、その<span style="color:#0d3461;font-weight:700;">AIエージェント</span>が実際に何を行うかを統制するための管理が必要です。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">最新動向</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">判断AI発表</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Microsoft</span>が判断に特化した<span style="color:#0d3461;font-weight:700;">AI</span>を発表しました。これは、特定の状況下での意思決定プロセスを支援するために設計されており、さまざまな業界での応用が期待されます。<span style="color:#0d3461;font-weight:700;">AI</span>の専門化が進む中で、特定のタスクを効率的かつ正確にこなすための技術開発が加速しています。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">Arm開発者会議</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Arm</span>は<span style="color:#b0001e;font-weight:700;">2026年10月19日</span>、<span style="color:#0d3461;font-weight:700;">サンノゼ</span>で無料の<span style="color:#0d3461;font-weight:700;">AI</span>開発者イベント「<span style="color:#0d3461;font-weight:700;">Arm Create</span>」を開催。</p></div></foreignObject>

<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>が警察に誤った情報を送信する事案が発生し、倫理的な課題が浮上しています。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">VolatoがSOAR AIへ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">社名変更と事業拡大</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Volato Group</span>は、<span style="color:#0d3461;font-weight:700;">AIインフラストラクチャ</span>事業の拡大に伴い、社名を<span style="color:#0d3461;font-weight:700;">SOAR AI</span>に変更すると発表しました。この変更は<span style="color:#b0001e;font-weight:700;">2026年10月19日</span>に発効する見込みで、<span style="color:#b0001e;font-weight:700;">10月20日</span>からは<span style="color:#0d3461;font-weight:700;">NYSE American</span>で新社名<span style="color:#0d3461;font-weight:700;">SOAR AI, Inc.</span>として取引が開始される予定です。この戦略は、顧客がデータ、モデル、コンピューティング環境をより詳細に制御できる<span style="color:#0d3461;font-weight:700;">AIインフラストラクチャ</span>を開発することに重点を置いています。同社は最近、<span style="color:#0d3461;font-weight:700;">AIインフラストラクチャ</span>プラットフォームの拡張資金として最大<span style="color:#b0001e;font-weight:700;">10億ドル</span>のエクイティファシリティを確保するなど、この分野への積極的な投資を続けています。これは、<span style="color:#0d3461;font-weight:700;">AIデータセンター</span>市場が<span style="color:#b0001e;font-weight:700;">2033年</span>までに<span style="color:#b0001e;font-weight:700;">8106億ドル</span>に達すると予測される中、同社の市場での存在感を強化する動きです。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIモデル競争</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">Claude Sonnet 5.5</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">驚異の性能</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>がリリースした<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>は、その性能で市場に大きな衝撃を与えています。このモデルは<span style="color:#0d3461;font-weight:700;">Artificial Analysis Intelligence Index v4.3.2</span>で<span style="color:#b0001e;font-weight:700;">56.0</span>ポイントを記録し、<span style="color:#0d3461;font-weight:700;">Opus 5.5</span>の<span style="color:#b0001e;font-weight:700;">57.6</span>に次ぐ世界<span style="color:#b0001e;font-weight:700;">2位</span>となりました。<span style="color:#0d3461;font-weight:700;">Claude Fable 5.1</span>の<span style="color:#b0001e;font-weight:700;">53.4</span>や<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>の<span style="color:#b0001e;font-weight:700;">52.7</span>をも上回っています。特に注目すべきは、<span style="color:#0d3461;font-weight:700;">Terminal-Bench 4.0</span>で<span style="color:#0d3461;font-weight:700;">Opus 5.5</span>の<span style="color:#b0001e;font-weight:700;">59.6%</span>を抑え、<span style="color:#b0001e;font-weight:700;">63.6%</span>を達成した点です。さらに、<span style="color:#0d3461;font-weight:700;">LiveBench Coding</span>では<span style="color:#b0001e;font-weight:700;">91.4%</span>、<span style="color:#0d3461;font-weight:700;">AutomationBench-AA</span>では<span style="color:#b0001e;font-weight:700;">71.3%</span>を記録し、その多岐にわたる能力を示しました。価格が主力モデルの<span style="color:#b0001e;font-weight:700;">5分の1</span>であるにも関わらず、一部のベンチマークで主力モデルを凌駕する性能を見せており、<span style="color:#0d3461;font-weight:700;">Anthropic</span>にとって異例の状況を生み出しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">サイバー対策</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AI時代のセキュリティ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">強化の急務</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AIエージェント</span>の普及は、サイバーセキュリティの脅威を劇的に変化させています。特に中小企業や非営利団体は、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>が攻撃をより速く、より発見しにくくする可能性があるため、より厳格なアクセス制御と不審な行動に対する明確な計画が必要です。企業セキュリティは、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>がアクセスできるものだけでなく、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>が実際に何を行うかを統制することに重点を置くべきです。一つの脆弱なシステムやベンダーが、寄付者、スタッフ、顧客のデータを露呈させる可能性があるため、非営利団体ではサイバーリスクの理事会レベルでの監督が優先事項となっています。データ漏洩や悪意のある<span style="color:#0d3461;font-weight:700;">AI</span>の利用を防ぐため、セキュリティガバナンスの強化が急務です。</p></div></foreignObject>
