<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">米国政府、AI国家安全保障を強化</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">米、中国製AIを連邦機関から排除</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">深層検索AI規制強化へ</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">トランプ</span>米政権は<span style="color:#b0001e;font-weight:700;">2026年10月20日</span>付で、中国の人工知能企業<span style="color:#0d3461;font-weight:700;">DeepSeek</span>社の製品を連邦政府機関の<span style="color:#0d3461;font-weight:700;">IT</span>システムから全面的に排除する指令を出した。この措置は国家安全保障上の懸念に基づくもので、機密データが中国に移転するリスクや、製品自体にマルウェアや脆弱性が含まれる可能性を指摘している。米国国土安全保障省(<span style="color:#0d3461;font-weight:700;">DHS</span>)は、<span style="color:#b0001e;font-weight:700;">DeepSeek</span>製の<span style="color:#0d3461;font-weight:700;">AI</span>モデルを連邦機関のシステムから削除するよう命じ、関連製品やサービスの新規購入も禁止した。この規制は<span style="color:#0d3461;font-weight:700;">DeepSeek</span>の関連会社や同社技術を用いた第三者サービスにも広範に適用される。今回の動きは、米中間の<span style="color:#0d3461;font-weight:700;">AI</span>技術格差が縮小する中、米国が中国のテクノロジー企業に対抗するための強硬な安全保障策の一環と見られる。<span style="color:#0d3461;font-weight:700;">DeepSeek</span>は<span style="color:#b0001e;font-weight:700;">2025年</span>に<span style="color:#0d3461;font-weight:700;">R1</span>モデルを発表し、世界市場と<span style="color:#0d3461;font-weight:700;">AI</span>業界に衝撃を与えていた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">成長著しいAIインフラ市場</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">AIサーバー市場、年内に</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">4790億ドル規模へ</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">TrendForce</span>社の最新予測によると、<span style="color:#b0001e;font-weight:700;">2026年</span>の世界<span style="color:#0d3461;font-weight:700;">AI</span>サーバー出荷台数は前年比<span style="color:#b0001e;font-weight:700;">32.2%</span>増の約<span style="color:#b0001e;font-weight:700;">282万</span>台に達する見込みだ。大手クラウドサービスプロバイダー(<span style="color:#0d3461;font-weight:700;">CSP</span>)からの強力な投資に加え、<span style="color:#0d3461;font-weight:700;">Tesla</span>や<span style="color:#0d3461;font-weight:700;">CoreWeave</span>といったティア2データセンター事業者からの購入も寄与している。今年の<span style="color:#0d3461;font-weight:700;">AI</span>サーバー市場価値は約<span style="color:#b0001e;font-weight:700;">4790億ドル</span>となり、サーバー市場全体の約<span style="color:#b0001e;font-weight:700;">75%</span>を占めるという。来年には市場価値が<span style="color:#b0001e;font-weight:700;">9200億ドル</span>に拡大し、サーバー市場全体の<span style="color:#b0001e;font-weight:700;">81%</span>に達すると予測されており、全体市場が初めて<span style="color:#b0001e;font-weight:700;">1兆ドル</span>を超える見込みだ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI倫理と法規制の動向</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">AI規制、ガイドラインから</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">強制力ある基準へ</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>、<span style="color:#0d3461;font-weight:700;">AI</span>の倫理およびガバナンスの枠組みは、単なる指針から強制力を持つ基準へと移行している。<span style="color:#0d3461;font-weight:700;">EU AI Act</span>がこの動きを主導し、不遵守に対する重大な罰則を課している。米国でも各州がチャットボットに特化した法案を多数提出しており、複雑な規制環境が形成されつつある。これにより、<span style="color:#0d3461;font-weight:700;">AI</span>を開発・導入する企業にとって、コンプライアンスは法的部門だけでなく、事業戦略の中核をなすものとなっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">ソフトウェア開発の自動化</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AIエージェント、単なる</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">コード提案からタスク実行へ</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>、<span style="color:#0d3461;font-weight:700;">AI</span>エージェントはコパイロットの域を超え、タスクの計画、テストの実行、さらにはプルリクエスト(<span style="color:#0d3461;font-weight:700;">PR</span>)の作成まで自律的に行う能力を獲得している。これにより、ソフトウェア開発のワークフローは大きく変革され、人間の関与を最小限に抑えながら、複雑なマルチステップタスクを処理することが可能になっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">LLM開発最前線</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">GPT-6 Astra等、新旗艦モデル</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>秋、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>、<span style="color:#0d3461;font-weight:700;">Google</span>が<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>を発表。マルチモーダル性能や安全性で競争激化。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">AIモデルの新たな潮流</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">小型高効率モデルが台頭</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">「より大きいほど良い」という常識が崩れ、<span style="color:#0d3461;font-weight:700;">Phi 4</span>のような小型モデルが一部推論タスクで大規模モデルを凌駕。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">数学界とAI</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">AIの数学問題解決に困惑</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">数学者<span style="color:#0d3461;font-weight:700;">テレンス・タオ</span>氏、<span style="color:#0d3461;font-weight:700;">AI</span>が数学の難問を解く現状に「建設的関与の方法が見いだせない」と発言。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">Nvidiaの戦略転換</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">Nvidia、オープンソース強化</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Nvidia</span>は<span style="color:#0d3461;font-weight:700;">AI</span>モデル戦略でオープンソースとデバイス上での展開を強化し、ユーザーの柔軟性向上を図る。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">AIのビジネス導入</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">AI開発はコア事業能力へ</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>、<span style="color:#0d3461;font-weight:700;">AI</span>開発は実験技術から企業の中核能力へと移行。効率、精度、意思決定を改善する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">半導体技術革新</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">AI半導体「メモリの壁」挑戦</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">IEEE</span>が<span style="color:#0d3461;font-weight:700;">AI</span>半導体の物理的限界「メモリの壁」打破へ次世代チップ設計者育成を開始。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AIと人の協働の新時代</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AIは「パートナー」へ進化、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">Microsoftが描く2026年の協業</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Microsoft</span>の<span style="color:#0d3461;font-weight:700;">AI</span>エクスペリエンス最高製品責任者である<span style="color:#0d3461;font-weight:700;">Aparna Chennapragada</span>氏は、<span style="color:#b0001e;font-weight:700;">2026年</span>がテクノロジーと人間の連携における新たな時代の幕開けになると見ている。これまでの<span style="color:#0d3461;font-weight:700;">AI</span>が質問に答え、問題解決を推論する段階だったとすれば、次の波は真のコラボレーションにあるという。<span style="color:#0d3461;font-weight:700;">Chennapragada</span>氏は「未来は人間を置き換えることではない。人間を増幅することだ」と強調する。<span style="color:#0d3461;font-weight:700;">AI</span>エージェントはデジタル同僚となり、個々人や小規模チームがその能力を最大限に引き出すのを助ける。例えば、<span style="color:#b0001e;font-weight:700;">3人</span>のチームが数日でグローバルキャンペーンを立ち上げ、<span style="color:#0d3461;font-weight:700;">AI</span>がデータ分析、コンテンツ生成、パーソナライゼーションを担い、人間が戦略と創造性を主導するような職場を構想している。人間が<span style="color:#0d3461;font-weight:700;">AI</span>と共に学び、働くことを前提に設計された組織が「両方の世界の最高の部分」を手に入れ、チームがより大きな創造的課題に取り組み、迅速に結果を出せると予測している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">ビジネスを変革する生成AI</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">生成AI、マルチモーダルと</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">エージェントシステムが新常態に</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>は生成<span style="color:#0d3461;font-weight:700;">AI</span>がビジネスのあらゆる側面で決定的な年となるだろう。特にマルチモーダル（テキスト、視覚、音声、データなどを組み合わせ処理）およびエージェントシステム（自律的に推論、計画、行動）の台頭が顕著だ。これらのシステムは、単純な質疑応答ではなく、エンドツーエンドのワークフロー全体を処理可能にする。例えば、「何を買うべきか教えて」から「見つけて、比較して、購入し、追跡して」といった包括的な指示を実行するようになる。企業は生成モジュールを意思決定ロジックやオーケストレーションツールと統合するパイプラインを構築する必要がある。<span style="color:#0d3461;font-weight:700;">AI</span>は受動的な反応から、人間からの絶え間ない指示なしに自ら開始、評価、反復する「プロアクティブ」なシステムへと進化している。また、医療や金融など実世界データが限られる業界では、生成<span style="color:#0d3461;font-weight:700;">AI</span>が合成データ生成を加速させている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">信頼性の壁とAIガバナンス</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AIコーディングツール、普及と</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">不信感の狭間で進化</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>のソフトウェア開発では、開発者の<span style="color:#b0001e;font-weight:700;">84%</span>が<span style="color:#0d3461;font-weight:700;">AI</span>コーディングツールを使用しているものの、その生成物を信頼する割合は<span style="color:#b0001e;font-weight:700;">29%</span>にまで低下している。「ほぼ正しいが、完全ではない」という不満が主な原因だ。<span style="color:#0d3461;font-weight:700;">AI</span>は統合開発環境(<span style="color:#0d3461;font-weight:700;">IDE</span>)の外、継続的インテグレーション/デリバリー(<span style="color:#0d3461;font-weight:700;">CI/CD</span>)、デプロイ、オブザーバビリティの領域へと拡大している。<span style="color:#0d3461;font-weight:700;">Gartner</span>は年末までに企業アプリケーションの<span style="color:#b0001e;font-weight:700;">40%</span>が<span style="color:#0d3461;font-weight:700;">AI</span>エージェントを搭載すると予測している。しかし、<span style="color:#0d3461;font-weight:700;">EU AI Act</span>の厳格化が<span style="color:#b0001e;font-weight:700;">2026年8月</span>に迫り、コンプライアンスは法務部門から<span style="color:#0d3461;font-weight:700;">CI/CD</span>パイプラインへと移行しつつある。スケールする前に人間によるチェックポイントと監査ログを構築し、ガバナンスをアーキテクチャの一部として扱うことが重要だ。</p></div></foreignObject>
