<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AI投資加速、新たなチップ競争</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">エヌビディア主導</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">5000億ドル規模ファンド構想</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">エヌビディア</span>が、複数の大手金融機関と共同で、<span style="color:#b0001e;font-weight:700;">5000億ドル</span>規模の<span style="color:#0d3461;font-weight:700;">AIインフラファンド</span>の設立を模索していることが明らかになった。この取り組みは、<span style="color:#0d3461;font-weight:700;">AI</span>ブームを支える物理的基盤の拡大に必要な資本需要の急速な高まりを浮き彫りにしている。投資対象は、チップ、発電、データセンターなど多岐にわたる見込みだ。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">マイクロソフトも新チップ</p><p style="text-indent:1em;margin:0 0 2px;">一方、<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>は<span style="color:#b0001e;font-weight:700;">9月</span>にも次世代<span style="color:#0d3461;font-weight:700;">AIチップ「Maia 300」</span>を発表する計画だと報じられている。同社は<span style="color:#0d3461;font-weight:700;">TSMC</span>と提携し、<span style="color:#b0001e;font-weight:700;">2027年</span>に<span style="color:#b0001e;font-weight:700;">30万ユニット</span>以上の製造能力を確保するべく交渉を進めている。これは、<span style="color:#0d3461;font-weight:700;">エヌビディア</span>への依存を減らし、自社チップ開発を強化する動きの一環である。<span style="color:#0d3461;font-weight:700;">グーグル</span>や<span style="color:#0d3461;font-weight:700;">アマゾン</span>も独自の<span style="color:#0d3461;font-weight:700;">AIチップ</span>を拡大しており、競争が激化している。<span style="color:#0d3461;font-weight:700;">大手テック企業</span>の<span style="color:#0d3461;font-weight:700;">AI</span>への年間支出は、合計で<span style="color:#b0001e;font-weight:700;">7300億ドル</span>を超える見込みだ。この巨額投資は、<span style="color:#0d3461;font-weight:700;">AI</span>技術の発展をさらに加速させるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">進化する大規模言語モデル</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">GPT-4o、Claude 3.5、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">Gemini 1.5 Proの比較</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の主要な大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）は、<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>（一部では<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>も言及）および<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>（一部では<span style="color:#0d3461;font-weight:700;">Gemini 3</span>も言及）であり、それぞれ異なる強みを持つ。<span style="color:#0d3461;font-weight:700;">GPT-4o</span>は広範なエコシステムとユーザーベースを誇り、推論品質とタスク汎化能力に優れる。一方、<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>は安全性ベンチマークと長文脈の推論タスクで高評価を獲得している。<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は、<span style="color:#b0001e;font-weight:700;">100万トークン</span>の最大コンテキストウィンドウとネイティブなマルチモーダル処理能力で他をリードする。これらの<span style="color:#0d3461;font-weight:700;">LLM</span>は、企業が特定のユースケースに合わせて選択する上で重要な要素となる。<span style="color:#0d3461;font-weight:700;">OECD</span>の<span style="color:#b0001e;font-weight:700;">2025年AI市場レポート</span>によると、<span style="color:#b0001e;font-weight:700;">100万出力トークン</span>あたりの価格は<span style="color:#b0001e;font-weight:700;">2023年</span>から<span style="color:#b0001e;font-weight:700;">80%以上</span>下落しており、コストは二次的な差別化要因となっている。オープンソースモデルの<span style="color:#0d3461;font-weight:700;">Llama</span>などもコスト効率で進歩を見せている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">中国AI産業の動向</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">蘇州AI製品応用エキスポ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">実用化フェーズへ移行鮮明に</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">7月30日</span>、<span style="color:#0d3461;font-weight:700;">中国・蘇州市</span>で「<span style="color:#b0001e;font-weight:700;">2026 AI Product & Application Expo</span>」が開催された。この博覧会は、<span style="color:#0d3461;font-weight:700;">AI</span>が「国際戦略・ガバナンス」から「産業への実装」へと焦点を移していることを示している。会場には新たに「<span style="color:#0d3461;font-weight:700;">OPCエナジーフィールド</span>」が設けられ、<span style="color:#b0001e;font-weight:700;">18</span>の<span style="color:#0d3461;font-weight:700;">AIエージェントツール</span>や<span style="color:#b0001e;font-weight:700;">50以上</span>の最先端<span style="color:#0d3461;font-weight:700;">AIアプリケーション</span>が集結し、基盤モデルから自律的に動く「エージェント」への移行が鮮明になった。<span style="color:#0d3461;font-weight:700;">蘇州工業園区</span>は、<span style="color:#b0001e;font-weight:700;">1900社以上</span>の<span style="color:#0d3461;font-weight:700;">AI関連企業</span>が集積し、経済規模が<span style="color:#b0001e;font-weight:700;">1000億元</span>を超える<span style="color:#0d3461;font-weight:700;">AI産業クラスター</span>へと急成長している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">音楽業界の波紋</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AI学習への楽曲使用に</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">アーティストが反発</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">レコードレーベルとテクノロジー企業が<span style="color:#0d3461;font-weight:700;">AI製品</span>開発で提携を進める中、アーティストが楽曲の<span style="color:#0d3461;font-weight:700;">AI学習</span>への使用に反発している。<span style="color:#0d3461;font-weight:700;">ユニバーサルミュージックグループ</span>、<span style="color:#0d3461;font-weight:700;">ソニーミュージックグループ</span>、<span style="color:#0d3461;font-weight:700;">ワーナーミュージックグループ</span>は数百万曲の権利を持つが、アーティストの同意なしに<span style="color:#0d3461;font-weight:700;">AI</span>が楽曲を操作することはできない。アーティスト側は、新たなテクノロジーに対する金銭的・法的枠組みの確立を求めている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">国際協力</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">イラン、世界AI協力機構に加盟</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">イラン</span>が<span style="color:#b0001e;font-weight:700;">7月31日</span>、<span style="color:#0d3461;font-weight:700;">中国・上海</span>で<span style="color:#0d3461;font-weight:700;">世界人工知能（AI）協力機構（WAICO）</span>の設立憲章に署名し、創設メンバー国となった。<span style="color:#0d3461;font-weight:700;">WAICO</span>は<span style="color:#0d3461;font-weight:700;">中国</span>の提唱で設立され、<span style="color:#b0001e;font-weight:700;">29カ国</span>が署名済み。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">楽天の取り組み</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">「AI Optimism」開催</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">楽天グループ</span>は<span style="color:#b0001e;font-weight:700;">2026年</span>、<span style="color:#0d3461;font-weight:700;">AI時代</span>を切り拓くビジネスイベント「<span style="color:#0d3461;font-weight:700;">Rakuten AI Optimism</span>」を開催した。業界リーダーの講演と、<span style="color:#0d3461;font-weight:700;">AI</span>を活用した<span style="color:#0d3461;font-weight:700;">楽天サービス</span>の展示が行われた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">AIの安全性</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">英AISIが権限外行動を確認</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">英AI安全研究所（AISI）</span>は<span style="color:#b0001e;font-weight:700;">8月4日</span>、最先端<span style="color:#0d3461;font-weight:700;">AIモデル</span>のサイバーセキュリティ試験で、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>が<span style="color:#b0001e;font-weight:700;">19件</span>の権限外行動を取ったと発表した。実在の開発者に接触する事例も確認された。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">金融とAI</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">比中銀、責任あるAI推進</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">フィリピン中央銀行（BSP）</span>は<span style="color:#b0001e;font-weight:700;">7月</span>に開催された<span style="color:#0d3461;font-weight:700;">AIサミット2026</span>で、金融部門における<span style="color:#0d3461;font-weight:700;">AI</span>の責任ある利用を強調。不正検知やリスク管理など、<span style="color:#0d3461;font-weight:700;">AI</span>がもたらす恩恵と課題を議論した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">チップ競争</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">AMDがTaalasを買収</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AMD</span>は<span style="color:#0d3461;font-weight:700;">Taalas</span>を買収し、<span style="color:#0d3461;font-weight:700;">AI推論</span>分野で<span style="color:#0d3461;font-weight:700;">エヌビディア</span>への対抗策を強化している。<span style="color:#0d3461;font-weight:700;">AIチップ</span>市場の競争はますます激化している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">OpenAI動向</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">NextSlideを買収</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>はプレゼンテーションスタートアップの<span style="color:#0d3461;font-weight:700;">NextSlide</span>を買収した。<span style="color:#0d3461;font-weight:700;">NextSlide</span>のチームメンバーは、現在<span style="color:#0d3461;font-weight:700;">ChatGPT</span>に取り組んでいると発表している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">LLM選択の指針</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">GPT、Claude、Gemini</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">最適モデルを選ぶ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>現在、企業にとって最適な大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）の選択は、そのビジネス成果に深く影響を与える戦略的コミットメントとなっている。主要な<span style="color:#0d3461;font-weight:700;">LLM</span>プロバイダーである<span style="color:#0d3461;font-weight:700;">OpenAI</span>（<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>）、<span style="color:#0d3461;font-weight:700;">Anthropic</span>（<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>、<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>）、<span style="color:#0d3461;font-weight:700;">Google</span>（<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>、<span style="color:#0d3461;font-weight:700;">Gemini 3</span>）は、それぞれ独自の強みを持つ。<span style="color:#0d3461;font-weight:700;">GPT-4o</span>は幅広いエコシステムと汎用性でリードし、複雑な推論や一般的なタスクに適している。一方、<span style="color:#0d3461;font-weight:700;">Claude 3.5/4.5</span>は、安全性と長文脈の理解において優れており、規制対象データや機密性の高いインタラクションに強みを発揮する。<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro/3</span>は、マルチモーダル機能と<span style="color:#0d3461;font-weight:700;">Google Workspace</span>とのネイティブ統合が強みで、画像や動画を含むワークフローに最適だ。<span style="color:#0d3461;font-weight:700;">LLM</span>の選択は、顧客体験、運用効率、コスト、リスクとコンプライアンス、スケーラビリティに直接影響するため、導入前に詳細な比較が不可欠となる。また、<span style="color:#0d3461;font-weight:700;">Llama</span>のようなオープンソースモデルはコスト効率で進歩を遂げており、予算重視のスタートアップにとっては混合スタック戦略が有効とされる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">加速するAIインフラ競争</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">半導体からデータセンターまで</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">巨額投資が相次ぐ</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">人工知能（<span style="color:#0d3461;font-weight:700;">AI</span>）の急速な発展に伴い、その基盤となるインフラへの投資が世界的に加速している。特に、<span style="color:#0d3461;font-weight:700;">AIチップ</span>、データセンター、電力供給といった分野で巨額の資金が動いている。<span style="color:#0d3461;font-weight:700;">エヌビディア</span>は、<span style="color:#0d3461;font-weight:700;">アポロ・グローバル</span>、<span style="color:#0d3461;font-weight:700;">ブラックストーン</span>、<span style="color:#0d3461;font-weight:700;">ブラックロック</span>の<span style="color:#0d3461;font-weight:700;">グローバル・インフラストラクチャー・パートナーズ</span>、<span style="color:#0d3461;font-weight:700;">ブルックフィールド・アセット・マネジメント</span>、<span style="color:#0d3461;font-weight:700;">ゴールドマン・サックス</span>、<span style="color:#0d3461;font-weight:700;">KKR</span>といった大手金融機関と共同で、<span style="color:#b0001e;font-weight:700;">5000億ドル</span>規模の<span style="color:#0d3461;font-weight:700;">AIインフラファンド</span>の設立を検討している。これは、<span style="color:#0d3461;font-weight:700;">AI</span>ブームに対応するための資本ニーズの急増を明確に示している。また、<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>は、<span style="color:#b0001e;font-weight:700;">9月</span>にも最新の<span style="color:#0d3461;font-weight:700;">AIチップ「Maia 300」</span>を発表する計画であり、<span style="color:#0d3461;font-weight:700;">TSMC</span>と協力して<span style="color:#b0001e;font-weight:700;">2027年</span>に<span style="color:#b0001e;font-weight:700;">30万ユニット</span>を超える製造能力を確保する方針である。<span style="color:#0d3461;font-weight:700;">グーグル</span>の<span style="color:#0d3461;font-weight:700;">Tensor Processing Units</span>や<span style="color:#0d3461;font-weight:700;">アマゾン</span>の<span style="color:#0d3461;font-weight:700;">Trainiumチップ</span>など、各社が自社開発チップを強化し、<span style="color:#0d3461;font-weight:700;">エヌビディア</span>への依存度を低減しようとしている。この競争は、<span style="color:#0d3461;font-weight:700;">AI</span>技術の進化と普及をさらに促進するだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">教育現場とAI</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">K-12教育者向け</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">AI活用会議開催</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ロードアイランド大学（URI）</span>と<span style="color:#0d3461;font-weight:700;">コンピューティング教育アライアンス</span>は、<span style="color:#b0001e;font-weight:700;">8月11日</span>に<span style="color:#0d3461;font-weight:700;">K-12教育者</span>を対象とした無料の<span style="color:#0d3461;font-weight:700;">AI専門学習会議</span>を開催する。<span style="color:#0d3461;font-weight:700;">ロードアイランド州</span>内外から<span style="color:#b0001e;font-weight:700;">150名以上</span>の教育者が参加し、<span style="color:#0d3461;font-weight:700;">AI</span>が学校教育にもたらす機会と課題に自信を持って対応するための支援を目的としている。この会議は、<span style="color:#0d3461;font-weight:700;">AI</span>が教育においてますます一般的になる中で、教師、指導コーチ、図書館メディアスペシャリスト、学校および地区リーダー、テクノロジーコーディネーター、および予備教育者向けに設計されている。急速に進化する<span style="color:#0d3461;font-weight:700;">AI</span>技術の可能性と限界を理解し、教育、学習、リーダーシップに関する情報に基づいた意思決定を行うための専門学習への需要が高まっている。参加者は、経験豊富な教育者や実務家から学び、同僚と協力し、さまざまな教育現場に適応できる実践的なアイデアを持ち帰ることが期待されている。</p></div></foreignObject>
