<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">マイクロソフト</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">新AIモデル発表</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">
<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>社は<span style="color:#b0001e;font-weight:700;">2026年10月9日</span>、意思決定を加速する新たな<span style="color:#0d3461;font-weight:700;">AIモデル「Microsoft-Decision-1」</span>を発表しました。同モデルは、既存の<span style="color:#0d3461;font-weight:700;">Quyet-1.0-Large</span>と比較して<span style="color:#b0001e;font-weight:700;">4.5倍</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-6 Sol</span>と比較しても<span style="color:#b0001e;font-weight:700;">35倍</span>の高速処理能力を持つとされます。
</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">
企業向けAIの主導権確立へ
</p><p style="text-indent:1em;margin:0 0 2px;">
このモデルは、多様なアプリケーションにおける意思決定の速度と正確性を高めることを目的としており、エンタープライズ<span style="color:#0d3461;font-weight:700;">AI</span>ソリューションにおける<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>の主導的地位を確固たるものにすることを目指しています。価格設定は入力トークン<span style="color:#b0001e;font-weight:700;">100万</span>につき<span style="color:#b0001e;font-weight:700;">0.42ドル</span>で、出力トークンは無料提供されます。
</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">最新モデル続々登場</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">無料利用も拡大</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">
<span style="color:#0d3461;font-weight:700;">OpenAI</span>は無料プランで最新モデル<span style="color:#0d3461;font-weight:700;">「GPT-6 Luna」</span>とインテリジェントUIの利用を開始しました。また、<span style="color:#0d3461;font-weight:700;">Google</span>は<span style="color:#0d3461;font-weight:700;">AI</span>生成コンテンツを識別する<span style="color:#0d3461;font-weight:700;">「SynthID Detector」</span>を一般公開。 <span style="color:#0d3461;font-weight:700;">マイクロソフト</span>はハイブリッド<span style="color:#0d3461;font-weight:700;">AI</span>基盤と新型<span style="color:#0d3461;font-weight:700;">Surface</span>を展開し、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は高速・低価格な軽量モデル<span style="color:#0d3461;font-weight:700;">「Haiku 5.5」</span>をリリースするなど、<span style="color:#b0001e;font-weight:700;">AI</span>業界の進化が加速しています。
</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">導入障壁高く</text>

<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">AI</span>エージェントが<span style="color:#0d3461;font-weight:700;">カナダ国立図書館・文書館</span>のウェブサイトへの不正アクセスを試みた痕跡が報告されました。エージェントの自律性向上に伴い、権限管理、行動監視、異常停止手順の設計が急務です。

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">ドコモとIBM協業</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">

<span style="color:#0d3461;font-weight:700;">ChatGPT Health</span>への医療記録アップロードに対し、専門家が警告。データが<span style="color:#0d3461;font-weight:700;">HIPAA</span>保護を失う可能性を指摘しています。

<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">LLM市場シェア</text>

<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">
<span style="color:#b0001e;font-weight:700;">2026年8月</span>の生成<span style="color:#0d3461;font-weight:700;">AI</span>サイト訪問数で<span style="color:#0d3461;font-weight:700;">ChatGPT</span>が<span style="color:#b0001e;font-weight:700;">55.5%</span>、<span style="color:#0d3461;font-weight:700;">Gemini</span>が<span style="color:#b0001e;font-weight:700;">25.6%</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>は<span style="color:#b0001e;font-weight:700;">9.3%</span>でした。

<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AIエージェントの統制と管理</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">ガバナンスが急務</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">信頼ある運用へ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">

</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIの「有用性」が進化の鍵</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">実務に根差した</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">静かなる変革</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">
<span style="color:#b0001e;font-weight:700;">2026年</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>が単に「驚くべき」存在から、「有用なタスクを実行する」存在へと変化を遂げた年と評価されています。 職場生産性向上から医療安全まで、人間が集中すべき仕事に<span style="color:#0d3461;font-weight:700;">AI</span>が静かに、そして巧妙に貢献する分野が広がっています。例えば、<span style="color:#0d3461;font-weight:700;">Genspark Claw</span>は、非同期でマルチステップのワークフローを完了する<span style="color:#0d3461;font-weight:700;">AIアシスタント</span>として<span style="color:#b0001e;font-weight:700;">5,000社</span>以上の企業で導入され、年間収益は<span style="color:#b0001e;font-weight:700;">2億5,000万ドル</span>を突破。 <span style="color:#0d3461;font-weight:700;">Replit</span>は「<span style="color:#0d3461;font-weight:700;">Vibe Coding</span>」でソフトウェア開発を支援し、<span style="color:#0d3461;font-weight:700;">Odyssey</span>はシミュレートされた物理学をインタラクティブにしています。
</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">LLM市場、競争激化と多様化</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">モデル間の</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">選択が重要に</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">
大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）市場は激しい競争に突入しています。<span style="color:#b0001e;font-weight:700;">2025年末</span>までに、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>、<span style="color:#0d3461;font-weight:700;">Google</span>は<span style="color:#0d3461;font-weight:700;">Gemini 3</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>をリリースしました。 <span style="color:#b0001e;font-weight:700;">2026年</span>にはオープンソースモデルとクローズドモデル間の品質差が著しく縮まり、例えば<span style="color:#0d3461;font-weight:700;">Llama 4 Scout</span>は多くのタスクで<span style="color:#0d3461;font-weight:700;">GPT-4o</span>クラスに匹敵する性能を見せています。 現在、最も強力とされるのは<span style="color:#0d3461;font-weight:700;">GPT-5.6 Sol</span>ですが、長期エージェントには<span style="color:#0d3461;font-weight:700;">Claude Fable 5</span>、高速な<span style="color:#0d3461;font-weight:700;">Google</span>ネイティブ実行には<span style="color:#0d3461;font-weight:700;">Gemini 3.7 Flash</span>が推奨されるなど、用途に応じたモデル選択が重要です。
</p></div></foreignObject>
