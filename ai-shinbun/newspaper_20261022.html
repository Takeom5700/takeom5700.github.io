<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AI経済圏が拡大</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">スペースX、AI部門が急成長</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">生成AI、世界で53%利用</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">スペースX</span>の<span style="color:#0d3461;font-weight:700;">スーパーインテリジェンスAIユニット</span>が、<span style="color:#b0001e;font-weight:700;">2026年第3四半期</span>に<span style="color:#b0001e;font-weight:700;">75.6億ドル</span>の売上を計上し、前四半期から約<span style="color:#b0001e;font-weight:700;">3倍</span>に急増した。同部門は<span style="color:#0d3461;font-weight:700;">Anthropic</span>などに計算能力をリースし、<span style="color:#0d3461;font-weight:700;">スターリンク</span>を上回る収益源となった。この成長はAIのビジネス統合を反映している。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">企業はAIを業務に再構築</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#b0001e;font-weight:700;">スタンフォードAIインデックス2026</span>によれば、生成AIは<span style="color:#b0001e;font-weight:700;">3年</span>で世界的に<span style="color:#b0001e;font-weight:700;">53%</span>の利用率に到達。小規模チームでも<span style="color:#b0001e;font-weight:700;">5人</span>体制企業と同等の成果が可能となり、企業はAIを活用した新ワークフロー再構築が求められている。 <span style="color:#0d3461;font-weight:700;">マイクロソフト</span>の<span style="color:#0d3461;font-weight:700;">BioEmu</span>や<span style="color:#0d3461;font-weight:700;">BindCraft</span>はタンパク質設計を進化させ、<span style="color:#0d3461;font-weight:700;">Claude Opus 4.7</span>はロボット犬のプログラミングを昨年比<span style="color:#b0001e;font-weight:700;">20倍</span>高速化した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">最新LLM動向</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">Claude Haiku 5.5発表</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">Gemini 4 Argonも提供開始</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>は<span style="color:#b0001e;font-weight:700;">10月7日</span>に<span style="color:#0d3461;font-weight:700;">Claude Haiku 5.5</span>をリリース。これは<span style="color:#b0001e;font-weight:700;">1M</span>コンテキストと適応的思考能力を持つ。 <span style="color:#0d3461;font-weight:700;">Google</span>も<span style="color:#b0001e;font-weight:700;">10月13日</span>、<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>の一般提供を開始し、<span style="color:#0d3461;font-weight:700;">Geminiスキル</span>などでAIエコシステムを拡大。従来のチャットを超えた利用を推進する。 <span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-6</span>にはインタラクティブな<span style="color:#0d3461;font-weight:700;">Intelligent UI</span>が導入され、大手各社が新機能で競争。これにより、研究やコーディングなど複雑なタスクでのAI活用がさらに進むだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI半導体戦略</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">中古GPUでAI基盤</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">製造業向けに提供開始</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">エクストリームーD</span>、<span style="color:#0d3461;font-weight:700;">TES-AMM JAPAN</span>、<span style="color:#0d3461;font-weight:700;">Cornelis Networks</span>の<span style="color:#b0001e;font-weight:700;">3社</span>は<span style="color:#b0001e;font-weight:700;">10月20日</span>、中古GPUサーバーを活用した企業向けAIインフラサービス「<span style="color:#0d3461;font-weight:700;">Raplase RCA</span>」の提供を開始した。 機密データを扱う製造業が求める「プライベートAI」環境を、低コストかつ短納期で構築できる。AIインフラの需要急増とGPU価格高騰・調達難が課題となる中、型落ちGPUの循環利用が新たな選択肢として注目されている。これにより、オーバースペックに多額の費用を払う必要がなくなるという。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">企業投資</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">Tenstorrent、15億ドル調達</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">$6.2B評価</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">AIチップ開発企業の<span style="color:#0d3461;font-weight:700;">Tenstorrent</span>は、<span style="color:#0d3461;font-weight:700;">Fidelity</span>、<span style="color:#0d3461;font-weight:700;">ARK</span>、<span style="color:#0d3461;font-weight:700;">Morgan Stanley</span>などから<span style="color:#b0001e;font-weight:700;">15億ドル</span>のシリーズE資金を調達し、企業評価額は<span style="color:#b0001e;font-weight:700;">62億ドル</span>に達した。 これはAI半導体分野への投資熱の高まりを示すものだ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">タンパク質設計</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">マイクロソフトが進化</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">マイクロソフト</span>の<span style="color:#0d3461;font-weight:700;">BioEmu</span>と<span style="color:#0d3461;font-weight:700;">BindCraft</span>がタンパク質設計でブレークスルーを達成。創薬や新素材開発への応用が期待される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">ロボティクス</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">Claude Opus 4.7が効率化</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude Opus 4.7</span>がロボット犬のプログラミングを昨年比<span style="color:#b0001e;font-weight:700;">20倍</span>高速化。ロボット開発の加速に貢献。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">AIの知性</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">Gemini Deep Thinkが快挙</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google Gemini Deep Think</span>が国際数学オリンピックで金メダルレベルの成績を達成。AIの高度な推論能力を示す。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">半導体開発</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">NVIDIAなしで大規模モデル</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NVIDIA</span>チップを使わずに<span style="color:#b0001e;font-weight:700;">1.6兆</span>パラメーターのオープンウェイトモデルが訓練に成功。新たな道を開く。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">Siri進化</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">Apple、会話能力強化</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Apple</span>は<span style="color:#0d3461;font-weight:700;">Siri</span>をより会話的で文脈を理解するAIへと進化させる。デバイス連携も強化され利便性向上へ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">Copilot機能拡張</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">Microsoft、Windowsと連携</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Microsoft</span>は<span style="color:#0d3461;font-weight:700;">Windows</span>と<span style="color:#0d3461;font-weight:700;">Copilot</span>のAI連携を拡大。ローカルファイル検索やクラウド連携で生産性向上へ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">エネルギー問題</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">トランプ氏、AIデータセンターに</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">自家発電義務化を提案</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アメリカ</span>の<span style="color:#0d3461;font-weight:700;">トランプ大統領</span>は<span style="color:#b0001e;font-weight:700;">21日</span>、AIデータセンター建設企業に対し、自家発電による電力確保を義務付ける考えを示した。 国内ではAI運用に必要な大量のコンピューターを収容するデータセンター建設が相次いでおり、周辺住民からは電気代高騰や環境への影響を懸念する声が上がっている。これに対し<span style="color:#0d3461;font-weight:700;">トランプ大統領</span>は、新たに建設される大規模データセンターには自家発電を義務付け、余剰電力を地域や送電網に無償提供または販売するよう命じると表明した。 さらに、企業がデータセンターへの支持を得たいのであれば、地域社会に「配当」を支払うべきとの考えも示している。データセンター問題は中間選挙の争点の一つとなっており、急増するデータセンターへの住民の反発を抑える狙いがある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIの未来</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">Anthropic共同創業者</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">「自己改善AI」27年にも実現</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>共同創業者である<span style="color:#0d3461;font-weight:700;">ジャック・クラーク</span>氏は、AIが自ら後継AIを開発できる「再帰的自己改善（<span style="color:#0d3461;font-weight:700;">RSI</span>）」が<span style="color:#b0001e;font-weight:700;">2027年</span>に実現可能になる確率を<span style="color:#b0001e;font-weight:700;">50％以上</span>と予測した。 これはAIによる数学研究や実験設計能力の急速な進歩を受け、従来の予測を約<span style="color:#b0001e;font-weight:700;">1年</span>前倒ししたものだ。しかし、自己改善を実際に開始することには大きなリスクが伴い、能力の実現と実行は別問題であると強調している。AIが自律的に進化する可能性は、その恩恵と同時に、制御不能になるリスクも孕んでおり、倫理的な議論と厳格なガバナンスの必要性が改めて浮上している。国際社会では、AIの能力向上と安全性の両立に向けた取り組みが加速しているが、技術の進歩は予測を超える速さで進展しており、対応が急務となっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">安全保障</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">国連、「AI兵器」に警告</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">人間判断の排除進む</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">国連</span>の独立系軍縮研究機関<span style="color:#0d3461;font-weight:700;">UNIDIR</span>の<span style="color:#0d3461;font-weight:700;">ロビン・ガイス</span>所長は<span style="color:#b0001e;font-weight:700;">20日</span>、AIが戦場で広く使用され、軍事作戦における人間の判断の役割が急速に縮小していると警鐘を鳴らした。 「機械に人間を標的にさせ、殺させるのか」と問いかけ、AIがますます「人間の意思決定を排除する方向に向かっている」と警告。AIには情報分析、標的識別からドローン操作、サイバー攻撃の組織化まで、軍事分野でますます多くの責任が与えられている。 これは人間の判断、特に核領域における判断を犠牲にして進んでおり、戦場における作戦ペースを劇的に加速させ、誤算や意図しないエスカレーションのリスクを高めている。 また、AIツールが使いやすくなるにつれて、非国家主体もより高度な軍事作戦に関与しやすくなると指摘。地政学的な競争は規制の「深刻な障害」としつつも、リスクへの懸念は政治的見解にかかわらず共有されつつあると述べた。</p></div></foreignObject>
