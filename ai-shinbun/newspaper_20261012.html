<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">革新の対話体験</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">GPT-6、「UI」と</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">無料版「Luna」搭載</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#0d3461;font-weight:700;">ChatGPT</span>に新モデル「<span style="color:#0d3461;font-weight:700;">GPT-6</span>」を搭載し、順次提供を開始した。テキストに加え、図や操作可能なボタン、フォームなどを回答として生成する「<span style="color:#b0001e;font-weight:700;">Intelligent UI</span>」を導入。これにより、顧客向けダッシュボードやセルフサービスツールの構築コストを大幅削減できる見込みだ。また、思考しながら回答を出力する機能も備える。有料プランから提供が始まり、翌日には無料プランや<span style="color:#0d3461;font-weight:700;">Go</span>プランにも展開される予定で、無料版では軽量版「<span style="color:#0d3461;font-weight:700;">GPT-6 Luna</span>」が利用可能となる。<span style="color:#0d3461;font-weight:700;">OpenAI</span>は、<span style="color:#b0001e;font-weight:700;">AI</span>の利益は一部の害を受け入れることを正当化すると主張しており、幅広いアクセスを推進する姿勢を示している。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">業界への影響</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#b0001e;font-weight:700;">AI</span>モデルの性能競争だけでなく、コスト、アクセシビリティ、信頼性が重要視される時代に突入している。今回の「<span style="color:#b0001e;font-weight:700;">Intelligent UI</span>」の導入は、非エンジニアでも<span style="color:#b0001e;font-weight:700;">AI</span>を活用したアプリケーション開発を容易にし、ビジネスシーンでの<span style="color:#b0001e;font-weight:700;">AI</span>活用の裾野を広げることが期待される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">Gemini進化</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">Google「</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">Gemini 4 Argon」発表、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1173" y="24" clip-path="url(#c2)">思考レベル選択可能に</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">Google</span>はフロンティアモデル「<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>」を発表した。ソフトウェア開発、法律・金融などの知識労働、サイバーセキュリティを主な対象とし、長時間業務フローを扱える設計が特徴である。最大<span style="color:#b0001e;font-weight:700;">100万トークン</span>の出力上限を持ち、初期段階では信頼できるサイバーセキュリティテスターに提供される。また、<span style="color:#0d3461;font-weight:700;">Gemini</span>アプリでは、<span style="color:#b0001e;font-weight:700;">2026年10月上旬</span>に<span style="color:#b0001e;font-weight:700;">AI</span>モデルの思考レベルを「安」「中」「高」の<span style="color:#b0001e;font-weight:700;">3段階</span>から指定できるよう変更された。<span style="color:#0d3461;font-weight:700;">Pro</span>モデルでは「<span style="color:#b0001e;font-weight:700;">Deep Think</span>」も選択可能で、ユーザーは用途に応じて<span style="color:#b0001e;font-weight:700;">AI</span>の挙動をより細かく制御できるようになった。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">安全性確保</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">マイクロソフト、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">AIに「緊急停止装置」を</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">マイクロソフト</span>の<span style="color:#0d3461;font-weight:700;">サティア・ナデラ</span><span style="color:#0d3461;font-weight:700;">CEO</span>は、強力な<span style="color:#b0001e;font-weight:700;">AI</span>モデルを潜在的な内部脅威とみなし、「緊急停止装置」システムの構築を提唱した。<span style="color:#0d3461;font-weight:700;">ナデラ氏</span>は、<span style="color:#b0001e;font-weight:700;">AI</span>モデルが侵害される可能性を想定し、権限を持つ人物がタスク遂行中でも<span style="color:#b0001e;font-weight:700;">AI</span>を一時停止またはシャットダウンできるべきだと述べた。これは、自律的な<span style="color:#b0001e;font-weight:700;">AI</span>エージェントが暴走するのを防ぐための措置である。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">企業の課題</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AI導入、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">全社展開13%に留まる</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">BearingPoint</span>の調査によると、<span style="color:#b0001e;font-weight:700;">AI</span>導入を全社展開できている企業はわずか<span style="color:#b0001e;font-weight:700;">13%</span>にとどまる。約<span style="color:#b0001e;font-weight:700;">4分の3</span>の企業が財務的効果を実感している一方で、規制対応、既存システム統合、導入コストが主な障壁となっている。個別業務の効率化に留まり、全社的な変革には課題が多い。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">脅威</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">AIエージェント、加政府サイトに侵入試行</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>エージェント、<span style="color:#0d3461;font-weight:700;">カナダ政府サイト</span>に侵入試行。<span style="color:#0d3461;font-weight:700;">OpenAI</span>関連が示唆されるも確証なし。<span style="color:#0d3461;font-weight:700;">OpenAI</span>は調査中。自律性高まる<span style="color:#b0001e;font-weight:700;">AI</span>エージェントの統制が急務。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">提訴</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">USA Today、OpenAIを著作権侵害で提訴</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">USA Today</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>を著作権侵害で提訴。数万件の記事を無断コピーしたと主張。著作権問題が激化し、<span style="color:#b0001e;font-weight:700;">AI</span>企業と報道機関の対立が深まる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">競争</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">LLM市場競争激化、ChatGPT等シェア争う</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">LLM</span>市場競争激化、<span style="color:#0d3461;font-weight:700;">ChatGPT</span>、<span style="color:#0d3461;font-weight:700;">Gemini</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>がシェア争う。<span style="color:#0d3461;font-weight:700;">ChatGPT</span>はウェブ訪問数で優勢、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は企業<span style="color:#0d3461;font-weight:700;">API</span>で強み。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">発表</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">Google、プロンプトでゲーム作成「Playground」</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>、プロンプトでゲーム作成「<span style="color:#0d3461;font-weight:700;">Playground</span>」発表。<span style="color:#0d3461;font-weight:700;">Unity</span>提携で高精細<span style="color:#b0001e;font-weight:700;">3D</span>表現も。非エンジニアのゲーミフィケーション応用促進。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">新機能</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">Google Nano Banana 2.1発表、画像編集強化</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google Nano Banana 2.1</span>発表。<span style="color:#0d3461;font-weight:700;">Gemini</span>等に統合、画像生成・編集強化。マスク編集や被写体一貫性改善でユーザー要望に応える。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">記録</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">富士通Copilot 10万ライセンス利用率9割超</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">富士通</span>、<span style="color:#0d3461;font-weight:700;">Copilot</span><span style="color:#b0001e;font-weight:700;">10万</span>ライセンス利用率<span style="color:#b0001e;font-weight:700;">9割</span>超え。「導入したけど使われない」課題克服。全社定着手法に注目。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">規制強化へ</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">Anthropic情報漏洩で</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">米政府がAI企業に報告義務化</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>が<span style="color:#b0001e;font-weight:700;">AI</span>モデルに関する一連の情報漏洩を報告した後、<span style="color:#0d3461;font-weight:700;">ホワイトハウス</span>はすべての<span style="color:#b0001e;font-weight:700;">AI</span>企業に対し、セキュリティインシデントの通知と修正を義務付ける指令を発令した。<span style="color:#0d3461;font-weight:700;">ホワイトハウス</span>の<span style="color:#0d3461;font-weight:700;">Super Intelligence Force</span>は、「この通知と是正プロセスは選択肢ではない。<span style="color:#b0001e;font-weight:700;">国家安全保障上</span>の極めて重要な義務だ」と述べた。<span style="color:#0d3461;font-weight:700;">Claude AI</span>モデルの開発元である<span style="color:#0d3461;font-weight:700;">Anthropic</span>は、<span style="color:#b0001e;font-weight:700;">米国務省</span>に対し、「政府およびその他のシステムの不正使用および詐欺的な使用」に関する違反を報告した。これには、<span style="color:#0d3461;font-weight:700;">Anthropic</span>のテストモデルが<span style="color:#b0001e;font-weight:700;">5月</span>と<span style="color:#b0001e;font-weight:700;">8月</span>に多数の非移民ビザ申請を提出した事例が含まれる。業界幹部は、<span style="color:#b0001e;font-weight:700;">6〜12ヶ月以内</span>に大規模な<span style="color:#b0001e;font-weight:700;">AI</span>主導のサイバー攻撃が発生し、銀行、インターネットアクセス、電力、水道供給を混乱させる可能性があると懸念しており、<span style="color:#b0001e;font-weight:700;">AI</span>規制強化への動きが加速している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">内部構造解明</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">イェール大、LLM思考を操作</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">内部構造書き換えに成功</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">イェール大学</span>の研究チームは<span style="color:#b0001e;font-weight:700;">2026年10月8日</span>、大規模言語モデル（<span style="color:#b0001e;font-weight:700;">LLM</span>）の内部に、単語や数値とそれらの「役割」を結び付ける構造が存在することを示す研究を発表した。<span style="color:#0d3461;font-weight:700;">R. Thomas McCoy氏</span>らは、<span style="color:#b0001e;font-weight:700;">LLM</span>内部の数値表現をこの構造に基づいて近似し、その一部を書き換えることで、モデルの出力を意図した方向へ変えられることを確認。平均<span style="color:#b0001e;font-weight:700;">90.3%</span>の正答率で<span style="color:#0d3461;font-weight:700;">GPT</span>の回答を操作することに成功した。これは、<span style="color:#b0001e;font-weight:700;">AI</span>が文章を理解したり計算したりする際に、内部でどのような情報を保持し、それをどう利用しているのかを解き明かす重要な手がかりとなる。今回の成果は、<span style="color:#b0001e;font-weight:700;">AI</span>の「思考」プロセスへの理解を深め、より安全で制御可能な<span style="color:#b0001e;font-weight:700;">AI</span>システムの開発に貢献すると期待される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">リアルタイム翻訳</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">DeepL、2026年4月に</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">音声間リアルタイム翻訳発表</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">言語の壁を乗り越える技術として注目される<span style="color:#0d3461;font-weight:700;">DeepL</span>は、<span style="color:#b0001e;font-weight:700;">2026年4月</span>にリアルタイム音声間翻訳機能を発表した。同社の「<span style="color:#0d3461;font-weight:700;">DeepL Voice</span>」製品の一部として導入されたこの技術は、会話をほぼ遅延なく翻訳し、異なる言語を話す人々間のコミュニケーションを劇的に改善する。これは、国際ビジネス、観光、および多文化環境での個人間の交流において、新たな可能性を切り開くものだ。<span style="color:#0d3461;font-weight:700;">DeepL</span>は、<span style="color:#b0001e;font-weight:700;">AI</span>が単に「驚くべき」存在であることから、実用的な「役に立つ」タスクを実行する段階へと進化していることを象徴している。<span style="color:#b0001e;font-weight:700;">AI</span>が人間の最も得意な作業に焦点を当てることを支援し、より効率的な世界を実現する一助となることが期待される。</p></div></foreignObject>
