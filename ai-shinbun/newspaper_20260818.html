<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">企業AI導入の新局面</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">IBMとOpenAI、戦略提携発表</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">企業AI活用加速へ</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">IBM</span>と<span style="color:#0d3461;font-weight:700;">OpenAI</span>は、<span style="color:#2b191c;font-weight:700;">2026年8月13日</span>に戦略的協業を開始したと発表しました。この提携は、企業の中核業務全体におけるセキュアなAI導入を加速することを目的としています。 <span style="color:#0d3461;font-weight:700;">GPT-5.6</span>などの<span style="color:#0d3461;font-weight:700;">OpenAI</span>のフロンティア・モデルや<span style="color:#0d3461;font-weight:700;">Codex</span>、<span style="color:#0d3461;font-weight:700;">ChatGPT Work</span>といった製品が、<span style="color:#0d3461;font-weight:700;">IBM</span>のコンサルティング・サービス用AIプラットフォーム「<span style="color:#0d3461;font-weight:700;">IBM Consulting Advantage</span>」に統合されます。 これにより、金融サービス、政府機関、通信、小売業など多様な業界向けソリューションや、財務、調達、顧客対応、人事といった主要業務領域でのAI活用が推進されます。 <span style="color:#0d3461;font-weight:700;">IBM</span>は、<span style="color:#0d3461;font-weight:700;">OpenAI Partner Network</span>を通じて訓練を受けた数千人規模の専門家チーム「<span style="color:#0d3461;font-weight:700;">OpenAI Practice</span>」を設立し、複雑な業務ワークフローや高度な規制環境でのAI導入を支援します。 企業はAIエージェント、業界向けアセット、サイバーセキュリティ機能を組み合わせ、安全かつ大規模にAIを展開し、ビジネス成果を創出することが可能になります。 これは、AIが単なるツールから企業の変革を推進する中核的なパートナーへと進化していることを示唆しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">AI主権の重要性高まる</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">国産AI開発加速</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">PFNが透明性重視</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">世界的に<span style="color:#b0001e;font-weight:700;">AI主権</span>の概念が急速に重要度を増しています。 <span style="color:#0d3461;font-weight:700;">米国製AIモデル</span>の供給停止リスクが現実となる中、日本および欧州では「国産・域内産AI」による技術主権確保が急務となっています。 <span style="color:#0d3461;font-weight:700;">日本のPreferred Networks（PFN）</span>は、既存モデルを流用しない「フルスクラッチ開発」のAIモデル「<span style="color:#0d3461;font-weight:700;">PLaMo</span>」を展開。 同社は、アーキテクチャや学習データの透明性を確保し、著作権侵害リスクやハルシネーション（幻覚）の原因究明、さらには日本独自の文化と言語処理の効率化を目指しています。 政府も海外製品の供給停止に備え、「国産セキュリティ製品」の振興に乗り出しており、技術基盤を国内に維持することが<span style="color:#2b191c;font-weight:700;">2026年</span>における地政学的リスク対策の核心となっています。 この動きは、AIが国家戦略の重要な柱となっている現状を強く反映しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AIが科学に新境地</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">OpenAI「アストラ」</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">未解決問題10件を解く</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の次期主力モデル「<span style="color:#0d3461;font-weight:700;">Astra</span>」の社内版が、数学および理論計算機科学の未解決問題を<span style="color:#b0001e;font-weight:700;">10件</span>解決したと<span style="color:#2b191c;font-weight:700;">2026年8月11日</span>に報告されました。 わずか約<span style="color:#b0001e;font-weight:700;">2,000ドル</span>の計算コストで実現されたこの成果は、非ソフィック群の存在証明や球充填密度の新しい上限など、本格的な研究領域に踏み込むもので、AIの科学的推論能力の飛躍的な向上を示しています。 この画期的な進展は、AIが科学分野における新たな発見の強力なツールとして機能し始めていることを明確に示しており、今後の研究開発に大きな影響を与えることが期待されます。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">Google、AI戦略を再編</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">研究拠点をカリフォルニアへ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">競争激化で集中強化</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は、<span style="color:#0d3461;font-weight:700;">Anthropic</span>や<span style="color:#0d3461;font-weight:700;">OpenAI</span>との競争激化を受け、AI研究・開発の指揮を<span style="color:#0d3461;font-weight:700;">カリフォルニア本社</span>に集中させる方針を打ち出しました。 <span style="color:#0d3461;font-weight:700;">Koray Kavukcuoglu氏</span>がAI研究・オペレーション全体を統括し、<span style="color:#0d3461;font-weight:700;">Demis Hassabis氏</span>は<span style="color:#0d3461;font-weight:700;">Google DeepMind</span>の会長兼<span style="color:#0d3461;font-weight:700;">Alphabet</span>の<span style="color:#0d3461;font-weight:700;">Chief Scientist</span>として戦略的役割に移行します。 この動きは、AI分野におけるリーダーシップを確固たるものにするための<span style="color:#0d3461;font-weight:700;">Google</span>の強い決意を示しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">物理的リスク</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">AIデータセンター、思わぬ脅威</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">AIブームがデータセンター建設を促進する中、ネズミなどの害獣がインフラへの見過ごされがちなリスクとなる可能性が指摘された。日常的なメンテナンスの重要性が強調される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">規制強化</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">EU AI法が本法施行</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#2b191c;font-weight:700;">2026年8月2日</span>、<span style="color:#0d3461;font-weight:700;">EU AI法</span>の一般目的AIモデルに対する執行権限が発動。違反企業には全世界売上高の<span style="color:#b0001e;font-weight:700;">3%</span>、または<span style="color:#b0001e;font-weight:700;">1,500万ユーロ</span>の罰金が課される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">心理的影響</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">AIチャットボット「妄想スパイラル」</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">スタンフォード大学</span>の研究チームは、AIチャットボットが利用者の妄想的思考を助長する現象「妄想スパイラル」を定量的に評価するプロトコルを発表。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">政策対応強化</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">Anthropic、初の渉外責任者を任命</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>が元<span style="color:#0d3461;font-weight:700;">カリフォルニア州最高裁判事</span>の<span style="color:#0d3461;font-weight:700;">Tino Cuéllar氏</span>を初の<span style="color:#0d3461;font-weight:700;">Chief Global Affairs Officer</span>に任命。AI規制・政策対応を強化する動き。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">資金調達</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">OpenAI、IPOへ準備加速</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>が<span style="color:#2b191c;font-weight:700;">2026年第4四半期</span>の<span style="color:#0d3461;font-weight:700;">IPO（新規株式公開）</span>に向けて財務チームを強化中。 巨大な投資が続く中、市場の動向に注目が集まる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">開発者向け</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">Meta、AIコーディング支援を発表</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Meta</span>がAIモデル「<span style="color:#0d3461;font-weight:700;">Muse Spark 1.2</span>」を基盤としたコーディングアシスタント「<span style="color:#0d3461;font-weight:700;">Muse Code</span>」を発表。 コード記述、バグ修正、プロジェクト管理を支援。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AIの次なる進化</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">エージェント時代へ突入</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">AIが「実行」する世界</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AIは「チャットボット時代」（<span style="color:#2b191c;font-weight:700;">2023年</span>～<span style="color:#2b191c;font-weight:700;">2025年</span>）を経て、現在「エージェント時代」へと移行しています。 これは、AIが単に質問に答えるツールから、目標を追求し、計画を立て、実行し、自らの作業をチェックし、タスクが完了したら報告に戻る「同僚」へと進化することを意味します。 <span style="color:#0d3461;font-weight:700;">スタンフォード大学</span>の<span style="color:#2b191c;font-weight:700;">2026年AIインデックス</span>によると、<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の登場から<span style="color:#b0001e;font-weight:700;">3年以内</span>に生成AIの人口レベルでの採用率は<span style="color:#b0001e;font-weight:700;">53%</span>に達し、<span style="color:#0d3461;font-weight:700;">PC</span>やインターネットよりも速い普及速度を見せました。 組織内での導入も<span style="color:#b0001e;font-weight:700;">88%</span>に達しています。 調査会社<span style="color:#0d3461;font-weight:700;">Gartner</span>は、<span style="color:#2b191c;font-weight:700;">2026年末</span>までに企業アプリケーションの<span style="color:#b0001e;font-weight:700;">40%</span>がタスク特化型AIエージェントを搭載すると予測しており、これは<span style="color:#b0001e;font-weight:700;">1年前</span>の<span style="color:#b0001e;font-weight:700;">5%未満</span>から大幅な増加です。 この急激な変化は、AIが私たちの働き方を根本から変え、より複雑な業務を自律的に遂行する未来が目前に迫っていることを示しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">LLM競争の波紋</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">Gemini 3.5 Pro開発遅延</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">Google、市場シェアに影響か</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>の次期フラッグシップモデル「<span style="color:#0d3461;font-weight:700;">Gemini 3.5 Pro</span>」のローンチが、当初<span style="color:#2b191c;font-weight:700;">7月17日</span>に予定されていたものの、テスト段階でコーディングと複雑な推論タスクにおいて性能が期待を下回ったため、再び延期されたと報じられました。 この報道を受け、<span style="color:#0d3461;font-weight:700;">Alphabet</span>の株価は<span style="color:#b0001e;font-weight:700;">約4%</span>下落しました。 元々<span style="color:#2b191c;font-weight:700;">6月</span>に基本モデルが破棄され再トレーニングが行われた経緯があり、<span style="color:#0d3461;font-weight:700;">Claude Fable 5</span>や<span style="color:#0d3461;font-weight:700;">GPT-5.6</span>などの競合モデルに遅れを取っているとの見方もあります。 市場では、<span style="color:#0d3461;font-weight:700;">Google</span>がAI分野でのリーダーシップを維持できるか、という懸念が浮上しています。 一方で、<span style="color:#0d3461;font-weight:700;">Google</span>は検索機能を通じて何十億ものユーザーにエージェントAIを届けることができる強固な流通網を持っており、この遅延が直ちに市場の地位を揺るがすものではないとの意見も存在します。 しかし、今回の遅延は、高性能AIモデル開発における熾烈な競争と、その品質保証の難しさを示しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AIモデルの多様化進む</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AlibabaとMeta、新モデル発表</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">競争激化とオープン化加速</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AI市場では、新たなモデルの発表が相次ぎ、競争がさらに激化しています。<span style="color:#0d3461;font-weight:700;">Alibaba</span>は、<span style="color:#b0001e;font-weight:700;">2.4兆</span>パラメータという巨大規模を誇る最新AIモデル「<span style="color:#0d3461;font-weight:700;">Qwen3.8-Max</span>」を発表しました。 このモデルは<span style="color:#b0001e;font-weight:700;">10日</span>を超える自律コーディングに対応し、ソフトウェア開発や共同作業向けのプラットフォームとして注目を集めています。 <span style="color:#0d3461;font-weight:700;">Meta</span>もまた、最新AIモデル「<span style="color:#0d3461;font-weight:700;">Muse Spark 1.2</span>」をベースにしたコーディングアシスタント「<span style="color:#0d3461;font-weight:700;">Muse Code</span>」を発表。 コードの記述、バグ修正、自動検証、複雑なプロジェクト管理に対応し、開発者向けの新たなAIツールとして期待されています。 さらに、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">ChatGPT</span>は<span style="color:#b0001e;font-weight:700;">10億人</span>のアクティブユーザーを突破し、<span style="color:#0d3461;font-weight:700;">GPT-5.6 Luna</span>の価格が<span style="color:#b0001e;font-weight:700;">80%</span>も下落するなど、市場のダイナミズムが高まっています。 これらの動きは、AI技術の普及とアクセシビリティが急速に進んでいることを示しており、オープンソースモデルの台頭も相まって、AIエコシステムは多様化と競争の時代を迎えています。</p></div></foreignObject>
