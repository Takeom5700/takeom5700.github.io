<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">世界銀行報告</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AIは途上国に</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">新たな希望</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">世界銀行は<span style="color:#b0001e;font-weight:700;">8月4日</span>、人工知能が途上国にとって「救命綱」となり、<span style="color:#b0001e;font-weight:700;">10年</span>で<span style="color:#b0001e;font-weight:700;">1世紀分</span>の発展を可能にする可能性があると報告した。適切な電力、接続性、スキルギャップに迅速に対応すれば、経済成長を大幅に加速できるという。同報告書は、AIによる大規模な失業は豊かな国よりも途上国では脅威が少ないと指摘。途上国はAIからより多くの恩恵を受け、恐れることは少ないと結論付けている。世界銀行のチーフエコノミスト、<span style="color:#0d3461;font-weight:700;">インダーミット・ギル</span>氏は、「AIは途上国に救命綱を投げかけた。彼らはそれを掴むべきだ」と述べた。小規模で低コストなAIツールを現地の状況に適応させることで、医療、教育、司法サービス、農業支援を何百万もの人々に提供できる可能性がある。このアプローチにより、データセンター建設のための膨大なリソースや大規模なカスタムLLMは不要となる。国際通貨基金は、AIが適切な状況下でサハラ以南アフリカ経済を今後<span style="color:#b0001e;font-weight:700;">10年</span>で約<span style="color:#b0001e;font-weight:700;">4パーセント</span>押し上げると予測している。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">インフラ整備が鍵</p><p style="text-indent:1em;margin:0 0 2px;">各国政府は、電力とインターネットアクセスを改善し、デジタルスキルを向上させ、スマートフォンやコンピューティングデバイスへのアクセスを拡大する必要がある。生成AIは豊かな国で<span style="color:#b0001e;font-weight:700;">14.2%</span>の雇用が危険にさらされるのに対し、低・中所得国では<span style="color:#b0001e;font-weight:700;">4.5%</span>と、<span style="color:#b0001e;font-weight:700;">3倍</span>も雇用を脅かす可能性が高いとされている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">メモリー最前線</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">サムスン、次世代</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">3Dメモリー発表</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">サムスン電子</span>は<span style="color:#b0001e;font-weight:700;">8月4日</span>、<span style="color:#0d3461;font-weight:700;">FMS 2026</span>で次世代<span style="color:#b0001e;font-weight:700;">3D</span>メモリービジョンを発表し、AIインフラの未来図を示した。同社は、<span style="color:#0d3461;font-weight:700;">zHBM</span>と<span style="color:#0d3461;font-weight:700;">zNAND-O</span>の業界初のコンセプトモデルを公開。特に<span style="color:#0d3461;font-weight:700;">zHBM</span>は、<span style="color:#0d3461;font-weight:700;">HBM</span>を<span style="color:#0d3461;font-weight:700;">AI</span>アクセラレーターの上に垂直に積層する新アーキテクチャで、データ転送距離を最小化し、高帯域幅と電力効率の向上を目指す。また、<span style="color:#b0001e;font-weight:700;">400層超</span>の<span style="color:#0d3461;font-weight:700;">V10 BV-NAND</span>も発表され、ウェハーボンディング技術の進化を強調した。<span style="color:#0d3461;font-weight:700;">サムスン</span>は、<span style="color:#0d3461;font-weight:700;">DRAM</span>、<span style="color:#0d3461;font-weight:700;">NAND</span>、エンタープライズストレージを含む包括的な<span style="color:#0d3461;font-weight:700;">AI</span>メモリーポートフォリオと技術ロードマップを提示し、<span style="color:#0d3461;font-weight:700;">AI</span>時代のワンストップソリューション提供に注力する姿勢を示した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">規制とガバナンス</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">EU AI法</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">本格運用開始</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">EU</span>（欧州連合）では<span style="color:#b0001e;font-weight:700;">8月3日</span>より<span style="color:#0d3461;font-weight:700;">AI法</span>（<span style="color:#0d3461;font-weight:700;">AI Act</span>）の重要な規定が本格的に運用開始された。これに伴い、<span style="color:#0d3461;font-weight:700;">OpenAI</span>や<span style="color:#0d3461;font-weight:700;">Anthropic</span>などの主要<span style="color:#0d3461;font-weight:700;">AI</span>企業は対応を急いでいる。この動きは、高性能<span style="color:#0d3461;font-weight:700;">AI</span>システムの安全対策、<span style="color:#0d3461;font-weight:700;">AI</span>生成コンテンツの透明性確保、リスク評価と監視体制の整備を義務付けるものだ。<span style="color:#0d3461;font-weight:700;">AI</span>の安全性やガバナンスに関する議論は引き続き活発で、企業には性能だけでなく、安全性、透明性、説明責任が強く求められるようになっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">LLM競争激化</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">主要モデル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">性能向上</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の<span style="color:#0d3461;font-weight:700;">LLM</span>市場は、<span style="color:#0d3461;font-weight:700;">GPT</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>、<span style="color:#0d3461;font-weight:700;">Gemini</span>などが熾烈な競争を繰り広げている。<span style="color:#0d3461;font-weight:700;">PromptXL</span>の報告によると、各モデルは技術的能力、最適な利用ケース、価格構造で大きく異なる。<span style="color:#0d3461;font-weight:700;">GPT</span>は汎用アプリで優勢、<span style="color:#0d3461;font-weight:700;">Gemini</span>はマルチモーダル機能で創造的タスクに秀でる。<span style="color:#0d3461;font-weight:700;">Claude</span>は倫理的<span style="color:#0d3461;font-weight:700;">AI</span>と解釈性に注力している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">エージェントAI</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">実務導入本格化</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年8月</span>現在、<span style="color:#0d3461;font-weight:700;">AI</span>エージェントはデモ段階を超え、予約管理や<span style="color:#0d3461;font-weight:700;">IT</span>インフラ管理など多段階タスクに実用されている。しかし、セキュリティリスクやハルシネーションは依然深刻な懸念だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">投資動向</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">AI投資1兆ドルに</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ゴールドマン・サックス</span>は、<span style="color:#b0001e;font-weight:700;">2026年</span>の世界の<span style="color:#0d3461;font-weight:700;">AI</span>投資額が<span style="color:#b0001e;font-weight:700;">1兆190億ドル</span>に達すると予測した。従来の市場推定より約<span style="color:#b0001e;font-weight:700;">2000億ドル</span>多い。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">動画生成</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">MiniMax H3公開</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">MiniMax</span>は<span style="color:#b0001e;font-weight:700;">8月3日</span>、<span style="color:#0d3461;font-weight:700;">2K</span>マルチモーダル動画生成モデル「<span style="color:#0d3461;font-weight:700;">H3</span>」のオープンウェイトを<span style="color:#0d3461;font-weight:700;">Hugging Face</span>で公開した。商用利用も可能で、動画生成<span style="color:#0d3461;font-weight:700;">AI</span>のオープンソース化を加速させる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">サプライチェーン</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">部品不足深刻化</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>インフラ需要の急増で、<span style="color:#0d3461;font-weight:700;">HBM</span>や<span style="color:#0d3461;font-weight:700;">DRAM</span>などのメモリー・部品不足が深刻化している。価格高騰も続き、<span style="color:#b0001e;font-weight:700;">2027年頃</span>まで高止まりが懸念される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">AI検索</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">可視性高める</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Abel Communications</span>と<span style="color:#0d3461;font-weight:700;">Brandi AI</span>は<span style="color:#b0001e;font-weight:700;">8月5日</span>、「<span style="color:#0d3461;font-weight:700;">AI</span>検索での可視性獲得」に関するウェビナーを開催する。オンラインディスカバリーが検索エンジンから<span style="color:#0d3461;font-weight:700;">AI</span>回答エンジンへ移行する中での戦略を解説。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">ロボット開発</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">ロボットバンク始動</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ロボットバンク株式会社</span>は<span style="color:#b0001e;font-weight:700;">8月4日</span>、<span style="color:#0d3461;font-weight:700;">AI</span>ソフトウェアから機体設計まで一体開発する次世代フィジカル<span style="color:#0d3461;font-weight:700;">AI</span>ロボット開発プロジェクトを開始した。国内外との連携も強化する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">サイバー脅威</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AI悪用する</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">攻撃が拡大</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">サイバー攻撃者が攻撃の自動化や高速化に生成<span style="color:#0d3461;font-weight:700;">AI</span>を利用し始めたことで、「<span style="color:#0d3461;font-weight:700;">AI</span>セキュリティリスク」が拡大している。防御側のセキュリティベンダーも<span style="color:#0d3461;font-weight:700;">AI</span>対応を急速に強化中だ。<span style="color:#0d3461;font-weight:700;">Sysdig</span>の報告によると、<span style="color:#0d3461;font-weight:700;">JADEPUFFER</span>というランサムウェアが<span style="color:#0d3461;font-weight:700;">LLM</span>エージェントによって完全に実行された事例も確認された。これは、古い<span style="color:#0d3461;font-weight:700;">Langflow</span>の欠陥を突き、ログイン失敗を<span style="color:#b0001e;font-weight:700;">31秒</span>で自己修正し、データベースを暗号化したものだ。高性能モデルの安全面への懸念や輸出規制、<span style="color:#0d3461;font-weight:700;">AI</span>エージェントの権限管理など、「<span style="color:#0d3461;font-weight:700;">AI</span>攻撃表面（<span style="color:#0d3461;font-weight:700;">Attack Surface</span>）」を防ぐ製品需要が高まっている。企業は<span style="color:#0d3461;font-weight:700;">AI</span>導入を進める一方で、これら新たな脅威への対策が喫緊の課題となっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">新興インフラ</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">GPU需要で</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">ネオクラウド成長</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">GPU</span>需要の高まりに伴い、「ネオクラウド（<span style="color:#0d3461;font-weight:700;">Neoclouds</span>）」と呼ばれる<span style="color:#0d3461;font-weight:700;">GPU-as-a-Service</span>に特化した独立系クラウドが急拡大している。<span style="color:#0d3461;font-weight:700;">Nebius</span>、<span style="color:#0d3461;font-weight:700;">Vultr</span>、<span style="color:#0d3461;font-weight:700;">Lambda</span>、<span style="color:#0d3461;font-weight:700;">DigitalOcean</span>などの事業者が相次いでチャネルパートナープログラムを開設しており、<span style="color:#0d3461;font-weight:700;">GPU</span>の調達難に直面する企業やパートナーにとって重要なインフラの選択肢となっている。<span style="color:#b0001e;font-weight:700;">2031年</span>には市場規模が<span style="color:#b0001e;font-weight:700;">4,000億ドル</span>に達すると予測されており、<span style="color:#0d3461;font-weight:700;">AI</span>インフラブームを支える新たな勢力として注目を集めている。これは<span style="color:#0d3461;font-weight:700;">AI</span>開発の加速に不可欠な計算資源を柔軟かつコスト効率良く提供する上で重要な役割を担うだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">普及と戦略</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AI PC普及</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">低価格化進む</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI PC</span>の採用が加速しており、<span style="color:#0d3461;font-weight:700;">AI</span>技術の日常への浸透が進んでいる。<span style="color:#b0001e;font-weight:700;">2026年8月</span>は、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が「<span style="color:#0d3461;font-weight:700;">GPT-5.6 Luna</span>」の価格を<span style="color:#b0001e;font-weight:700;">80%</span>引き下げ、<span style="color:#b0001e;font-weight:700;">100万</span>入力トークンあたり<span style="color:#b0001e;font-weight:700;">0.20ドル</span>としたことが大きな話題となった。これにより、高頻度のデータ抽出や要約タスクにおけるコスト構造が変化し、企業は日常的なタスクには低コストモデルを、重要度の高い作業にはプレミアムモデルを使い分ける「階層型モデル価格戦略」が明確な動きとなっている。<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の週間アクティブユーザー数が約<span style="color:#b0001e;font-weight:700;">10億人</span>に達するなど、<span style="color:#0d3461;font-weight:700;">AI</span>が日常生活やビジネス製品に深く組み込まれる動きが加速している。</p></div></foreignObject>
