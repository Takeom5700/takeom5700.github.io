<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">市場動揺、巨額投資に疑問符</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AIバブル懸念</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">2兆ドル消失</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">【ワシントン】<span style="color:#b0001e;font-weight:700;">2026年10月</span>、世界の金融市場は人工知能（AI）セクターの過熱に対する深い懸念に包まれた。大手テクノロジー企業がAIインフラに投じる莫大な投資が、果たして十分なリターンを生み出すのかという疑問が浮上し、<span style="color:#0d3461;font-weight:700;">ナスダック100指数</span>の時価総額から<span style="color:#b0001e;font-weight:700;">2兆ドル</span>（約<span style="color:#b0001e;font-weight:700;">300兆円</span>）以上が蒸発する事態となった。米株式市場は月末の<span style="color:#b0001e;font-weight:700;">2日間</span>で大幅に下落し、特にAI関連銘柄が軒並み売られた。市場アナリストは、AIブームがドットコムバブルの再来となる可能性を指摘し、投資家はAIのデモンストレーションや野心的な発表だけでは満足せず、具体的な財務実績とキャッシュフローを求める姿勢を強めている。 <span style="color:#0d3461;font-weight:700;">Anthropic</span>も<span style="color:#b0001e;font-weight:700;">2兆ドル規模</span>の<span style="color:#0d3461;font-weight:700;">IPO</span>申請書で、AIが「人類に壊滅的または実存的なリスクをもたらす可能性」を警告。これは投資家の不安を一層煽る結果となった。市場の動揺は、AI技術の発展がもたらす経済的影響の不確実性を浮き彫りにしている。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">Alphabet、逆風下でも底力</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">米Google</span>の親会社である<span style="color:#0d3461;font-weight:700;">Alphabet</span>は、AIのワンストップショップとして最先端のAIモデル、急成長するクラウド事業、大規模なチップ開発を擁し、市場の逆風下でも底力を見せている。AIエージェントの出現が同社の検索ビジネスに与える影響は未だ不透明だが、その多様な事業展開が強みとなるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">LLM進化の最前線</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">マルチモーダル化加速</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">各社競争激化</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年10月</span>現在、大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）の競争は激化の一途を辿っており、特にマルチモーダル機能が進化の中心となっている。<span style="color:#0d3461;font-weight:700;">Google Gemini 3.8 Flash</span>はテキスト、画像、音声、動画を単一モデルで処理する能力で注目を集めている。一方、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-6.1 Sol</span>と<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>は、複雑な視覚的推論や文書分析、エージェントワークフローにおいて強力な選択肢となっている。特に<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>は<span style="color:#b0001e;font-weight:700;">9月28日</span>に発表され、文書処理、コーディング、画像理解で改善が見られた。各社とも差別化を図るため、安全性や長文コンテキスト処理能力、コストパフォーマンスを競っているが、特定の用途に最適なモデルを選ぶ「マルチ<span style="color:#0d3461;font-weight:700;">LLM</span>戦略」が主流になりつつある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">業界標準の確立へ</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">生成AI新規格</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">発表に期待</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年11月1日</span>、生成AIの新たな規格が発表され、業界内で大きな期待が高まっている。これまでの規格では生成AIの性能や品質が不十分とされてきたため、今回の新規格は生成AIの性能を大幅に向上させる見込みだ。この規格の実装には認証やテスト、産業界全体での導入が必要となるが、市場の競争環境やビジネスモデルに大きな影響を与えると予想されている。新たなハードウェアやソフトウェアの開発、既存システムの改造も求められるが、生成AIの実際の利用方法にも変化をもたらす可能性を秘めている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">患者とAIの対話</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">医療AI安全性</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">実証研究で成果</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Beth Israel Deaconess Medical Center</span>（<span style="color:#0d3461;font-weight:700;">BIDMC</span>）の研究者らは、<span style="color:#b0001e;font-weight:700;">2026年10月24日</span>に医学誌<span style="color:#0d3461;font-weight:700;">The Lancet</span>で発表された研究で、会話型AIシステム「<span style="color:#0d3461;font-weight:700;">AMIE</span>」を患者との対話に導入し、<span style="color:#b0001e;font-weight:700;">98件</span>の完了した会話で安全停止が一度も発生しなかったと報告した。これは、プライマリケアにおける患者向けAIの実現可能性を示す最初の実世界テストであり、医療AIの安全性に対する期待を高めるものだ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">テクノロジー</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">中国ECでAI自動化</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">中国版<span style="color:#0d3461;font-weight:700;">Amazon</span>がAIで<span style="color:#b0001e;font-weight:700;">450万件</span>の商品ページ作成を完全自動化。EC運営の無人化を推進し、効率を大幅に向上させた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">AI倫理</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">深層偽造動画の脅威</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>には、AI生成のフェイクメディアが日常化し、現実との境界が曖昧に。信頼性の低下が社会問題となる恐れがある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">AI開発</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">4巨頭、AIオプトアウト</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">主要<span style="color:#b0001e;font-weight:700;">4社</span>のAI企業が、著作権保護のため共通のAIオプトアウトトークンを支持。コンテンツ作成者の権利保護が進む。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">経済動向</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">AI投資、生産性課題</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">ガートナー調査で、AI導入企業のわずか<span style="color:#b0001e;font-weight:700;">3%</span>しか生産性目標達成せず。投資効果への疑問が浮上。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">AI応用</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">月面探査に生成AI</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">中国が年内に次なる月面着陸ミッションを計画。探査車の自律走行に生成AIを活用し、宇宙開発を加速。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">AI警告</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">Anthropic、リスク明示</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>がIPO申請書で、AIが「人類に破滅的リスク」をもたらす可能性を警告。業界の倫理的側面が焦点に。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AI投資の行方</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">市場動揺と</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">バブル論争</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年10月</span>、<span style="color:#0d3461;font-weight:700;">ウォール街</span>ではAI投資の過熱に対する懸念から、テクノロジー株の大幅な売り浴びせが発生し、<span style="color:#0d3461;font-weight:700;">ナスダック100指数</span>の時価総額が一時<span style="color:#b0001e;font-weight:700;">2兆ドル</span>以上減少した。アナリストは、巨額のAIインフラ投資が予想されるリターンを生み出すか疑問視しており、<span style="color:#b0001e;font-weight:700;">2026年</span>の世界のAI設備投資額は推定<span style="color:#b0001e;font-weight:700;">9,000億ドル</span>に達する見込みだ。しかし、これだけの支出が伴う中で、収益が期待を下回る「AIバブル崩壊」の可能性が指摘されている。一部の専門家は、<span style="color:#0d3461;font-weight:700;">ドットコムバブル</span>との類似性を指摘し、投資家は具体的な収益とキャッシュフローを重視する姿勢を強めている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">LLM競争の激化</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">マルチモーダル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">機能で差別化</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の<span style="color:#0d3461;font-weight:700;">LLM</span>市場では、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-6.1 Sol</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>が三つ巴の戦いを繰り広げている。特にマルチモーダル機能の進化が著しく、テキスト、画像、音声、動画を統合的に処理する能力がモデル選択の重要な指標となっている。<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>は幅広いメディア入力に対応し、<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>は複雑な文書理解と知識作業に強みを見せる。モデルの性能は特定の用途に依存するため、「単一の最適なモデルは存在しない」という認識が広まり、複数の<span style="color:#0d3461;font-weight:700;">LLM</span>を組み合わせる「マルチ<span style="color:#0d3461;font-weight:700;">LLM</span>戦略」が企業の間で主流になりつつある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">中国AIの躍進</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">宇宙からECまで</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">広がる影響力</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">中国のAI技術は、Eコマースから宇宙開発まで多岐にわたる分野で急速な進展を見せている。中国版<span style="color:#0d3461;font-weight:700;">Amazon</span>はAIによる商品ページ作成を<span style="color:#b0001e;font-weight:700;">450万件</span>規模で自動化し、EC運営の効率を飛躍的に高めた。さらに、月面着陸ミッションでは探査車の自律走行に生成AIが活用され、宇宙での長期生存技術開発においてもAIが不可欠な役割を担っている。都市交通システムへのAI導入も進み、生活インフラの変革を推進。アフリカでは若者からの支持を最も集めるなど、技術輸出を通じた影響力も拡大している。一方で、<span style="color:#b0001e;font-weight:700;">4800億ドル</span>が消失したとされる中国AIバブル崩壊の報道もあり、過剰投資への警戒感も高まっている。</p></div></foreignObject>
