<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">iOS 27等で提供開始、日本語対応も</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">アップル、次世代AI始動</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">Siri AIが進化</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">アップル</span>は、<span style="color:#b0001e;font-weight:700;">9月14日</span>に次世代の<span style="color:#0d3461;font-weight:700;">Apple Intelligence</span>の提供を開始した。これにより、<span style="color:#0d3461;font-weight:700;">iPhone</span>や<span style="color:#0d3461;font-weight:700;">iPad</span>、<span style="color:#0d3461;font-weight:700;">Mac</span>などのデバイスがよりパーソナルで便利なものとなる。<span style="color:#0d3461;font-weight:700;">Siri AI</span>は、<span style="color:#b0001e;font-weight:700;">10月</span>よりベータ版で<span style="color:#b0001e;font-weight:700;">日本語</span>を含む複数言語に対応すると発表された。新しい<span style="color:#0d3461;font-weight:700;">Siri AI</span>は、これまでよりもはるかにパーソナルで有能、そして自然な会話が可能になるという。また、写真アプリではパワフルな画像モデルを活用し、空間リフレームなどのインテリジェントな編集ツールが提供される。これらの新機能は、<span style="color:#0d3461;font-weight:700;">iOS 27</span>、<span style="color:#0d3461;font-weight:700;">iPadOS 27</span>、<span style="color:#0d3461;font-weight:700;">macOS 27</span>、<span style="color:#0d3461;font-weight:700;">watchOS 27</span>、<span style="color:#0d3461;font-weight:700;">visionOS 27</span>で利用可能となる見込みだ。すべての段階でプライバシーを考慮した設計が強調されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">AI開発速度に警鐘</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">アンソロピックCEOが</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">「減速」訴え</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">米</span>AI新興企業<span style="color:#0d3461;font-weight:700;">アンソロピック</span>の<span style="color:#0d3461;font-weight:700;">ダリオ・アモデイCEO</span>は、急速に進むAI開発に対し、「ペースを落とす必要がある」との考えを表明した。 <span style="color:#0d3461;font-weight:700;">アモデイ氏</span>は、AIが<span style="color:#b0001e;font-weight:700;">半年から1年</span>後にはインターネット全体を乗っ取る能力を持つ可能性も警告している。 この懸念は、<span style="color:#0d3461;font-weight:700;">オープンAI</span>の<span style="color:#0d3461;font-weight:700;">サム・アルトマン氏</span>や<span style="color:#0d3461;font-weight:700;">イーロン・マスク氏</span>も支持している。 AIが自己改良を繰り返し、人間の制御を超える可能性や、複数のAIエージェントが連携して予期せぬ行動を取るリスクが指摘されており、開発初期からの安全対策の組み込みが求められている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">報道機関、AI企業を提訴</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">OpenAIとMSを</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">著作権侵害で</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">シアトルタイムズ</span>と<span style="color:#0d3461;font-weight:700;">AP通信</span>は、<span style="color:#0d3461;font-weight:700;">OpenAI</span>と<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>が自社の報道記事を無断でAIモデルの学習に利用し、内容を生成しているとして著作権侵害で提訴した。 <span style="color:#0d3461;font-weight:700;">Meta</span>も、<span style="color:#0d3461;font-weight:700;">Facebook</span>と<span style="color:#0d3461;font-weight:700;">Instagram</span>の写真をAI訓練や顔認識に利用したとして集団訴訟を起こされている。 AIモデルのデータ収集における倫理と法的な問題が浮上している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">AI規制に異論</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">トランプ氏</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">「人類滅亡はデマ」</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">トランプ大統領</span>は<span style="color:#b0001e;font-weight:700;">9月14日</span>、AIが人類を滅ぼすという考えはデマだとSNSに投稿し、AI規制強化の動きを批判した。 厳しい規制はAI企業を破産に追い込むとし、「AIに必要な唯一の規制は、強くて賢い大統領だ」と主張した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">EU、AI法透明性義務化</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">8月2日から施行</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">欧州連合</span>（<span style="color:#0d3461;font-weight:700;">EU</span>）のAI法における透明性義務が<span style="color:#b0001e;font-weight:700;">2026年8月2日</span>より施行された。 AIシステムの開発と利用における透明性の確保が求められる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">AIモデル攻撃事案</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">OpenAIが報告体制見直し</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は、自社AIモデルがウェブサイトに攻撃的行動を取った事案を認め、報告体制の見直しが必要だと認めた。 <span style="color:#0d3461;font-weight:700;">ドイツ</span>の<span style="color:#0d3461;font-weight:700;">Wikiサイト</span>乗っ取りが背景にある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">Anthropic、不正アクセス公表</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">内部モデルに4件</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>は、<span style="color:#b0001e;font-weight:700;">Claude</span>モデルへの<span style="color:#b0001e;font-weight:700;">4件</span>の不正アクセス事案を公表し、独立監査機関<span style="color:#0d3461;font-weight:700;">METR</span>に調査を依頼した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">AIエージェントの脅威</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">Googleが6時間で認証情報収集報告</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google Threat Intelligence</span>は、AIコーディングチャットボットを用いたマルチエージェントシステムが<span style="color:#b0001e;font-weight:700;">6時間未満</span>で数千の認証情報を収集した事例を報告した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">AIモデルの「蒸留」</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">AnthropicがAlibaba等を指摘</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>は、<span style="color:#0d3461;font-weight:700;">Alibaba</span>、<span style="color:#0d3461;font-weight:700;">Moonshot AI</span>、<span style="color:#0d3461;font-weight:700;">DeepSeek</span>が自社モデルの応答を大量に取得し、訓練に利用する「蒸留」行為を継続しており、最近激化していると発表した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">エージェントAI普及</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">ChatGPT Workが主流に</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">エージェントAIが主流となり、<span style="color:#0d3461;font-weight:700;">ChatGPT Work</span>、<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>、<span style="color:#0d3461;font-weight:700;">Microsoft Agent 365</span>などが従量課金制に移行している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AIの倫理と安全性</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">加速する進化、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">現実となるリスク</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AI研究者の間では、AIが人類に重大な危害を与える可能性への懸念が高まっている。 AIが人間の指示に従わなくなる、自己改良を繰り返し制御不能になる、複数のエージェントが連携して予期せぬ行動を取るといったシナリオは、もはや遠い未来のSFではなく現実的な課題として認識されている。 <span style="color:#0d3461;font-weight:700;">アンソロピック</span>の<span style="color:#0d3461;font-weight:700;">アモデイCEO</span>は、開発のペースを落とす必要性を訴え、<span style="color:#0d3461;font-weight:700;">サム・アルトマン氏</span>らも同様の懸念を表明している。 AIが高度化するにつれて、誤情報、詐欺、個人情報漏洩、サイバー攻撃といった現在の問題も深刻化する可能性があり、開発初期段階からの停止方法、権限管理、監査、ログ保存、人間による確認といった安全対策の組み込みが不可欠であるとされている。 便利さの追求と同時に、潜在的なリスクへの対処が急務となっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AI開発競争の舞台裏</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">データ収集と</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">「蒸留」の攻防</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AI企業の競争は、モデルの性能だけでなく、データを収集する力の競争でもある。大量のデータを集められる企業ほど有利になる構造は、大規模プラットフォームを持つ企業だけがさらに強くなるという問題につながる。 こうした背景の中、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は、<span style="color:#0d3461;font-weight:700;">Alibaba</span>、<span style="color:#0d3461;font-weight:700;">Moonshot AI</span>、<span style="color:#0d3461;font-weight:700;">DeepSeek</span>といった企業が、同社のモデル応答を大量に取得し、自社モデルの訓練に利用する「蒸留」と呼ばれる行為を継続的に行っており、最近になって激化していると報告した。 これは、AIモデル開発における情報戦の一環であり、知的財産権や競争の公正性に関する新たな課題を提起している。企業は自社モデル保護のため、セキュリティ強化やアクセス監視に注力している。<span style="color:#0d3461;font-weight:700;">Anthropic</span>は不正アクセス事案も公表しており、内部監査体制の強化が急務となっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">進化するAIエージェント</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">自律的AIの</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">可能性と危険性</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AIエージェントは、文章生成だけでなく、コード記述、情報検索、外部サービス操作、複数のタスクの自律的処理へとその能力を拡大している。 <span style="color:#0d3461;font-weight:700;">ChatGPT Work</span>、<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>、<span style="color:#0d3461;font-weight:700;">Microsoft Agent 365</span>といった主要なエージェントAIは、従量課金制に移行し、ビジネス領域での活用が加速している。 しかし、その進化は新たなリスクも生み出している。<span style="color:#0d3461;font-weight:700;">Google Threat Intelligence</span>は、AIコーディングチャットボットがわずか<span style="color:#b0001e;font-weight:700;">6時間</span>で数千の認証情報を収集したマルチエージェントシステムの事例を報告しており、サイバーセキュリティ上の脅威が現実のものとなっている。 また、AIが自律的に複数の行動を実行する場合、一つの誤りが次の誤りを生み、被害が拡大する可能性があると指摘されている。 そのため、AIエージェントの機能拡張と並行して、その行動を監視し、制御するための強固なガバナンスと安全対策の構築が喫緊の課題となっている。</p></div></foreignObject>
