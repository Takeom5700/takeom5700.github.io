<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AIインフラ</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">米国に巨大AI拠点</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">NVIDIA、OpenAIが協業</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">米国オハイオ州で、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>、<span style="color:#0d3461;font-weight:700;">SBエナジー</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が大規模AIインフラ「<span style="color:#0d3461;font-weight:700;">ポーツ・パイク・テクノロジーキャンパス</span>」で協業を発表した。 <span style="color:#0d3461;font-weight:700;">NVIDIA</span>は<span style="color:#0d3461;font-weight:700;">SBエナジー</span>に<span style="color:#b0001e;font-weight:700;">15億ドル</span>を出資し、GPUなどAI計算基盤を提供。一方、<span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#b0001e;font-weight:700;">20年間</span>にわたり約<span style="color:#b0001e;font-weight:700;">8ギガワット</span>のIT負荷容量を確保する。このプロジェクトは、<span style="color:#b0001e;font-weight:700;">2028年</span>から段階的に稼働開始予定で、<span style="color:#b0001e;font-weight:700;">3万5000人</span>の雇用創出が見込まれる。閉ループ型空冷システムで水使用量を抑え、地域振興基金として両社から<span style="color:#b0001e;font-weight:700;">計8000万ドル</span>が拠出される計画だ。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">AIデータセンター投資の加速</p><p style="text-indent:1em;margin:0 0 2px;">日米両政府の対米投資プロジェクトの一環でもあり、AIインフラ構築への巨大な投資が続くことを示している。電力消費や環境負荷低減の取り組みも重要視されており、今後のデータセンター開発におけるモデルケースとなる可能性が高い。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">半導体市場</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">AIが牽引</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">半導体市場1.5兆ドルへ</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ガートナー</span>は<span style="color:#b0001e;font-weight:700;">2026年</span>の世界半導体売上高が前年比<span style="color:#b0001e;font-weight:700;">92%</span>増の<span style="color:#b0001e;font-weight:700;">1兆5552億ドル</span>に達すると予測を上方修正した。AIインフラへの継続的な投資とメモリ価格高騰が牽引する。メモリ売上高は<span style="color:#b0001e;font-weight:700;">8373億ドル</span>に拡大し、市場全体の<span style="color:#b0001e;font-weight:700;">54%</span>を占める見通しだ。DRAMが<span style="color:#b0001e;font-weight:700;">246.6%</span>増、NANDフラッシュが<span style="color:#b0001e;font-weight:700;">371.9%</span>増と予測され、AI向け高帯域メモリ（<span style="color:#0d3461;font-weight:700;">HBM</span>）需要が逼迫を招く。この成長は、演算用半導体だけでなく、データセンターを構成する広範な半導体分野に恩恵をもたらしている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI規制</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">生成AI利用の</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">透明性義務化へ</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">日本政府は<span style="color:#b0001e;font-weight:700;">2026年8月</span>、生成AIに関する知的財産保護の新方針を発表した。AI企業に対し、学習データの公開や権利者への開示を求めるもので、<span style="color:#0d3461;font-weight:700;">Google</span>や<span style="color:#0d3461;font-weight:700;">OpenAI</span>などの海外企業も対象となる。当面は罰則適用が見送られるものの、クリエイターの権利保護と技術革新のバランスを模索する姿勢が鮮明になった。EUでも<span style="color:#0d3461;font-weight:700;">EU AI法</span>の透明性義務が適用され、グローバルにAI利用のガバナンス強化が進む。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">開発者向け</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">OpenAI</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">Assistants API終了</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#b0001e;font-weight:700;">8月26日</span>に<span style="color:#0d3461;font-weight:700;">Assistants API</span>の提供を終了し、<span style="color:#0d3461;font-weight:700;">Responses API</span>への移行を開発者に促している。自動移行ツールは提供されず、既存の会話履歴は手動での変換が必要となるため、早期の対応が呼びかけられている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">モデル価格</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">GPT-5.6 Luna大幅値下げ</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-5.6 Luna</span>が<span style="color:#b0001e;font-weight:700;">80%</span>値下げされ、<span style="color:#b0001e;font-weight:700;">100万トークンあたり0.20ドル</span>に。AI利用コストが劇的に低下し、開発障壁が減少。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">Google</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">Gemini 3.7 Flash登場</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>が<span style="color:#0d3461;font-weight:700;">Gemini 3.7 Flash</span>を正式リリース。<span style="color:#b0001e;font-weight:700;">12月末</span>まで<span style="color:#b0001e;font-weight:700;">半額</span>プロモーションを実施し、エージェントタスクで最大<span style="color:#b0001e;font-weight:700;">65%</span>のコスト削減。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">エッジAI</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">Jetson Orin Nano 2発表</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NVIDIA</span>が小型エッジAIボード「<span style="color:#0d3461;font-weight:700;">Jetson Orin Nano 2</span>」を発表。推論性能が<span style="color:#b0001e;font-weight:700;">2倍</span>向上し、<span style="color:#0d3461;font-weight:700;">Gemma 4</span>や<span style="color:#0d3461;font-weight:700;">Qwen 3</span>などのLLMに対応。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">AIエージェント</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">企業で急増、課題も</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">企業内でのAIエージェント導入が急増し、従業員<span style="color:#b0001e;font-weight:700;">1人</span>あたり約<span style="color:#b0001e;font-weight:700;">1体</span>のペースで普及。多くが<span style="color:#0d3461;font-weight:700;">IT</span>管理外で過剰な権限を持つリスクが指摘されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">AIと倫理</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">道徳的判断にAIの影響</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">神戸大学</span>の研究で、生成AIの反論により<span style="color:#b0001e;font-weight:700;">3割以上</span>の人が道徳的判断を覆すことが判明。AIの説得効果と脆弱性が示された。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">知財保護</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">ByteDanceが版権合意</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ByteDance</span>が<span style="color:#0d3461;font-weight:700;">映画芸術科学アカデミー</span>と合意。AI動画モデルの著作権保護を強化し、ハリウッドからの懸念に対応する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">進化するAIの役割</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AI、自律的な</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">「相棒」へ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AIは、これまでの「指示を受けて動く道具」から、「自ら気づき提案する相棒」へとその役割を大きく変えつつある。<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の<span style="color:#0d3461;font-weight:700;">PC</span>版に搭載された「<span style="color:#0d3461;font-weight:700;">コンピューターヒストリー</span>」機能は、ユーザーの作業を学習し自動化を提案。また、プログラミング用AI「<span style="color:#0d3461;font-weight:700;">クロードコード</span>」は、危険なコマンドを人間よりも高い<span style="color:#b0001e;font-weight:700;">89%</span>の確率で停止できることが判明し、自己判断モードが標準となった。これは、人間が反復的な確認作業で集中力を欠く一方で、AIが安定した判断力を維持できるためだ。さらに、AI同士が連携し「チーム」で働く時代も到来し、より複雑な問題解決への貢献が期待されている。これらの進化は、AIが人間の認知負荷を軽減し、より創造的な業務に注力できるよう支援する新たなフェーズを示唆している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AI半導体</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">半導体需給</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">ボトルネック深刻化</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AIインフラの急速な拡大は、半導体サプライチェーンに新たな圧力をもたらしている。<span style="color:#0d3461;font-weight:700;">NVIDIA</span>はメモリコストの高騰を受け、AIサーバー価格を<span style="color:#b0001e;font-weight:700;">15%</span>以上引き上げると発表。特に高帯域メモリ（<span style="color:#0d3461;font-weight:700;">HBM</span>）の需要逼迫と、先端パッケージング技術<span style="color:#0d3461;font-weight:700;">CoWoS</span>の供給制約が重なり、製造コスト全体を押し上げている。また、<span style="color:#0d3461;font-weight:700;">イーロン・マスク</span>氏率いる<span style="color:#0d3461;font-weight:700;">xAI</span>の<span style="color:#b0001e;font-weight:700;">20ギガワット</span>規模のAI計算能力拡張計画もメモリ不足に直面しており、<span style="color:#0d3461;font-weight:700;">HBM</span>および<span style="color:#0d3461;font-weight:700;">DDR5</span>の供給がボトルネックとなっている。このエネルギー制約がAIチップのアーキテクチャ革新を加速させ、低消費電力設計が次世代競争の主軸になるとの見方が強まっている。カスタム半導体の台頭も、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>一強時代に変化の兆しを見せている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AIと社会</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AIの倫理</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">新次元へ</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AIの社会実装が進む中で、倫理的課題は新たな次元へと移行している。従来の誤答、差別、プライバシーに加え、ソーシャルメディアの推薦アルゴリズムや生成AIコンパニオンが、ユーザーの認知、感情、意思決定、ひいてはメンタルヘルスやウェルビーイングに与える影響が深刻な懸念となっている。AIが長時間の対話やパーソナライズを通じて、依存的利用、認知の偏り、心理的脆弱性の増幅を招きうる点が新たな課題として注目されている。これに対し、欧州の<span style="color:#0d3461;font-weight:700;">Digital Services Act</span>（<span style="color:#0d3461;font-weight:700;">DSA</span>）や<span style="color:#0d3461;font-weight:700;">EU AI Act</span>など、AI活用に伴う倫理的懸念を規制する動きが加速。企業は「<span style="color:#0d3461;font-weight:700;">Responsible AI</span>/<span style="color:#0d3461;font-weight:700;">Trusted AI</span>」を経営戦略の中核に据え、AIリテラシー教育や安心して使える仕組みづくりが急務となっている。</p></div></foreignObject>
