<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">安全性強化へ国際協力加速</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">生成AI悪用阻止へ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">動く世界</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">アンソロピック社</span>は、自社の生成<span style="color:#0d3461;font-weight:700;">AI</span>「<span style="color:#0d3461;font-weight:700;">クロード</span>」が生物兵器開発に悪用されようとした事例を検知し、これに対処するため新たな認証制度を導入すると発表した。この制度は、研究の信頼性と安全基準を満たすグループにのみ先端<span style="color:#0d3461;font-weight:700;">AI</span>の利用を許可し、<span style="color:#b0001e;font-weight:700;">30日間</span>のデータ保存と監視を行う。一方、<span style="color:#0d3461;font-weight:700;">国連</span>は<span style="color:#0d3461;font-weight:700;">AI</span>ガバナンスの国際協調を強く呼びかけており、<span style="color:#0d3461;font-weight:700;">アントニオ・グテーレス事務総長</span>は、自主的な<span style="color:#0d3461;font-weight:700;">AI</span>開発の減速努力だけでは不十分だと強調した。さらに、<span style="color:#0d3461;font-weight:700;">オープンAI</span>、<span style="color:#0d3461;font-weight:700;">アンソロピック</span>、<span style="color:#0d3461;font-weight:700;">グーグル・ディープマインド</span>の<span style="color:#b0001e;font-weight:700;">3社</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>の安全性について数週間にわたる協議を続けており、国際的な協調と厳格な安全対策の必要性が高まっている。自主的な取り組みだけでは国境を越える<span style="color:#0d3461;font-weight:700;">AI</span>リスク管理には限界があり、<span style="color:#0d3461;font-weight:700;">EY</span>の調査も自律型<span style="color:#0d3461;font-weight:700;">AI</span>の展開加速とガバナンスの遅れを指摘している。</div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">主要AIが「世代交代」</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">大手3社、新モデルを</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">同時発表</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">オープンAI</span>、<span style="color:#0d3461;font-weight:700;">グーグル</span>、<span style="color:#0d3461;font-weight:700;">アンソロピック</span>の主要<span style="color:#0d3461;font-weight:700;">AI</span>企業<span style="color:#b0001e;font-weight:700;">3社</span>が、<span style="color:#b0001e;font-weight:700;">9月上旬</span>にわずか<span style="color:#b0001e;font-weight:700;">数日間</span>で次々と新モデルを発表した。これは<span style="color:#0d3461;font-weight:700;">AI</span>業界における「世代交代」とも呼ばれる開発競争の激化を示している。<span style="color:#0d3461;font-weight:700;">オープンAI</span>は「<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>」を、<span style="color:#0d3461;font-weight:700;">グーグル</span>はリアルタイム音声対話に特化した「<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Live</span>」および多段階推論向けの「<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Live Extended Thinking</span>」を発表。後者は音声認識ベンチマークで<span style="color:#b0001e;font-weight:700;">82.6点</span>を記録し首位に立った。<span style="color:#0d3461;font-weight:700;">アンソロピック</span>は「<span style="color:#0d3461;font-weight:700;">Claude Fable 5.1</span>」と「<span style="color:#0d3461;font-weight:700;">Claude Miso OS 5.1</span>」を投入し、性能向上だけでなく安全性やコスト面での改善も進んでいることを示唆している。この急速な進化は、<span style="color:#0d3461;font-weight:700;">AI</span>が単に「答える存在」から「任せられる存在」へと役割を広げている転換点を象徴している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AIインフラ増強に課題</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">データストレージ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">不足顕著に</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">シーゲイト社</span>の<span style="color:#b0001e;font-weight:700;">2026年</span>データインフラ準備状況報告書によると、調査対象の企業意思決定者の<span style="color:#b0001e;font-weight:700;">99%</span>が、<span style="color:#b0001e;font-weight:700;">3年以内</span>に<span style="color:#0d3461;font-weight:700;">AI</span>がストレージ需要を増加させると予測している。しかし、組織が完全に準備できていると考えているのはわずか<span style="color:#b0001e;font-weight:700;">38%</span>に過ぎない。<span style="color:#0d3461;font-weight:700;">AI</span>導入における最大の障壁はデータ品質と準備状況（<span style="color:#b0001e;font-weight:700;">53%</span>）で、次いでストレージインフラ（<span style="color:#b0001e;font-weight:700;">43%</span>）が挙げられている。<span style="color:#b0001e;font-weight:700;">77%</span>の企業がエネルギーおよび持続可能性への懸念から<span style="color:#0d3461;font-weight:700;">AI</span>インフラ拡張を遅延または再構築しており、インフラ整備が喫緊の課題となっている。<span style="color:#0d3461;font-weight:700;">米国下院</span>では<span style="color:#b0001e;font-weight:700;">9月16日</span>、データセンターの電力料金に関する法案を可決した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">AI規制進む米国</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">カリフォルニア州、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">広告に新法</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">カリフォルニア州</span>の<span style="color:#0d3461;font-weight:700;">ギャビン・ニューサム知事</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>生成されたパフォーマーの広告利用に開示を義務付ける法案「<span style="color:#0d3461;font-weight:700;">SB 1050</span>」に署名し、法制化した。これにより、デジタル広告における透明性が向上する見込みだ。<span style="color:#b0001e;font-weight:700;">2026年</span>には全米<span style="color:#b0001e;font-weight:700;">27州</span>で<span style="color:#b0001e;font-weight:700;">85以上</span>の<span style="color:#0d3461;font-weight:700;">AI</span>関連法が成立しており、<span style="color:#0d3461;font-weight:700;">ニューヨーク州</span>でもチャットボットの安全性や訓練データに関する法案が知事の署名を待っている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">AIガバナンス</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">CMO・CIO間で不一致</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Acquia</span>の調査で、<span style="color:#0d3461;font-weight:700;">CMO</span>と<span style="color:#0d3461;font-weight:700;">CIO</span>の間で<span style="color:#0d3461;font-weight:700;">AI</span>の所有権とガバナンスに関する意見の不一致が判明。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">代理AI</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">ハルシネーションの代償</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Collibra</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>チームがエージェントの出力検証のために「ハルシネーション税」を支払っていると指摘した。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">AIが雇用を削減？</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Pew</span>の調査によると、<span style="color:#b0001e;font-weight:700;">37カ国中34カ国</span>で、<span style="color:#0d3461;font-weight:700;">AI</span>が雇用を創出するよりも削減すると予想する人が多い。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">法律分野</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">GPT-6 Astraが活躍</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の「<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>」が<span style="color:#b0001e;font-weight:700;">2億3000万</span>以上の法律<span style="color:#0d3461;font-weight:700;">URL</span>と統合され、法律分野で高い正答率を記録。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">AI障害</text>

<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">9月3日</span>、<span style="color:#0d3461;font-weight:700;">ChatGPT</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>、<span style="color:#0d3461;font-weight:700;">Gemini</span>などが<span style="color:#0d3461;font-weight:700;">Azure</span>障害により<span style="color:#b0001e;font-weight:700;">90分間</span>ダウン。</p></div></foreignObject>

<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">国連、AIガバナンスに尽力</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">国際協調で</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">安全な未来へ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">国連</span>は、急速に進化する<span style="color:#0d3461;font-weight:700;">AI</span>技術の利益を享受しつつ、国境を越えるリスクを管理するための国際協調を強く推進している。<span style="color:#0d3461;font-weight:700;">アントニオ・グテーレス事務総長</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>開発が安全、確実、責任あるものとなるよう、国際的な協力を繰り返し呼びかけている。事務総長は、自主的な<span style="color:#0d3461;font-weight:700;">AI</span>開発の減速努力だけでは、それが孤立し、検証不可能または不均一に適用される場合、不十分であると指摘。また、<span style="color:#0d3461;font-weight:700;">AI</span>児童安全誓約と、開発途上国が<span style="color:#0d3461;font-weight:700;">AI</span>インフラと能力を構築するのを支援するための<span style="color:#0d3461;font-weight:700;">グローバル<span style="color:#0d3461;font-weight:700;">AI</span>基金</span>の設立を提唱している。<span style="color:#0d3461;font-weight:700;">国連総会</span>の傍らでも<span style="color:#0d3461;font-weight:700;">AI</span>と人間性の関係に焦点を当てたイベントが予定されており、<span style="color:#0d3461;font-weight:700;">国連</span>が<span style="color:#0d3461;font-weight:700;">AI</span>の未来に果たす役割はますます重要になっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">アンソロピック、AI悪用対策を強化</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">生物兵器利用への</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">懸念から認証制度</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アンソロピック社</span>は、<span style="color:#b0001e;font-weight:700;">2025年12月</span>から<span style="color:#b0001e;font-weight:700;">2026年8月</span>にかけて、自社の生成<span style="color:#0d3461;font-weight:700;">AI</span>「<span style="color:#0d3461;font-weight:700;">クロード</span>」が生物兵器開発に悪用されようとした事例を複数検知したと発表した。特に、蚊が媒介する「<span style="color:#0d3461;font-weight:700;">チクングニアウイルス</span>」の感染力増強や免疫回避変異の研究に<span style="color:#0d3461;font-weight:700;">クロード</span>の利用が試みられたという。これを受け、同社は<span style="color:#b0001e;font-weight:700;">9月10日</span>に報告書を公表し、研究の信頼性と安全基準を満たした研究グループにのみ先端<span style="color:#0d3461;font-weight:700;">AI</span>の利用を許可する「認証制度」を導入することを決定した。さらに、悪用を防ぐため、認証を受けた研究グループのデータを<span style="color:#b0001e;font-weight:700;">30日間</span>保存し、利用パターンを厳しく監視する体制を敷くとしている。この取り組みは、<span style="color:#0d3461;font-weight:700;">AI</span>の潜在的悪用に対する業界の警戒感の高まりと、具体的な対策の必要性を示している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AI業界、転換期を迎える</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">モデルの「世代交代」と</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">競争激化の波</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年9月上旬</span>、<span style="color:#0d3461;font-weight:700;">オープンAI</span>、<span style="color:#0d3461;font-weight:700;">グーグル</span>、<span style="color:#0d3461;font-weight:700;">アンソロピック</span>といった主要<span style="color:#0d3461;font-weight:700;">AI</span>企業が立て続けに新モデルを発表し、業界は「世代交代」の転換期を迎えている。<span style="color:#0d3461;font-weight:700;">オープンAI</span>の「<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>」、<span style="color:#0d3461;font-weight:700;">グーグル</span>の「<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>」、<span style="color:#0d3461;font-weight:700;">アンソロピック</span>の「<span style="color:#0d3461;font-weight:700;">Claude Fable 5.1</span>」などがその代表だ。この動きは、単なる性能向上に留まらず、<span style="color:#0d3461;font-weight:700;">AI</span>の役割が「質問に答える存在」から「具体的なタスクを任せられるエージェント」へと変化していることを示唆している。<span style="color:#0d3461;font-weight:700;">グーグル</span>の「<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Live Extended Thinking</span>」は音声対話でベンチマークをリードし、各社は機能強化と同時に、コスト効率や安全性にも注力している。このような競争の激化は、<span style="color:#0d3461;font-weight:700;">AI</span>技術の普及と実用化をさらに加速させるだろう。</p></div></foreignObject>
