<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">エージェントAIの新時代到来</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">OpenAI、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">GPT-5.6と「Work」発表</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は、最新モデル「<span style="color:#0d3461;font-weight:700;">GPT-5.6</span>」を公開し、高性能な<span style="color:#0d3461;font-weight:700;">Sol</span>、速度重視の<span style="color:#0d3461;font-weight:700;">Luna</span>、バランス型の<span style="color:#0d3461;font-weight:700;">Terra</span>の<span style="color:#b0001e;font-weight:700;">3</span>種を提供開始しました。同時に発表された新エージェント「<span style="color:#0d3461;font-weight:700;">ChatGPT Work</span>」は、アプリやファイルを横断し、数時間かけて自律的に成果物を仕上げる点が最大の特徴です。この動きは、AIが単なるチャットボットから、複雑なタスクを自律的に遂行するエージェントへと進化する「エージェントの時代」の到来を明確に示しています。また、全二重方式の新音声モデル「<span style="color:#0d3461;font-weight:700;">GPT-Live</span>」も発表され、人間らしい自然な会話が可能となりました。これに伴い、<span style="color:#b0001e;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude CoWork</span>もウェブ・モバイル版を拡大し、<span style="color:#0d3461;font-weight:700;">xAI</span>は<span style="color:#0d3461;font-weight:700;">Cursor</span>との共同訓練によるコーディング特化型「<span style="color:#0d3461;font-weight:700;">Grok 4.5</span>」を投入するなど、主要各社がエージェント機能と実用性の向上を競い合っています。
</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">高まる需要と競争</p><p style="text-indent:1em;margin:0 0 2px;">
AIエージェントの進化は、企業の業務自動化を大きく加速させると期待されており、特に<span style="color:#0d3461;font-weight:700;">GPT-5.6 Sol</span>にはサイバーセキュリティモデルとしての機能強化も含まれています。一方で、AIモデルの利用料金は「大価格戦争」により劇的に低下しており、企業はコストパフォーマンスを考慮したモデル選定が求められる状況です。高性能AIがより手軽に利用可能になることで、新たなビジネス機会が創出されると同時に、競争も一層激化すると見られています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">安全なAI運用へ</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">AIセキュリティ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">連合が始動</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">AI技術の急速な進化に伴い、その安全性と規制の重要性が高まっています。<span style="color:#0d3461;font-weight:700;">Open Secure AI Alliance</span>が本格始動し、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Microsoft</span>といった主要企業が、安全なAI運用に向けた共同開発と取り組みを強化しています。この連合は、AIセキュリティツールの共同開発、レッドチームによる安全性評価、オープンソース防御技術の共有を目指しています。また、<span style="color:#0d3461;font-weight:700;">CISA</span>は、自律型エージェントがIDおよびアクセス管理に新たな脆弱性を生み出す可能性を警告しており、AIセキュリティ関連の買収件数は<span style="color:#b0001e;font-weight:700;">2026年上半期</span>で前年の<span style="color:#b0001e;font-weight:700;">3</span>倍に増加しました。国際的な規制強化の動きも加速しており、<span style="color:#0d3461;font-weight:700;">欧州委員会</span>は<span style="color:#0d3461;font-weight:700;">Google</span>に対し、<span style="color:#0d3461;font-weight:700;">Android</span>を競合<span style="color:#0d3461;font-weight:700;">AI</span>アシスタントに開放し、検索データを共有するよう命令しました。これは、AI市場における公正な競争を促進し、消費者の選択肢を広げることを目的としています。AIの「成長」と「リスク管理」の両立が、業界全体の最重要課題となっています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">主要LLMの進化</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">Claude「Reflect」</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">Grok 4.5も登場</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">主要な<span style="color:#0d3461;font-weight:700;">LLM</span>プロバイダーも、競争力を高める新機能やモデルを次々と発表しています。<span style="color:#0d3461;font-weight:700;">Anthropic</span>は、<span style="color:#0d3461;font-weight:700;">Claude</span>の利用状況を可視化する新機能「<span style="color:#0d3461;font-weight:700;">Reflect</span>」を発表しました。これは、ユーザーが<span style="color:#0d3461;font-weight:700;">AI</span>に任せるべき仕事と、自身で続けるべき仕事を考えるための「<span style="color:#b0001e;font-weight:700;">4D AI Fluency Framework</span>」と共に提供されます。一方、<span style="color:#0d3461;font-weight:700;">SpaceX AI</span>（旧<span style="color:#0d3461;font-weight:700;">xAI</span>）は、<span style="color:#0d3461;font-weight:700;">Cursor</span>との共同訓練により開発された新モデル「<span style="color:#0d3461;font-weight:700;">Grok 4.5</span>」を公開しました。このモデルはコーディングやエージェント業務に強みを発揮し、低価格と高いトークン効率を特徴としています。各社が特定用途に特化した性能向上とコスト効率を追求することで、<span style="color:#0d3461;font-weight:700;">AI</span>活用の幅がさらに広がることが期待されます。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">自動化の課題</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AIの「80-20」</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">最後の壁</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">AI技術はタスクの<span style="color:#b0001e;font-weight:700;">80%</span>を完璧にこなす一方で、残りの<span style="color:#b0001e;font-weight:700;">20%</span>で失敗するという「<span style="color:#b0001e;font-weight:700;">80-20</span>ルール」が指摘されています。この最後の部分は、ニュアンス、判断、文脈といった要素を必要とし、現在のモデルがまだ完全に把握できていない領域です。これにより、複雑なワークフローの自動化を目指す企業で大きなボトルネックが生じています。また、<span style="color:#0d3461;font-weight:700;">Grafana Labs</span>の<span style="color:#b0001e;font-weight:700;">2026年</span>観測性調査では、企業の<span style="color:#b0001e;font-weight:700;">92%</span>が<span style="color:#0d3461;font-weight:700;">AI</span>による異常検知に価値を見出す一方で、自身の<span style="color:#0d3461;font-weight:700;">AI</span>システムの観測性を実装しているのは<span style="color:#b0001e;font-weight:700;">57%</span>に過ぎないことが明らかになりました。信頼できる<span style="color:#0d3461;font-weight:700;">AI</span>の基礎として、観測性の確保が不可欠とされています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">法改正</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">改正個人情報保護法公布</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年7月17日</span>、改正個人情報保護法が公布されました。<span style="color:#0d3461;font-weight:700;">AI</span>開発を促す「同意不要」の特例と、違法行為に対する「課徴金制度」が新設されます。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">中国の動向</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">AIロマンス規制強化</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">中国</span>の規制当局は、<span style="color:#0d3461;font-weight:700;">AI</span>パワードの恋愛アプリを取り締まる動きを見せています。若者の孤立化を防ぎ、人間関係への回帰を促す狙いです。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">広告の波紋</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">MetaのAI広告、物議</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Meta</span>が公開した<span style="color:#0d3461;font-weight:700;">AI</span>ツールの新広告が、人類絶滅に関する歌を使用し物議を醸しています。ソーシャルメディアでは「見当違い」との批判が集中しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">データ確保</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">希少書をデータ化</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">AI企業が学習データ確保のため、希少な物理書籍を裁断してスキャンしているとの報告があり、歴史家からは怒りの声が上がっています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">新モデル</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">celeris-1発表、高速AI</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">新<span style="color:#0d3461;font-weight:700;">LLM</span>「<span style="color:#0d3461;font-weight:700;">celeris-1</span>」が発表されました。<span style="color:#0d3461;font-weight:700;">GPT-5</span>レベルの知能を持ちながら、<span style="color:#b0001e;font-weight:700;">15</span>倍高速な応答時間を実現しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">静観する巨象</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">Apple、AI戦略を温存か</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">他社が<span style="color:#0d3461;font-weight:700;">AI</span>に注力する中、<span style="color:#0d3461;font-weight:700;">Apple</span>は静観を続けています。<span style="color:#0d3461;font-weight:700;">AI</span>バブル崩壊を待ち、市場の再編後に参入する戦略とアナリストは見ています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">産業戦略</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AIインフラ投資</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">国家レベルの攻防</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>インフラへの巨額投資が続く一方で、その持続性や収益性に対する市場の慎重な見方も増しています。<span style="color:#0d3461;font-weight:700;">AI</span>業界は「成長」と「リスク管理」の両立が求められる局面に入っています。<span style="color:#0d3461;font-weight:700;">OpenAI</span>や<span style="color:#0d3461;font-weight:700;">NVIDIA</span>のトップが<span style="color:#0d3461;font-weight:700;">米政府</span>関係者と協議を進めるなど、<span style="color:#0d3461;font-weight:700;">AI</span>政策は国家安全保障と密接に結びついています。各国の政府は、<span style="color:#0d3461;font-weight:700;">AI</span>を国家レベルの戦略技術と位置づけ、主導権を確保するための動きを活発化させています。例えば、<span style="color:#0d3461;font-weight:700;">ニューヨーク州</span>では、<span style="color:#b0001e;font-weight:700;">50</span>メガワット超のデータセンター新設が<span style="color:#b0001e;font-weight:700;">1</span>年間凍結されるなど、電力消費や環境への影響も考慮され始めています。また、<span style="color:#0d3461;font-weight:700;">中国</span>からは<span style="color:#0d3461;font-weight:700;">Moonshot</span>の「<span style="color:#0d3461;font-weight:700;">Kimi K3</span>」が<span style="color:#b0001e;font-weight:700;">2.8</span>兆パラメータで世界最大のオープンモデルとして登場し、<span style="color:#0d3461;font-weight:700;">上海</span>の世界<span style="color:#0d3461;font-weight:700;">AI</span>会議では<span style="color:#b0001e;font-weight:700;">29</span>カ国が中国主導の国際<span style="color:#0d3461;font-weight:700;">AI</span>機構「<span style="color:#0d3461;font-weight:700;">WAICO</span>」に署名するなど、地政学的な競争も顕著になっています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">市場動向</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">LLM大価格戦争</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">コスト重視の選定へ</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年7月</span>は、<span style="color:#0d3461;font-weight:700;">GPT-5.6</span>や<span style="color:#0d3461;font-weight:700;">Grok 4.5</span>の登場と同時に、各社が<span style="color:#0d3461;font-weight:700;">API</span>利用料金を競って引き下げる「大価格戦争」が本格化しました。<span style="color:#0d3461;font-weight:700;">OECD</span>の<span style="color:#b0001e;font-weight:700;">2025年AI市場レポート</span>によると、<span style="color:#b0001e;font-weight:700;">2023年</span>以降、主要<span style="color:#0d3461;font-weight:700;">LLM</span>の<span style="color:#b0001e;font-weight:700;">100万</span>出力トークンあたりの価格は<span style="color:#b0001e;font-weight:700;">80%</span>以上下落しており、コストが差別化要因としては二次的になっています。しかし、<span style="color:#0d3461;font-weight:700;">OpenAI GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Anthropic Claude 3.5</span>（および<span style="color:#0d3461;font-weight:700;">3.7 Opus/Sonnet/Haiku</span>）、<span style="color:#0d3461;font-weight:700;">Google Gemini 1.5 Pro</span>など、各モデルには強みと弱みがあり、最適な<span style="color:#0d3461;font-weight:700;">LLM</span>の選択は、作業タイプ、予算、ガバナンス要件、チームの実験能力に大きく依存します。例えば、<span style="color:#0d3461;font-weight:700;">GPT-4o</span>はエコシステムの幅広さ（<span style="color:#b0001e;font-weight:700;">5</span>億ユーザー）で先行し、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>は安全性と推論能力で優れ、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万</span>トークンのコンテキストウィンドウとマルチモーダルタスクでリードしています。開発者は、ワークフローに最適なモデルを選択することが、<span style="color:#b0001e;font-weight:700;">2026年</span>の成功の鍵となると指摘されています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">国連報告</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AIの危険性と</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">ガバナンス急務</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">国連</span>独立国際科学者パネルが発表した<span style="color:#0d3461;font-weight:700;">AI</span>に関する予備報告書は、<span style="color:#0d3461;font-weight:700;">AI</span>の能力が加速する一方で、安全な利用を保証するルールが追いついていないと警告しています。報告書は、効果的なグローバルガバナンスを確立するための「窓」は開いているものの、長くは続かない可能性があると指摘しました。<span style="color:#0d3461;font-weight:700;">AI</span>は、医療、教育、科学研究、農業など、持続可能な開発目標の達成を加速する大きな可能性を秘めていますが、一方で、監視がないと不平等を深め、誤情報を拡散し、人権を脅かし、労働市場を混乱させ、強力な<span style="color:#0d3461;font-weight:700;">AI</span>システムが少数の政府や企業に集中するリスクもはらんでいます。報告書は、<span style="color:#0d3461;font-weight:700;">AI</span>の計り知れない利益を解き放ちつつ、その増大するリスクを防ぐ方法を見つけることが課題であると強調しています。<span style="color:#0d3461;font-weight:700;">AI</span>エージェントの出現により、システムがプロンプトに反応するだけでなく、タスクを計画し、デジタルツールを使用し、自律的に行動する能力が高まっているため、ガバナンスの枠組みを早急に整備する必要性が高まっています。</p></div></foreignObject>
