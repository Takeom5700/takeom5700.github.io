<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AI市場過熱に警鐘</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">ナスダック急落</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">AI株に調整圧力</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#b0001e;font-weight:700;">2026年11月2日</span>、<span style="color:#0d3461;font-weight:700;">ナスダック総合指数</span>が<span style="color:#b0001e;font-weight:700;">3%</span>の大幅下落を記録し、AI関連株も軒並み急落した。投資家の間でAIセクターの評価額に対する懸念が高まっていることを示唆している。特に、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が計画していた<span style="color:#b0001e;font-weight:700;">300億ドル</span>の新たな資金調達ラウンドが目標の半分にも満たなかったことが報じられ、AI投資の過熱に陰りが見え始めているとの見方が強まっている。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">大手テック企業の投資戦略</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">アマゾン</span>、<span style="color:#0d3461;font-weight:700;">アルファベット</span>、<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>、<span style="color:#0d3461;font-weight:700;">メタ</span>、<span style="color:#0d3461;font-weight:700;">xAI</span>を含む大手<span style="color:#b0001e;font-weight:700;">5社</span>は、<span style="color:#b0001e;font-weight:700;">2026年</span>に最大<span style="color:#b0001e;font-weight:700;">8,280億ドル</span>もの巨額な設備投資を計画しており、これにより現金収支が<span style="color:#b0001e;font-weight:700;">2011年</span>以来の赤字に転落したことが、市場の不安をさらに煽る形となった。AI市場は技術革新の期待と現実の投資リスクの間で揺れ動いている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">UAEがAI戦略強化</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">OpenAIと提携拡大</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">エネルギー分野で革新</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#b0001e;font-weight:700;">2026年11月2日</span>、<span style="color:#0d3461;font-weight:700;">アブダビ政府</span>や<span style="color:#0d3461;font-weight:700;">国営石油会社ADNOC</span>、<span style="color:#0d3461;font-weight:700;">政府系投資会社Mubadala</span>などと<span style="color:#b0001e;font-weight:700;">4件</span>の契約を締結した。<span style="color:#0d3461;font-weight:700;">UAE</span>は<span style="color:#0d3461;font-weight:700;">OpenAI</span>にとって、AIサービスの顧客、計算インフラの提供拠点、そして重要な資金調達の出資者という<span style="color:#b0001e;font-weight:700;">3つ</span>の役割を担うことになる。特に<span style="color:#0d3461;font-weight:700;">ADNOC</span>との契約では、AI活用により従来数ヶ月かかっていた複雑な油田開発計画を数時間で作成・最適化することを目指すとしている。この提携は、AIが画面の中だけでなく、工場やエネルギー産業といった現実社会を動かす中核技術となりつつあることを明確に示している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI戦略リスク浮上</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">ガートナー警告</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">競争力喪失の懸念</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ガートナー</span>が発表した<span style="color:#b0001e;font-weight:700;">2026年</span>第<span style="color:#b0001e;font-weight:700;">3</span>四半期の新興リスク報告書によると、「AI戦略の誤算」と「AI駆動による競争上の地位喪失」が上位<span style="color:#b0001e;font-weight:700;">5</span>大リスクに浮上した。これは、企業がAIを戦略的機会からリスク源に変えてしまう可能性を指摘している。<span style="color:#0d3461;font-weight:700;">ガートナー</span>は、AI投資を明確なビジネス成果と結びつけ、導入前に準備状況とガバナンス体制を検証することが重要であると強調。AIの恩恵を最大化し、リスクを管理するためには、組織全体で責任ある実験を支援するガバナンスの確立が不可欠となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">AI倫理と国家戦略</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">ドイツ首相が提唱</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">人間中心のAI開発</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ドイツ</span>の<span style="color:#0d3461;font-weight:700;">フリードリヒ・メルツ首相</span>は、<span style="color:#b0001e;font-weight:700;">2026年デジタルサミット</span>で、AI開発は人間的価値観を中心に据え、人間の尊厳を技術政策の中核に置くべきだと強調した。同首相は、<span style="color:#0d3461;font-weight:700;">ドイツ</span>と<span style="color:#0d3461;font-weight:700;">欧州</span>のデジタル主権強化、産業用途に適したモデル開発支援、そして国際協力の重要性を訴えた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">韓国がAI投資倍増</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">21兆ウォン規模</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">韓国</span>は<span style="color:#b0001e;font-weight:700;">2027年度</span>予算案でAI、半導体、ロボット分野に約<span style="color:#b0001e;font-weight:700;">21兆3000億ウォン</span>を投資すると発表。前年度の約<span style="color:#b0001e;font-weight:700;">2</span>倍の規模で、国家的なAI産業育成を加速させる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">AIが生物実験</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">マウス脳へ薬剤</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">バイオテック企業がAIエージェントによる遺伝子治療薬の選定と生きたマウスの脳への注入に成功。AIが物理作業まで担う研究の自動化が進む一方、倫理的課題も浮上している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">マルチモーダル進化</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">LLM新時代へ</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>、マルチモーダルLLMは複雑な視覚推論、音声・動画理解、長文分析、ビジュアルエージェントをサポート。主要モデルは<span style="color:#0d3461;font-weight:700;">GPT-6.1 Sol</span>、<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>、<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>.</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">中国向けAI</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">iPhoneにQwen</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アリババ</span>の<span style="color:#0d3461;font-weight:700;">Qwen</span>が、<span style="color:#0d3461;font-weight:700;">中国</span>向け<span style="color:#0d3461;font-weight:700;">Apple Intelligence</span>の基盤として<span style="color:#0d3461;font-weight:700;">iPhone</span>へ搭載されると報じられた。米中テック企業の協力関係が新たな段階に入った。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">AIは仕事を奪うか</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">AGI否定論</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ニューヨーク州立大学バッファロー校</span>の専門家が「AIは仕事を奪わない」と講演。汎用人工知能（AGI）の実現可能性に疑問を呈し、誇張されたAIの約束に警鐘を鳴らす。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">エッジAIが中核</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">データ処理を革新</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">CRN</span>の<span style="color:#b0001e;font-weight:700;">2026年</span>エッジコンピューティング<span style="color:#b0001e;font-weight:700;">100</span>で、AIが市場を再構築していると発表。データ処理をデバイスに近づけ、新たな機会を創出する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">主要LLMの最前線</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">進化するAIモデル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">性能と選定の指針</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>現在、大規模言語モデル（LLM）市場では、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude</span>、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini</span>が激しい競争を繰り広げている。<span style="color:#0d3461;font-weight:700;">GPT-6.1 Sol</span>は複雑な視覚的推論とツール連携に強みを発揮し、<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>は文書処理や知識労働において、また<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>はテキスト、画像、音声、動画を統合的に理解する能力で差別化を図っている。これらのモデル選定においては、応答速度（レイテンシ）、コスト構造、ツール連携の容易さ、そしてコンプライアンス要件が重要な判断基準となる。</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>は<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>と<span style="color:#0d3461;font-weight:700;">Sonnet</span>を発表し、安全性と長文処理能力を大幅に強化。一方、<span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>をリリースし、汎用性とエンタープライズ領域での活用を推進している。モデルのバージョンアップは数ヶ月ごとに行われ、<span style="color:#0d3461;font-weight:700;">GPT-6 Rosalind</span>や<span style="color:#0d3461;font-weight:700;">Gemini 4 Carbon</span>といった新バージョンも既に登場し、継続的な性能向上が見られる。また、<span style="color:#b0001e;font-weight:700;">2026年</span>にはオープンソースモデルも閉鎖型モデルとの性能差を著しく縮めており、多様な選択肢が提供されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AI市場調整の兆し</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">ナスダック暴落</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">投資家の警戒感高まる</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年11月2日</span>、<span style="color:#0d3461;font-weight:700;">ナスダック総合指数</span>が<span style="color:#b0001e;font-weight:700;">3%</span>の急落を見せ、AI関連株も最大で<span style="color:#b0001e;font-weight:700;">5%</span>下落する事態が発生した。これは、AI分野に対する投資家の慎重姿勢が高まっていることを明確に示している。<span style="color:#0d3461;font-weight:700;">OpenAI</span>が新たに計画していた<span style="color:#b0001e;font-weight:700;">300億ドル</span>の資金調達ラウンドが目標の半分にも満たない額に留まったとの報道も、市場の過熱感に冷や水を浴びせる形となった主要因の一つである。</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">アマゾン</span>、<span style="color:#0d3461;font-weight:700;">アルファベット</span>、<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>、<span style="color:#0d3461;font-weight:700;">メタ</span>、<span style="color:#0d3461;font-weight:700;">xAI</span>を含む大手テクノロジー<span style="color:#b0001e;font-weight:700;">5社</span>は、<span style="color:#b0001e;font-weight:700;">2026年</span>に最大<span style="color:#b0001e;font-weight:700;">8,280億ドル</span>という巨額の設備投資を計画しており、これにより企業の現金収支が<span style="color:#b0001e;font-weight:700;">2011年</span>以来の赤字に転落したことも、投資家の不安を煽る一因となった。数ヶ月間の積極的な成長の後、市場は過熱状態にあるとの見方が強まっており、今回の売却は<span style="color:#b0001e;font-weight:700;">2026年</span>後半においてAI関連上場企業にとって最も significant な一日の下落の一つとなった。今後の市場動向に注目が集まる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">LLM訓練の新段階</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">人間評価から自動検証へ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">進化するAI開発手法</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2025年</span>から<span style="color:#b0001e;font-weight:700;">2026年</span>にかけて、現代の大規模言語モデル（LLM）の訓練プロセスは大きく進化している。従来、「事前学習」「教師ありファインチューニング（SFT）」「アライメント」の<span style="color:#b0001e;font-weight:700;">3</span>段階で構成されていたが、この間に専門データのための「中間学習」という第<span style="color:#b0001e;font-weight:700;">4</span>段階が加わった。特に注目すべきは、応答の人間評価が段階的に自動検証システムに置き換わり、強化学習からの人間フィードバック（RLHF）の潮流が薄れつつある点である。</p><p style="text-indent:1em;margin:0 0 2px;">事前学習で言語の基礎、事実、論理をデータから学び、SFTでアシスタントとしての応答形式を例から習得する。そしてアライメント段階で、評価と比較を通じてモデルの価値観と行動が形成される。この訓練パイプラインは各段階が前の段階の上に築かれるため、初期段階でのエラーは再訓練なしには修正できない。</p><p style="text-indent:1em;margin:0 0 2px;">また、知識カットオフはモデルのアーキテクチャ上の特徴であり、最新情報は自動的に組み込まれるわけではない。<span style="color:#0d3461;font-weight:700;">Claude Sonnet 4.5</span>の知識カットオフが<span style="color:#b0001e;font-weight:700;">2025年</span>初頭、<span style="color:#0d3461;font-weight:700;">GPT-4o</span>が<span style="color:#b0001e;font-weight:700;">2023年10月</span>、<span style="color:#0d3461;font-weight:700;">Gemini 2.5 Pro</span>が<span style="color:#b0001e;font-weight:700;">2025年</span>初頭であるように、モデルごとに異なる時点での情報に基づいている。さらに、オープンソースモデルとクローズドモデルの品質差は著しく縮小しており、<span style="color:#0d3461;font-weight:700;">Llama 4 Scout</span>が<span style="color:#0d3461;font-weight:700;">GPT-4o</span>クラスの性能に匹敵するケースも見られる。</p></div></foreignObject>
