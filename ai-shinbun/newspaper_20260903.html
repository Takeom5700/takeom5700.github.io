<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">G20イノベーション閣僚会議</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AI規制 米欧対立激化</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)"></text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">G20イノベーション閣僚会議</span>が開催され、<span style="color:#0d3461;font-weight:700;">AI</span>規制を巡る米欧の対立が鮮明になった。<span style="color:#0d3461;font-weight:700;">米国</span>は産業成長を重視し、<span style="color:#0d3461;font-weight:700;">AI</span>特化型規制ではなく、技術を特定しない「<span style="color:#0d3461;font-weight:700;">カロライナ原則</span>」の採用を提唱。これは既存の法的枠組みを活用し、イノベーションを阻害しない緩やかなアプローチを促すものだ。一方、<span style="color:#0d3461;font-weight:700;">欧州連合（EU）</span>はデジタルサービス法（DSA）に基づき、<span style="color:#0d3461;font-weight:700;">ChatGPT</span>を「超大型オンライン検索エンジン（<span style="color:#0d3461;font-weight:700;">VLOSE</span>）」に指定するなど、より厳格な規制導入を進める。この会議には<span style="color:#0d3461;font-weight:700;">Meta</span>の<span style="color:#0d3461;font-weight:700;">マーク・ザッカーバーグCEO</span>や<span style="color:#0d3461;font-weight:700;">Tesla</span>の<span style="color:#0d3461;font-weight:700;">イーロン・マスク氏</span>も参加し、規制緩和の必要性を訴えた。両者のアプローチの違いは、<span style="color:#0d3461;font-weight:700;">AI</span>技術の未来、特に倫理、安全性、競争力の確保において、国際的な協調が不可欠であることを示唆している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">Gemini進化</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">動画解析費</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">66%削減</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は、<span style="color:#0d3461;font-weight:700;">Gemini</span>の最新モデル、<span style="color:#0d3461;font-weight:700;">Gemini 3.7 Flash</span>、<span style="color:#0d3461;font-weight:700;">3.6 Flash</span>、<span style="color:#0d3461;font-weight:700;">3.5 Flash-Lite</span>にエージェント型動画理解機能を導入し、動画解析コストを最大<span style="color:#b0001e;font-weight:700;">66%</span>削減したと発表した。従来の固定フレーム処理に比べ、映像・音声・文字起こしから必要な場面のみを動的に調査することで、解析費用とトークン消費を抑えながら精度を向上させる。これにより、長時間の動画分析も効率化され、企業や開発者はより手軽に<span style="color:#0d3461;font-weight:700;">AI</span>による動画コンテンツの解析が可能となる。特に、教育、監視、メディア分野での活用が期待される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">Perplexityの新基盤</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">機密処理は</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">Mac内で</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Perplexity</span>は、エージェント基盤「<span style="color:#0d3461;font-weight:700;">Computer</span>」に、クラウドの高性能モデルと<span style="color:#0d3461;font-weight:700;">Appleシリコン</span>搭載<span style="color:#0d3461;font-weight:700;">Mac</span>上の小型モデルを使い分けるハイブリッド計算機能を導入した。公開情報の調査や高度な推論はクラウド、機密ファイルに触れる処理は端末内で行うことで、文脈を保ちつつセキュアな作業継続を実現する。企業における<span style="color:#0d3461;font-weight:700;">AI</span>活用におけるデータプライバシーとセキュリティの課題解決に貢献すると期待されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">教育現場のAI規制</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">NY市が</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">AI禁止発表</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ニューヨーク市</span>は、公立小学校から中学校（<span style="color:#b0001e;font-weight:700;">8年生</span>まで）において<span style="color:#0d3461;font-weight:700;">AI</span>ツールの使用を禁止すると発表した。これにより、<span style="color:#0d3461;font-weight:700;">AI</span>の教育現場への導入における倫理的、教育的課題への対応が求められる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">OpenAI広告</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">年10億ドル超</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">ChatGPT Ads</span>事業収益が年換算で<span style="color:#b0001e;font-weight:700;">10億ドル</span>を突破。無料ユーザーへのサービス継続・拡充の財源を確保。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">DeepSeek公開</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">マルチモーダル無償化</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">DeepSeek</span>が<span style="color:#0d3461;font-weight:700;">V4-Flash-Vision-Exp</span>を<span style="color:#0d3461;font-weight:700;">MITライセンス</span>でオープンウェイト公開。商用・研究問わず無償利用可能。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">Googleの新ツール</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">AI管理機能展開</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google Search Console</span>にウェブ運営者向け<span style="color:#0d3461;font-weight:700;">AI</span>管理ツールが正式展開。AI検索結果での引用可否を制御。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">医療AI連携</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">ChatGPTがEpicに</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>が<span style="color:#0d3461;font-weight:700;">ChatGPT for Healthcare</span>を<span style="color:#0d3461;font-weight:700;">Epic</span>の電子診療記録（<span style="color:#0d3461;font-weight:700;">EHR</span>）と接続。臨床現場の効率化に貢献。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">Apple訴訟</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">OpenAIに証拠要求</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Apple</span>が<span style="color:#0d3461;font-weight:700;">OpenAI</span>に対し、営業秘密訴訟で迅速な証拠開示を要求。AI競争の法的側面が顕在化。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">分散AI活用</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">家庭PCをAI推論に</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Far Labs</span>や<span style="color:#0d3461;font-weight:700;">Evolving Edge</span>が家庭PCの余剰計算力を<span style="color:#0d3461;font-weight:700;">AI</span>推論に有償活用するサービスを開始。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">Enterprise AI OS</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">Wonderful社</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">5.5億ドル調達</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アムステルダム</span>を拠点とするスタートアップ、<span style="color:#0d3461;font-weight:700;">Wonderful社</span>が、企業向け<span style="color:#0d3461;font-weight:700;">AIオペレーティングシステム（AI OS）</span>構築のため、シリーズCで<span style="color:#b0001e;font-weight:700;">5億5000万ドル</span>を調達し、評価額は<span style="color:#b0001e;font-weight:700;">50億ドル</span>に達したと発表した。同社は、企業が個別に<span style="color:#0d3461;font-weight:700;">AI</span>ツールを導入することで、<span style="color:#0d3461;font-weight:700;">SaaS</span>時代に発生したような乱雑なシステム環境が再現されるリスクを指摘。これを避けるため、エージェント、ワークフロー、<span style="color:#0d3461;font-weight:700;">AIネイティブ</span>アプリケーション、企業コンテキスト、統合、ガバナンス実行を組織全体で調整する共有レイヤーを提供することを目指している。<span style="color:#0d3461;font-weight:700;">Wonderful AI OS</span>はモデルに依存せず、既存の技術スタックと連携可能で、複雑なエンドツーエンドプロセスを自動化する管理ワークフロー、従業員の意思決定を支援する生産性エージェント、レガシーソフトウェアを補完または置き換える<span style="color:#0d3461;font-weight:700;">AIネイティブ</span>アプリケーション、顧客サービス向けの会話型エージェントの<span style="color:#b0001e;font-weight:700;">4</span>つの製品ラインを展開する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AI業界トレンド</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">性能競争から</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">価格・インフラへ</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年9月</span>時点の<span style="color:#0d3461;font-weight:700;">AI</span>業界は、かつての「性能競争」から「価格とインフラの主導権争い」へと明確に重心を移している。主要な汎用チャット型<span style="color:#0d3461;font-weight:700;">AI</span>モデルは性能が拮抗しつつあり、ユーザーはコストパフォーマンスを重視する傾向が強まっている。<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>は総合性能で優位を保ち、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-5.6 Sol</span>はコーディングと難問推論に強みを持つが、<span style="color:#b0001e;font-weight:700;">8月</span>に<span style="color:#b0001e;font-weight:700;">20%</span>値下げを行うなど価格戦略が活発化している。また、<span style="color:#0d3461;font-weight:700;">Google Veo</span>が動画生成<span style="color:#0d3461;font-weight:700;">AI</span>の分野で優位を継続し、中国の<span style="color:#0d3461;font-weight:700;">Kling</span>がコストパフォーマンスで存在感を示す。家庭用<span style="color:#0d3461;font-weight:700;">PC</span>の余剰計算力を<span style="color:#0d3461;font-weight:700;">AI</span>推論に有償活用する動きも出ており、多様なインフラ活用が模索されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">Anthropic最新</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">Claude Fable/Mythos</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">安全性重視の進化</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>は、<span style="color:#b0001e;font-weight:700;">2026年9月2日</span>に次世代モデル「<span style="color:#0d3461;font-weight:700;">Claude Fable 5.1</span>」と「<span style="color:#0d3461;font-weight:700;">Claude Mythos 5.1</span>」を発表した。これらのモデルは、推論能力と安全性において大幅な強化が図られている。<span style="color:#0d3461;font-weight:700;">Anthropic</span>は、特に責任ある<span style="color:#0d3461;font-weight:700;">AI</span>開発に注力しており、新モデルでは、有害なコンテンツ生成の抑制や、複雑な倫理的ジレンマに対する理解度が向上しているという。これにより、企業や研究機関がより安全に<span style="color:#0d3461;font-weight:700;">AI</span>を活用できる環境を提供することを目指す。また、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の次世代モデル「<span style="color:#0d3461;font-weight:700;">Astra</span>」も強力なサイバー能力などについて追加安全策が必要とされており、高性能<span style="color:#0d3461;font-weight:700;">AI</span>における「能力ごとのアクセス制限」が今後の標準になる可能性が示唆されている。安全対策と高性能化の両立が、<span style="color:#b0001e;font-weight:700;">2026年</span>後半の<span style="color:#0d3461;font-weight:700;">AI</span>競争の鍵となるだろう。</p></div></foreignObject>
