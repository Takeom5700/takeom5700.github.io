<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AIエージェント新時代到来</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">自律的進化と</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">ガバナンスの壁</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">AIエージェントが、私たちの働き方と日常生活を根本から変革しつつある。<span style="color:#b0001e;font-weight:700;">2025年</span>には、反復的かつ複雑なタスクを自律的に処理する能力が向上し、職場での生産性を劇的に向上させることが期待されている。<span style="color:#0d3461;font-weight:700;">Microsoft Copilot</span>のようなAIコンパニオンは、日々のタスクを効率化し、情報集約や視覚支援を提供している。生成AIの利用は<span style="color:#b0001e;font-weight:700;">2023年</span>の<span style="color:#b0001e;font-weight:700;">55%</span>から<span style="color:#b0001e;font-weight:700;">2024年</span>には<span style="color:#b0001e;font-weight:700;">75%</span>に急増し、投資<span style="color:#b0001e;font-weight:700;">1ドル</span>に対し<span style="color:#b0001e;font-weight:700;">3.70ドル</span>のリターンを生んでいる。しかし、この急速な進化は同時に新たな課題も提起する。AIエージェントの自律性拡大に伴い、その行動範囲の線引きと人間による監視の維持が不可欠な議論となっている。企業は、AIの不正確さといったリスクに対処しつつ、責任あるAI運用を確立するためのツールを求めている。<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini</span>新モデル発表や<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude Fable 5</span>といった主要<span style="color:#0d3461;font-weight:700;">LLM</span>の競争激化も、エージェント機能の高度化を後押ししている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">LLM市場の覇権争い</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">GPT対Claude</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">対Gemini、三つ巴の戦い</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）市場では、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>、そして<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>が熾烈な競争を繰り広げている。<span style="color:#0d3461;font-weight:700;">GPT-4o</span>は広範なエコシステムとユーザー基盤でリードする一方、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>は安全性と長文コンテキスト推論で優位性を見せる。また、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万トークン</span>という大規模なコンテキストウィンドウとマルチモーダル処理能力で際立つ。<span style="color:#b0001e;font-weight:700;">2026年</span>の企業向け<span style="color:#0d3461;font-weight:700;">LLM</span>選定は、抽象的なベンチマークよりも、特定のワークフローでの失敗パターンやレイテンシ、コストが重要視されている。<span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#b0001e;font-weight:700;">3社</span>は、それぞれ異なる戦略で覇権を争い、「<span style="color:#b0001e;font-weight:700;">数十億ドル</span>規模のAI競争」が続いている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">進むAI規制、各国で枠組み構築</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">EU AI法、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">日本でも法整備</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">人工知能（<span style="color:#0d3461;font-weight:700;">AI</span>）技術の急速な発展に伴い、各国で<span style="color:#0d3461;font-weight:700;">AI</span>規制の動きが加速している。<span style="color:#0d3461;font-weight:700;">欧州連合</span>では<span style="color:#b0001e;font-weight:700;">2024年5月</span>に<span style="color:#0d3461;font-weight:700;">EU AI Act</span>が成立し、<span style="color:#b0001e;font-weight:700;">2025年2月</span>から「禁止される<span style="color:#0d3461;font-weight:700;">AI</span>」に関する条項が適用されている。<span style="color:#0d3461;font-weight:700;">日本</span>でも<span style="color:#b0001e;font-weight:700;">2025年9月1日</span>に「<span style="color:#0d3461;font-weight:700;">人工知能関連技術の研究開発及び活用の推進に関する法律</span>」が全面施行される予定だ。<span style="color:#0d3461;font-weight:700;">米国</span>では連邦政府が全国共通の枠組み策定を目指す一方、州レベルでの規制の違いが課題となっている。これらの規制は、<span style="color:#0d3461;font-weight:700;">AI</span>の倫理的・社会的なリスクに対応し、イノベーションと安全性のバランスをいかに取るかが焦点だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">量子AIが新境地開拓</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">計算革命、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">産業応用へ</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">量子コンピューティングと人工知能（<span style="color:#0d3461;font-weight:700;">AI</span>）の融合が、<span style="color:#b0001e;font-weight:700;">2025年</span>から<span style="color:#b0001e;font-weight:700;">2026年</span>にかけて最も注目されるトレンドの一つとなっている。<span style="color:#0d3461;font-weight:700;">量子機械学習（QML）</span>と呼ばれるこの分野は、大規模データセットの高速な特徴量抽出、組み合わせ最適化問題、創薬シミュレーションなどに応用が期待されている。<span style="color:#0d3461;font-weight:700;">Google</span>は量子<span style="color:#0d3461;font-weight:700;">AI</span>を組み合わせた新材料探索を発表し、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>も量子シミュレーション用プラットフォームを強化している。各国政府は量子技術を国家安全保障上の重要分野と位置づけ、巨額の予算を投じ開発を推進している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">テック動向</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">AIエージェント</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">AI</span>エージェント利用者が<span style="color:#b0001e;font-weight:700;">1,000万人</span>に達した。生成<span style="color:#0d3461;font-weight:700;">AI</span>の主戦場がチャットから自律的業務実行へと移行。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">産業インフラ</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">NVIDIA戦略</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NVIDIA</span>が<span style="color:#0d3461;font-weight:700;">GPU</span>に加え、次世代メモリ、光電融合、ネットワークまで含む<span style="color:#0d3461;font-weight:700;">AI</span>インフラ全方位戦略を強化。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">国際協力</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">APEC宣言</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年7月23日</span>、<span style="color:#0d3461;font-weight:700;">APECデジタル・AI閣僚級会議</span>で「<span style="color:#0d3461;font-weight:700;">成都声明</span>」を採択。<span style="color:#0d3461;font-weight:700;">AI</span>活用推進で合意。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">経済効果</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">台湾GDP予測</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">台湾経済研究院</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>ブームを受け<span style="color:#b0001e;font-weight:700;">GDP</span>成長率予測を<span style="color:#b0001e;font-weight:700;">10.38%</span>に上方修正。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">社会問題</text>

<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">7月25日</span>、<span style="color:#0d3461;font-weight:700;">バンクーバー</span>で<span style="color:#0d3461;font-weight:700;">AI</span>データセンター建設に反対する大規模なデモが予定。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">サイバー安全</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>

<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AIが変える労働市場</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">雇用調整と</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">新たな機会</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">人工知能（<span style="color:#0d3461;font-weight:700;">AI</span>）の急速な進化は、世界の労働市場に大きな影響を与えている。<span style="color:#0d3461;font-weight:700;">KDDI SUMMIT 2025</span>での議論によると、米国では特にソフトウェア開発者の若年層の雇用が縮小傾向にあり、<span style="color:#b0001e;font-weight:700;">5年前</span>には高収入が期待された職種でも就職が困難になっている。<span style="color:#b0001e;font-weight:700;">日本国内</span>の分析でも、<span style="color:#b0001e;font-weight:700;">2024年時点</span>で<span style="color:#b0001e;font-weight:700;">20〜50%</span>のタスクが<span style="color:#0d3461;font-weight:700;">AI</span>で代替可能とされ、<span style="color:#b0001e;font-weight:700;">2030年</span>には物理的作業を除く大半の職種で<span style="color:#b0001e;font-weight:700;">60%以上</span>、<span style="color:#b0001e;font-weight:700;">2040年</span>には<span style="color:#b0001e;font-weight:700;">80%以上</span>のタスクが自動化される見込みだ。企業は中期計画において、職種の変化を考慮する必要に迫られている。一方で、<span style="color:#0d3461;font-weight:700;">PwC</span>の<span style="color:#b0001e;font-weight:700;">2025年</span>予測では、<span style="color:#0d3461;font-weight:700;">AI</span>が<span style="color:#b0001e;font-weight:700;">2035年</span>までに世界の<span style="color:#0d3461;font-weight:700;">GDP</span>を<span style="color:#b0001e;font-weight:700;">約15%</span>拡大させるとされており、新たな高価値な仕事や産業が生まれる可能性も指摘されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AI基盤の電力課題</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">データセンターと</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">環境への影響</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>技術の発展は、その基盤となるデータセンターの需要を爆発的に増加させている。これに伴い、電力消費量の増大が深刻な課題として浮上している。<span style="color:#0d3461;font-weight:700;">AI</span>産業は、モデル性能だけでなく、半導体、通信、電力、冷却、そして適切な立地といった物理基盤を束ねる総合競争へと移行している。特にデータセンターの電力制約は、今後の<span style="color:#0d3461;font-weight:700;">AI</span>成長を左右するボトルネックとなりつつある。このような状況に対し、住民からの懸念も高まっている。例えば、<span style="color:#b0001e;font-weight:700;">2026年7月25日</span>には<span style="color:#0d3461;font-weight:700;">カナダ</span>の<span style="color:#0d3461;font-weight:700;">バンクーバー</span>で「<span style="color:#0d3461;font-weight:700;">No AI Vancouver</span>」グループが、<span style="color:#0d3461;font-weight:700;">AI</span>データセンター建設に反対する大規模なデモと行進を計画している。持続可能な<span style="color:#0d3461;font-weight:700;">AI</span>開発には、エネルギー効率の改善や再生可能エネルギーの導入など、環境負荷低減に向けた技術革新と政策的支援が急務となっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">量子×AIの計算革命</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">QMLが拓く</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">科学と産業の未来</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2025年</span>は「国際量子科学技術年」に指定され、量子コンピューティングと人工知能（<span style="color:#0d3461;font-weight:700;">AI</span>）の融合が計算科学に革命をもたらしている。<span style="color:#0d3461;font-weight:700;">量子機械学習（QML）</span>は、従来のコンピューターでは不可能だった大規模計算を現実のものとし、医薬品開発、材料科学、金融リスク分析など、多岐にわたる分野で応用が進められている。特に、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Willowチップ</span>による量子エラー訂正のブレークスルーや、<span style="color:#0d3461;font-weight:700;">理化学研究所</span>が稼働させた国産量子コンピュータ「<span style="color:#0d3461;font-weight:700;">叡</span>」の性能向上は、実用化を加速させる。各国政府も「自国で強力な計算力を保有することが国益に直結する」との認識の下、巨額の投資を行い、この最先端技術の覇権を争っている。<span style="color:#0d3461;font-weight:700;">産総研</span>は<span style="color:#0d3461;font-weight:700;">CEATEC 2025</span>で量子・<span style="color:#0d3461;font-weight:700;">AI</span>融合技術をアピールし、産業化を支援している。</p></div></foreignObject>
