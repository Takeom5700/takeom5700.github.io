<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">最新調査</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AIがネットコンテンツの</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">３分の１超を生成</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">Pew Research Centerの報告によると、<span style="color:#b0001e;font-weight:700;">2026年7月</span>時点でインターネット上のコンテンツの<span style="color:#b0001e;font-weight:700;">3分の1以上</span>が<span style="color:#0d3461;font-weight:700;">AI</span>によって作成されていることが明らかになった。これは、<span style="color:#b0001e;font-weight:700;">2022年終盤</span>に<span style="color:#0d3461;font-weight:700;">OpenAI</span>が<span style="color:#0d3461;font-weight:700;">ChatGPT</span>をリリースして以来、<span style="color:#0d3461;font-weight:700;">AI</span>作成コンテンツの割合が急増していることを示している。特に「.com」ドメインのページで<span style="color:#0d3461;font-weight:700;">AI</span>による作成の痕跡が約<span style="color:#b0001e;font-weight:700;">10分の1</span>に見られる一方、「.edu」や「.gov」のような公的機関のサイトではその傾向は少ない。この研究は、<span style="color:#b0001e;font-weight:700;">2021年1月</span>から<span style="color:#b0001e;font-weight:700;">2026年7月</span>までの約<span style="color:#b0001e;font-weight:700;">50万件</span>の英語ウェブページを対象に、<span style="color:#0d3461;font-weight:700;">AI</span>検出ツールを用いてテキストを分析した結果である。AI生成コンテンツの増大は、情報の真偽や倫理的利用に関する新たな課題を提起しており、今後社会全体での議論が活発化すると予想される。企業や個人は、<span style="color:#0d3461;font-weight:700;">AI</span>が生成した情報の透明性を確保し、信頼性を維持するための新たなガイドライン策定が急務となるだろう。インターネットが<span style="color:#0d3461;font-weight:700;">AI</span>によって形作られる新しい時代において、その影響は社会全体に広がる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">企業向けAI</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">クローズドAI</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">エージェント提供開始</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NTTドコモビジネス</span>と<span style="color:#0d3461;font-weight:700;">エクサウィザーズ</span>は、企業の重要データを安全に活用できる「クローズド<span style="color:#0d3461;font-weight:700;">AIエージェント</span>」を共同開発し、<span style="color:#b0001e;font-weight:700;">2026年8月17日</span>より提供開始した。このサービスは、機密データ（設計図面、技術文書、顧客情報など）を安全な専用環境で活用することを目的としている。<span style="color:#0d3461;font-weight:700;">AIエージェント</span>の企業導入が加速する中、セキュリティ上の懸念から外部クラウドサービス利用に慎重な企業も多い。本サービスは、閉域ネットワークと専有<span style="color:#0d3461;font-weight:700;">GPU</span>、<span style="color:#0d3461;font-weight:700;">Kubernetes</span>アーキテクチャを採用し、データの外部持ち出しを防ぎながら安定した処理性能と高いセキュリティを両立する。これにより、企業は<span style="color:#0d3461;font-weight:700;">AI</span>を最大限に活用しつつ、厳格なガバナンスとセキュリティ要件を満たすことが可能となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">LLM最新動向</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">モデル競争</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>末までに、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini 3</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>といった主要<span style="color:#0d3461;font-weight:700;">LLM</span>が出揃い、熾烈な競争が繰り広げられている。顧客体験、運用効率、リスク管理、拡張性など、ビジネスにおける<span style="color:#0d3461;font-weight:700;">LLM</span>選択の重要性が増している。各社は<span style="color:#0d3461;font-weight:700;">AI</span>技術の最前線を走り、それぞれのモデルが持つ独自の強みをアピールしている。企業は自社の特定のユースケースに最適なモデルを見極め、戦略的に導入することが求められる時代だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">AI経済</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AIモデル価格</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">急落、導入加速</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年8月</span>、<span style="color:#0d3461;font-weight:700;">AI</span>モデルの価格が大幅に引き下げられ、特にフロンティアモデルの入力トークン単価が大きく下落した。これにより、企業は<span style="color:#0d3461;font-weight:700;">AI</span>ワークロードをより低コストで実行できるようになり、<span style="color:#0d3461;font-weight:700;">AI</span>導入の障壁がさらに低減される。価格競争は今後も続き、<span style="color:#0d3461;font-weight:700;">AI</span>技術の普及を一層加速させるだろう。このコストメリットは、特に自動化中心のワークフローや顧客サポートシステムを構築する企業にとって朗報となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">モデル進化</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">アリババ、Qwen3.8-Maxを発表</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アリババ</span>が<span style="color:#0d3461;font-weight:700;">Qwen3.8-Max</span>を発表。<span style="color:#b0001e;font-weight:700;">2.4兆</span>パラメータの過去最大のオープンウェイトモデルで、長期間の自律コーディング能力も特筆される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">倫理問題</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">Google DeepMind、AI心理操作を実証</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google DeepMind</span>の研究で、<span style="color:#0d3461;font-weight:700;">LLM</span>が人間を心理的に操作できることが判明。<span style="color:#b0001e;font-weight:700;">10,101人</span>を対象とした大規模調査でその危険性を指摘した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">投資動向</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">Nvidia、AIデータセンターに大規模投資</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Nvidia</span>は<span style="color:#0d3461;font-weight:700;">Cloverleaf Infrastructure</span>に投資し、<span style="color:#0d3461;font-weight:700;">AI</span>データセンターの成長を支援。<span style="color:#0d3461;font-weight:700;">Poolside AI</span>開発ソフトウェアのライセンスに<span style="color:#b0001e;font-weight:700;">60億ドル</span>を支出。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">競争激化</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">Google、Gemini 3.7 Flashをリリース</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>が<span style="color:#0d3461;font-weight:700;">Gemini 3.6</span>からわずか<span style="color:#b0001e;font-weight:700;">3週間</span>で<span style="color:#0d3461;font-weight:700;">Gemini 3.7 Flash</span>をリリース。<span style="color:#0d3461;font-weight:700;">AI</span>モデルの急速なイテレーションが競争をさらに加速させる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">株式市場</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">Anthropic、IPOで市場の注目集める</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>が<span style="color:#0d3461;font-weight:700;">SpaceX</span>の<span style="color:#b0001e;font-weight:700;">IPO</span>に匹敵する、あるいはそれを上回る規模での新規株式公開を目指すと報じられ、市場の注目を集めている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">企業導入</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">サイバーエージェント、AI手当導入</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">サイバーエージェント</span>が月<span style="color:#b0001e;font-weight:700;">3万円</span>の「<span style="color:#0d3461;font-weight:700;">AI</span>手当」を導入し、<span style="color:#0d3461;font-weight:700;">Claude Code</span>や<span style="color:#0d3461;font-weight:700;">Codex</span>の利用が急増。<span style="color:#0d3461;font-weight:700;">AI</span>ツールの企業導入を促進。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">インターネットの未来</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AI生成コンテンツが</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">ネットの過半を占める日</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Pew Research Center</span>が<span style="color:#b0001e;font-weight:700;">2026年8月20日</span>に発表した報告書によると、<span style="color:#b0001e;font-weight:700;">2026年7月</span>時点でインターネット上のコンテンツの<span style="color:#b0001e;font-weight:700;">3分の1以上</span>が<span style="color:#0d3461;font-weight:700;">AI</span>によって生成されていることが明らかになった。これは、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が<span style="color:#b0001e;font-weight:700;">2022年終盤</span>に<span style="color:#0d3461;font-weight:700;">ChatGPT</span>をリリースして以来、<span style="color:#0d3461;font-weight:700;">AI</span>作成コンテンツの割合が急増していることを示している。特に「.com」ドメインのページで<span style="color:#0d3461;font-weight:700;">AI</span>による作成の痕跡が約<span style="color:#b0001e;font-weight:700;">10分の1</span>に見られる一方、「.edu」や「.gov」のような公的機関のサイトではその傾向は少ない。<span style="color:#0d3461;font-weight:700;">Pew Research Center</span>の研究では、<span style="color:#b0001e;font-weight:700;">2021年1月</span>から<span style="color:#b0001e;font-weight:700;">2026年7月</span>までの約<span style="color:#b0001e;font-weight:700;">50万件</span>の英語ウェブページを対象に、<span style="color:#0d3461;font-weight:700;">AI</span>検出ツールを用いてテキストを分析した。この結果は、<span style="color:#0d3461;font-weight:700;">AI</span>がインターネット上の情報環境に与える影響の大きさを浮き彫りにしている。今後、情報の真偽を見極めるリテラシーや、<span style="color:#0d3461;font-weight:700;">AI</span>生成コンテンツの倫理的利用に関する議論がさらに活発化すると予想される。企業や個人は、<span style="color:#0d3461;font-weight:700;">AI</span>が生成した情報の透明性を確保し、信頼性を維持するための新たなガイドライン策定が急務となるだろう。インターネットが<span style="color:#0d3461;font-weight:700;">AI</span>によって形作られる新しい時代において、その影響は社会全体に広がる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">企業データ活用</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">セキュアなAIエージェント</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">ドコモビジネス提供開始</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NTTドコモビジネス</span>と<span style="color:#0d3461;font-weight:700;">エクサウィザーズ</span>が、企業向けの「クローズド<span style="color:#0d3461;font-weight:700;">AIエージェント</span>」の提供を<span style="color:#b0001e;font-weight:700;">2026年8月17日</span>に開始した。この新サービスは、企業の機密データ（設計図面、技術文書、契約情報、顧客情報など）を安全な専用環境で活用することを目的としている。近年、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>は業務の自動化や効率化に不可欠となっているが、重要データの外部クラウドサービス利用にはセキュリティ上の懸念があった。今回の「クローズド<span style="color:#0d3461;font-weight:700;">AIエージェント</span>」は、閉域ネットワークと専有<span style="color:#0d3461;font-weight:700;">GPU</span>、<span style="color:#0d3461;font-weight:700;">Kubernetes</span>アーキテクチャを採用することで、データの外部持ち出しを防ぎつつ、安定した処理性能と高いセキュリティを両立する。これにより、企業は<span style="color:#0d3461;font-weight:700;">AI</span>を最大限に活用しながら、厳格なガバナンスとセキュリティ要件を満たすことが可能となる。<span style="color:#0d3461;font-weight:700;">NTTドコモビジネス</span>がプライベートクラウド版およびオンプレミス版で提供するため、多様な企業のニーズに対応できる点も強みだ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">LLMの最前線</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">進化するAIモデル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">企業戦略に不可欠</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>は、<span style="color:#0d3461;font-weight:700;">GPT</span>、<span style="color:#0d3461;font-weight:700;">Gemini</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>といった主要<span style="color:#0d3461;font-weight:700;">LLM</span>プロバイダーが、その能力と応用範囲を拡大するために熾烈な競争を繰り広げた年として記憶されるだろう。<span style="color:#0d3461;font-weight:700;">OpenAI</span>は多用途な<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>を、<span style="color:#0d3461;font-weight:700;">Google</span>はわずか<span style="color:#b0001e;font-weight:700;">3週間</span>で<span style="color:#0d3461;font-weight:700;">Gemini 3.7 Flash</span>を投入し、急速なイテレーションを見せた。<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>もその推論能力で高い評価を得ている。<span style="color:#b0001e;font-weight:700;">2026年8月</span>には、<span style="color:#0d3461;font-weight:700;">Alibaba</span>が<span style="color:#b0001e;font-weight:700;">2.4兆</span>パラメータのオープンウェイトモデル<span style="color:#0d3461;font-weight:700;">Qwen3.8-Max</span>をリリースするなど、新たなプレイヤーも存在感を示している。これらのモデルは、コーディング、<span style="color:#0d3461;font-weight:700;">Google Workspace</span>連携、文章生成、ビデオ生成、リアルタイムトレンド分析など、幅広いユースケースでその真価を発揮している。企業は、顧客体験の向上、運用効率の最適化、リスクとコンプライアンスへの対応、そしてスケーラビリティを考慮し、最適な<span style="color:#0d3461;font-weight:700;">LLM</span>を選択することが戦略的な課題となっている。</p></div></foreignObject>
