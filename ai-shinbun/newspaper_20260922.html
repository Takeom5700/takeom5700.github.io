<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">米中AI対話、緊張と協力の狭間</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">「超知性」へ暴走加速か</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">米が中国に事故通知提案</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">米国</span>は<span style="color:#b0001e;font-weight:700;">9月20日</span>の<span style="color:#0d3461;font-weight:700;">米中協議</span>で、国家安全保障に関わる<span style="color:#0d3461;font-weight:700;">AI</span>事故の相互通知制度を<span style="color:#0d3461;font-weight:700;">中国</span>に提案した。これは政府間の<span style="color:#0d3461;font-weight:700;">AI対話</span>が具体的な運用段階へ進む動きだ。一方、<span style="color:#0d3461;font-weight:700;">トランプ大統領</span>は<span style="color:#0d3461;font-weight:700;">AI</span>の安全性に関する警告を「デマ」と一蹴し、「超知性（<span style="color:#0d3461;font-weight:700;">Super Intelligence</span>）」への全面的な推進を宣言した。規制による足かせを排除し、<span style="color:#0d3461;font-weight:700;">中国</span>をはじめとする競合国に対する<span style="color:#0d3461;font-weight:700;">米国</span>の優位性を確保する姿勢を鮮明にしている。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">事故時の直通回線も</p><p style="text-indent:1em;margin:0 0 2px;">しかし、同時に<span style="color:#0d3461;font-weight:700;">AI</span>警告論が万一正しかった場合に備え、<span style="color:#0d3461;font-weight:700;">北京</span>との直通回線開設も検討している。この二律背反の戦略は、国際社会における<span style="color:#0d3461;font-weight:700;">AI</span>開発競争の激しさと、それに伴う潜在的リスクへの複雑な認識を浮き彫りにしている。今後、<span style="color:#0d3461;font-weight:700;">深圳</span>での協議で通知対象や窓口が具体化するかが注目される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">LLM競争激化</text>

<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の<span style="color:#0d3461;font-weight:700;">LLM</span>市場では、<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>の<span style="color:#b0001e;font-weight:700;">3</span>強が覇権を競っている。<span style="color:#0d3461;font-weight:700;">GPT-4o</span>はエコシステムの広さで先行し、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>は安全性と推論能力で優位を保つ。一方、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万</span>トークンのコンテキストウィンドウとマルチモーダルタスクで強みを発揮し、特に低遅延性でリードしている。企業向けユースケースでは、アラビア語の流暢さやコスト構造も重要な選択基準となっており、各モデルの特性に応じた戦略的選択が求められている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">米加州、AI規制強化</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">事故報告要件も拡大へ</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">カリフォルニア州</span>は<span style="color:#b0001e;font-weight:700;">9月18日</span>に<span style="color:#0d3461;font-weight:700;">ニューサム知事</span>が署名した大統領令<span style="color:#0d3461;font-weight:700;">N-9-26</span>により、<span style="color:#0d3461;font-weight:700;">AI</span>規制に関する提言開発に着手した。この命令は、「<span style="color:#0d3461;font-weight:700;">AI</span>キルスイッチ」の導入要件の検討、事故報告要件の拡大、独立検証機関の定義を州機関に義務付けている。直接的な「キルスイッチ」設置を命じるものではないが、<span style="color:#b0001e;font-weight:700;">11月16日</span>までに勧告を策定する期限を設定し、将来的な厳格な規制への布石を打った形だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">ドコモ、GPUaaS開始</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">データ主権AI支援</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NTTドコモビジネス</span>は<span style="color:#b0001e;font-weight:700;">9月30日</span>より、<span style="color:#b0001e;font-weight:700;">1GPU</span>から利用可能な<span style="color:#0d3461;font-weight:700;">AI</span>開発基盤「<span style="color:#0d3461;font-weight:700;">GPUaaS</span>」の提供を開始する。このサービスは、<span style="color:#0d3461;font-weight:700;">GPU</span>割り当ての可視化、開発環境の提供、学習ジョブの管理を<span style="color:#0d3461;font-weight:700;">Web</span>ブラウザ上で行える。機密データ活用企業向けに、データガバナンスとデータ主権に配慮した「ソブリン<span style="color:#0d3461;font-weight:700;">AI</span>」の実現を支援する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">成長市場</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">AIチップ市場拡大</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">世界の<span style="color:#0d3461;font-weight:700;">AI</span>アクセラレータチップ市場は、<span style="color:#b0001e;font-weight:700;">2025年</span>から<span style="color:#b0001e;font-weight:700;">2032年</span>にかけて大きく成長すると予測されており、市場規模は大幅に拡大する見込みだ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">物理空間へ</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">「フィジカルAI」台頭</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">物理空間で自律作業を行う「フィジカル<span style="color:#0d3461;font-weight:700;">AI</span>」が注目を集める。<span style="color:#0d3461;font-weight:700;">リコー</span>の<span style="color:#0d3461;font-weight:700;">LAM</span>などが人手不足解消へ期待される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">大学の取り組み</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">UBがAI研究で高評価</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ニューヨーク州立大学バッファロー校</span>（<span style="color:#0d3461;font-weight:700;">UB</span>）が<span style="color:#0d3461;font-weight:700;">AI</span>対応大学ランキングで全米<span style="color:#b0001e;font-weight:700;">22位</span>にランクインした。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">経済影響</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">地方都市もAI活用</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">米</span><span style="color:#0d3461;font-weight:700;">ベンド市</span>の<span style="color:#b0001e;font-weight:700;">20</span>年成長計画で<span style="color:#0d3461;font-weight:700;">AI</span>が雇用に与える影響が分析され、一部報告書は<span style="color:#0d3461;font-weight:700;">AI</span>が執筆した可能性も指摘された。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">企業動向</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">OpenAI、2026年IPO見送り</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">サム・アルトマンCEO</span>は、安全性への義務を理由に<span style="color:#b0001e;font-weight:700;">2026年</span>の<span style="color:#0d3461;font-weight:700;">IPO</span>を見送る意向を表明した。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">米中対話、進展と課題</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">大統領の強硬姿勢</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年9月20日</span>の<span style="color:#0d3461;font-weight:700;">米中協議</span>では、国家安全保障レベルの<span style="color:#0d3461;font-weight:700;">AI</span>事故に関する通知制度の提案という具体的な進展が見られた。これは、<span style="color:#0d3461;font-weight:700;">AI</span>の潜在的リスクに対する国際協調の必要性を認める動きと評価できる。しかし、<span style="color:#0d3461;font-weight:700;">中国側</span>の公表文には通知制度への言及がなく、実効性には運用上の課題が残る。一方、<span style="color:#0d3461;font-weight:700;">トランプ大統領</span>は「超知性」推進を掲げ、<span style="color:#0d3461;font-weight:700;">AI</span>リスク警告を「デマ」と断じている。これは<span style="color:#0d3461;font-weight:700;">米国</span>の<span style="color:#0d3461;font-weight:700;">AI</span>覇権確立を最優先する姿勢の表れであり、規制を排除し<span style="color:#0d3461;font-weight:700;">中国</span>などとの競争で優位に立つことを目指す。しかし同時に、万一<span style="color:#0d3461;font-weight:700;">AI</span>が暴走した場合に備え、<span style="color:#0d3461;font-weight:700;">北京</span>との直通回線検討も示唆しており、その複雑な戦略が国際社会の注目を集めている。<span style="color:#0d3461;font-weight:700;">カリフォルニア州</span>では「キルスイッチ」要件検討を開始するなど、国内でも規制の動きが活発化している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">テクノロジーと産業の変革</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">LLM進化と「フィジカルAI」</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">GPU基盤が普及加速</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の<span style="color:#0d3461;font-weight:700;">AI</span>テクノロジーは、大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）の進化と「フィジカル<span style="color:#0d3461;font-weight:700;">AI</span>」の台頭が特徴的だ。<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>といった主要<span style="color:#0d3461;font-weight:700;">LLM</span>は、それぞれエコシステム、安全性、マルチモーダル能力で差別化を図り、企業ユースケースに応じた選択が求められている。特に<span style="color:#0d3461;font-weight:700;">Gemini 3 Pro</span>は低遅延性とネイティブマルチモーダル対応で注目を集める。一方、「フィジカル<span style="color:#0d3461;font-weight:700;">AI</span>」は、製造・建設現場の人手不足解消の切り札として期待され、<span style="color:#0d3461;font-weight:700;">リコー</span>の<span style="color:#0d3461;font-weight:700;">Latent Action Model</span>（<span style="color:#0d3461;font-weight:700;">LAM</span>）のように、ロボットの身体構造に依存しない汎用的な行動学習が可能になる技術が登場している。また、<span style="color:#0d3461;font-weight:700;">NTTドコモビジネス</span>が<span style="color:#b0001e;font-weight:700;">9月30日</span>に提供開始する「<span style="color:#0d3461;font-weight:700;">GPUaaS</span>」のような<span style="color:#0d3461;font-weight:700;">AI</span>開発基盤は、中小企業の<span style="color:#0d3461;font-weight:700;">AI</span>活用を加速させ、データ主権に配慮した「ソブリン<span style="color:#0d3461;font-weight:700;">AI</span>」の実現を支援する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AIが描く社会と経済</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">成長市場と新たな雇用</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">教育と地方の役割</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>の進化は、世界の経済と社会構造に広範な影響を与えている。<span style="color:#0d3461;font-weight:700;">AI</span>アクセラレータチップ市場は<span style="color:#b0001e;font-weight:700;">2025年</span>から<span style="color:#b0001e;font-weight:700;">2032年</span>にかけて大きな成長が見込まれており、半導体産業に新たな活況をもたらしている。同時に、<span style="color:#0d3461;font-weight:700;">AI</span>が雇用に与える影響は多角的で、一部の仕事が自動化される一方で、新たな職種や「<span style="color:#0d3461;font-weight:700;">AI</span>と協働する」仕事が生まれると予測されている。<span style="color:#0d3461;font-weight:700;">米</span><span style="color:#0d3461;font-weight:700;">オレゴン州ベンド市</span>の<span style="color:#b0001e;font-weight:700;">20</span>年成長計画に関する報告書では、<span style="color:#0d3461;font-weight:700;">AI</span>が<span style="color:#b0001e;font-weight:700;">59%</span>の文章を生成したと分析されるなど、地方行政における<span style="color:#0d3461;font-weight:700;">AI</span>活用の実態が垣間見える。教育機関もこの変化に対応。<span style="color:#0d3461;font-weight:700;">ニューヨーク州立大学バッファロー校</span>（<span style="color:#0d3461;font-weight:700;">UB</span>）は、<span style="color:#b0001e;font-weight:700;">AIREDEX</span>の<span style="color:#0d3461;font-weight:700;">AI</span>対応大学ランキングで<span style="color:#b0001e;font-weight:700;">22位</span>に入り、<span style="color:#b0001e;font-weight:700;">5億ドル</span>規模の州全体の<span style="color:#0d3461;font-weight:700;">AI</span>コンソーシアム「<span style="color:#0d3461;font-weight:700;">Empire AI</span>」の中核を担うなど、次世代の<span style="color:#0d3461;font-weight:700;">AI</span>人材育成に注力している。</p></div></foreignObject>
