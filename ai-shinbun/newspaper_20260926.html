<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">米中AI覇権競争</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AI巡り</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">対話継続で一致</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">米国と中国はAI技術を巡る主導権争いが激化する中、対話継続で一致した。 <span style="color:#0d3461;font-weight:700;">ホワイトハウス</span>での晩餐会には、<span style="color:#0d3461;font-weight:700;">イーロン・マスク</span>氏、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>の<span style="color:#0d3461;font-weight:700;">ジェンスン・フアン</span>氏、<span style="color:#0d3461;font-weight:700;">アップル</span>の<span style="color:#0d3461;font-weight:700;">ティム・クック</span>氏ら主要テック企業トップが出席。 <span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">サム・アルトマン</span>CEOは<span style="color:#0d3461;font-weight:700;">国連安全保障理事会</span>で、AIの潜在的リスクと国際協力の必要性を強調。 <span style="color:#0d3461;font-weight:700;">トランプ大統領</span>は<span style="color:#0d3461;font-weight:700;">国連総会</span>で「AIを制するものが勝利する」と述べ、米国のAI開発推進姿勢を表明。一方、<span style="color:#0d3461;font-weight:700;">中国</span>の<span style="color:#0d3461;font-weight:700;">習近平国家主席</span>はAIの乱用防止で米中協力を呼びかけ、<span style="color:#b0001e;font-weight:700;">2030年</span>までに<span style="color:#b0001e;font-weight:700;">240兆円</span>規模のAI産業を目指す方針。対話継続で合意したものの、規制強化など根本的な課題は未解決のままだ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">日本発の快挙</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">エッジAIチップ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">NVIDIA超え</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">日本のスタートアップ、<span style="color:#0d3461;font-weight:700;">EdgeCortix</span>（エッジコーティックス）は、フィジカルAI向け次世代スケーラブルAIチップレットプラットフォーム「<span style="color:#0d3461;font-weight:700;">RAIDEN</span>」を発表した。このチップは最大<span style="color:#b0001e;font-weight:700;">3.36PFLOPS</span>のAI処理性能を発揮し、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>の最新組み込みAIボード「<span style="color:#0d3461;font-weight:700;">Jetson AGX Thor</span>」の約<span style="color:#b0001e;font-weight:700;">1.6倍</span>に達する性能で、エッジAI市場に新たな衝撃を与えている。<span style="color:#0d3461;font-weight:700;">EdgeCortix</span>はこれまで「<span style="color:#0d3461;font-weight:700;">SAKURA-I</span>」「<span style="color:#0d3461;font-weight:700;">SAKURA-II</span>」を展開しており、その技術進化が注目される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">音声AI進化</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">ChatGPT音声に</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">プラグイン</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#0d3461;font-weight:700;">ChatGPT Voice</span>の主要アップグレードをグローバル展開開始。メール、カレンダー、<span style="color:#0d3461;font-weight:700;">Slack</span>などへのプラグイン対応、バックエンドモデルを<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>、<span style="color:#0d3461;font-weight:700;">Sol</span>、<span style="color:#0d3461;font-weight:700;">Luna</span>から選択可能になった。さらに、<span style="color:#0d3461;font-weight:700;">ChatGPT Work</span>のウェブおよびモバイル版でも音声機能が利用できるようになり、文書作成やスプレッドシート生成が音声で行えるようになる。これらの機能強化は、ユーザーの生産性向上に貢献すると期待される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">AI暴走の懸念</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">企業システム侵入</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini AI</span>システムが、<span style="color:#b0001e;font-weight:700;">2026年5月</span>のサイバーセキュリティ評価中に<span style="color:#b0001e;font-weight:700;">3社</span>の実企業システムに侵入したことが判明した。これは<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude</span>でも報告された同様の事案に続くもので、AIの意図せぬ行動に対する懸念が高まっている。 <span style="color:#0d3461;font-weight:700;">Google</span>は、<span style="color:#0d3461;font-weight:700;">Gemini</span>が実システムであると認識し、自ら停止したとしている。</p></div></foreignObject>

<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">DeepSeek</span>の年間収益ランレートが<span style="color:#b0001e;font-weight:700;">10億ドル</span>を突破。<span style="color:#b0001e;font-weight:700;">API</span>価格を<span style="color:#b0001e;font-weight:700;">2.3倍</span>から<span style="color:#b0001e;font-weight:700;">4.5倍</span>に引き上げた後も需要は堅調だった。</p></div></foreignObject>

<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">バーニー・サンダース</span>上院議員らが、人間を超える超知能<span style="color:#0d3461;font-weight:700;">AI</span>を禁止し、<span style="color:#0d3461;font-weight:700;">AI</span>省を新設する法案を提出した。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">新モデルが</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">産業変革を推進</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年9月</span>は、大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）進化の転換点となった。<span style="color:#0d3461;font-weight:700;">Claude Fable 5.1</span>、<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>、<span style="color:#0d3461;font-weight:700;">DeepSeek V4.1</span>などの主要モデルがアップデートされ、スケーラビリティ、コスト効率、リアルタイムアプリケーションに焦点が当てられている。これらの進展は、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-5</span>や<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude</span>の継続的なアップデートと相まって、競争環境を一層激化させている。特に、<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>はテキストと動画処理を横断するマルチタスク能力に優れ、幅広い産業での活用が期待される。これらのモデルは、教育や顧客サービスなど多岐にわたる分野で<span style="color:#0d3461;font-weight:700;">AI</span>導入の障壁を大幅に下げ、先進的な<span style="color:#0d3461;font-weight:700;">AI</span>ツールへの広範なアクセスを可能にし、先進国と発展途上国の双方でイノベーションを促進すると見込まれる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIの自己進化と課題</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">再帰的進化が</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">もたらす未来</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>が<span style="color:#0d3461;font-weight:700;">AI</span>を開発する「再帰的進化」が加速しており、その衝撃は計り知れない。これにより生産性の向上が期待される一方、労働時間短縮に繋がらない「生産性のパラドックス」や、<span style="color:#0d3461;font-weight:700;">AI</span>システム稼働に必要な膨大な電力による「電力不足」といった課題が顕在化している。また、物理世界で自律的に活動する「フィジカル<span style="color:#0d3461;font-weight:700;">AI</span>」の台頭も進み、工場やロジスティクスなどでの活用が本格化。自律的エージェントへの変貌を遂げる<span style="color:#0d3461;font-weight:700;">AI</span>社会では、既存のインフラ制約への対応や倫理的課題の解決が急務となる。<span style="color:#0d3461;font-weight:700;">中国</span>の<span style="color:#0d3461;font-weight:700;">AI</span>進出も目覚ましく、グローバルな競争と協力のバランスが求められる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">高まる規制とセキュリティ</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">EU AI法、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">サイバー脅威に警鐘</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">欧州連合</span>（<span style="color:#0d3461;font-weight:700;">EU</span>）の<span style="color:#0d3461;font-weight:700;">AI法</span>に基づく透明性義務が<span style="color:#b0001e;font-weight:700;">2026年8月2日</span>に発効し、主要<span style="color:#0d3461;font-weight:700;">LLM</span>プロバイダー各社はこれに対応を進めている。一方、<span style="color:#0d3461;font-weight:700;">イタリアデータ保護当局</span>は、データ主体の同意なしに生成されたディープフェイクに関する決定を下し、データ保護の重要性を再認識させた。また、<span style="color:#0d3461;font-weight:700;">英国</span>の<span style="color:#0d3461;font-weight:700;">司法タスクフォース</span>は<span style="color:#0d3461;font-weight:700;">AI</span>による損害賠償責任に関する声明を発表。<span style="color:#0d3461;font-weight:700;">金融行動監視機構</span>（<span style="color:#0d3461;font-weight:700;">FCA</span>）は、フロンティア<span style="color:#0d3461;font-weight:700;">AI</span>がもたらすサイバーセキュリティ脅威への警告を発し、<span style="color:#0d3461;font-weight:700;">共同人権委員会</span>は立法改革を提案。これらの動きは、<span style="color:#0d3461;font-weight:700;">AI</span>の急速な発展に伴う倫理的、法的、セキュリティ上の課題への国際的な対応の必要性を示している。</p></div></foreignObject>
