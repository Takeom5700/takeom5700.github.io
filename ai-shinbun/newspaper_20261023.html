<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AIガバナンス</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AIの「自己監視」時代終焉か</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">米政府が即時報告義務化</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">サイバーセキュリティ専門家がAIを活用したシステム脆弱性特定を促す中、AIの悪用が懸念されている。中国語AIエージェント「<span style="color:#0d3461;font-weight:700;">Artex</span>」が<span style="color:#0d3461;font-weight:700;">日本企業</span>へのサイバー攻撃に悪用された可能性が指摘された。これを受け、<span style="color:#0d3461;font-weight:700;">米ホワイトハウス</span>は<span style="color:#0d3461;font-weight:700;">AI企業</span>に対し、重大なAIインシデントの「即時報告」を義務付ける新たな指令を発表した。これは、これまでの自主的な枠組みから、法的拘束力のある要件への大きな転換を意味する。政府はAIシステムの安全性と透明性確保において、企業に直接的な責任を負わせる方針を明確にした。この動きは、AIの急速な進化と社会への浸透に伴うリスク増大への対応策として注目される。<span style="color:#0d3461;font-weight:700;">GMOサイバーセキュリティ by イエラエ</span>の調査によると、<span style="color:#0d3461;font-weight:700;">Artex</span>は<span style="color:#b0001e;font-weight:700;">9月</span>から<span style="color:#b0001e;font-weight:700;">10月</span>にかけて、<span style="color:#0d3461;font-weight:700;">日本企業</span>を標的とした攻撃に利用された可能性があるという。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">AI開発の責任明確化</p><p style="text-indent:1em;margin:0 0 2px;">米政府の新たな方針は、AIのガバナンスにおける転換点となるだろう。今後、AIの設計、開発、運用において、企業はより厳格な基準と透明性を求められることになる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">主要LLM比較2026</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">GPT-4o、Claude 3.5、Gemini</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">各モデルの強み鮮明に</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の主要エンタープライズ<span style="color:#0d3461;font-weight:700;">LLMプラットフォーム</span>の比較では、各モデルの特長が明確になった。<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-4o</span>は<span style="color:#b0001e;font-weight:700;">5億</span>ユーザーを抱えエコシステムで先行。<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>は安全性と推論能力で高評価。一方、<span style="color:#0d3461;font-weight:700;">Google Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万トークン</span>のコンテキストウィンドウでマルチモーダルタスクに強みを見せる。<span style="color:#0d3461;font-weight:700;">OECD</span>の<span style="color:#b0001e;font-weight:700;">2025年AI市場レポート</span>によると、<span style="color:#b0001e;font-weight:700;">100万</span>出力トークンあたりの価格は<span style="color:#b0001e;font-weight:700;">2023年</span>から<span style="color:#b0001e;font-weight:700;">80%</span>以上下落しており、コストは二次的な差別化要因となっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">医療AIロボット</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">NTUHとAdataが開発</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">衛生管理を自動化</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">台湾大学病院</span>（<span style="color:#0d3461;font-weight:700;">NTUH</span>）と<span style="color:#0d3461;font-weight:700;">Adata Technology</span>が、AI操縦型医療用衛生ロボットを共同開発し発表した。このロボットは、手術室や内視鏡室の消毒に既に利用されており、移動プラットフォーム、アルゴリズム視覚認識システム、革新的なロボットアームで構成される。医療機器が散乱した空間をナビゲートし、消毒が必要な物体を認識し、正確な清掃作業を実行できる。コロナ禍での病院衛生管理の効率化と職員の安全確保のため開発された。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">KDDIとBroadcom</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AI社会実装へ提携</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">ネットワーク強化</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">KDDI</span>は<span style="color:#0d3461;font-weight:700;">Broadcom Inc.</span>と、AIの社会実装に向けたネットワークインフラ技術で提携したと発表した。データセンターから家庭まで、AI活用を支える通信基盤の高度化を推進する狙いがある。この提携により、AIが様々な分野で利用されるための安定した高速通信環境の構築が加速される見込みだ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">企業動向</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">Arrive AI、ナスダック市場移管</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">物流AI企業<span style="color:#0d3461;font-weight:700;">Arrive AI</span>が、<span style="color:#b0001e;font-weight:700;">10月23日付</span>で<span style="color:#0d3461;font-weight:700;">ナスダック・キャピタル・マーケット</span>への上場移管が承認された。</p></div></foreignObject>

<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">povo AIにChatGPT 5.5</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">povo AI</span>が<span style="color:#0d3461;font-weight:700;">ChatGPT 5.5</span>シリーズを追加、<span style="color:#0d3461;font-weight:700;">Nano Banana 2</span>による画像生成も<span style="color:#b0001e;font-weight:700;">1日3回</span>まで可能に。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">宇宙開発</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">宇宙AIデータセンター構想</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">JAXA</span>支援の<span style="color:#0d3461;font-weight:700;">SpaceBlast</span>が、手のひらサイズの「宇宙AIデータセンター」実現を目指す。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">半導体技術</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">IEEE、AI半導体「メモリの壁」突破</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">IEEE</span>が次世代チップ設計革命を始動し、AI半導体の物理的限界「メモリの壁」を突破する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">政府動向</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">米政権、AIタスクフォース発足</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">トランプ米大統領</span>が<span style="color:#b0001e;font-weight:700;">10月4日</span>、国家情報長官主導の「<span style="color:#0d3461;font-weight:700;">スーパー・インテリジェンス・タスクフォース</span>」を発足させた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">市場分析</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">LLM価格80%超下落</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OECD</span>の<span style="color:#b0001e;font-weight:700;">2025年AI市場レポート</span>で、<span style="color:#0d3461;font-weight:700;">LLM</span>の<span style="color:#b0001e;font-weight:700;">100万</span>出力トークン価格が<span style="color:#b0001e;font-weight:700;">2023年</span>から<span style="color:#b0001e;font-weight:700;">80%</span>以上下落と発表。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">緊急指令</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">米ホワイトハウス、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">AIインシデント即時報告義務化へ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年10月</span>、<span style="color:#0d3461;font-weight:700;">米ホワイトハウス</span>は、AI企業に対し、重大なAI関連インシデントの「即時報告」を義務付ける新たな指令を発令した。これは、これまでの自主的な安全枠組みから、法的拘束力を持つ非交渉的な要件へと大きく舵を切るものだ。政府は、AIシステムの誤作動や悪用が、金融市場の暴落やインフラ障害など、広範囲にわたる深刻な影響を及ぼす可能性を危惧している。この指令により、AI企業は、内部に高度な自動検知システムを構築し、人間の介入なしに連邦政府へインシデントを直ちに通知する体制を整える必要がある。この動きは、AIの開発と展開における責任の所在を明確にし、AI安全性の確保を最優先事項とする政府の強い意志を示すものとして、業界内外で大きな波紋を呼んでいる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">LLM戦線</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">GPT、Claude、Gemini</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">進化続ける競争</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>、主要な大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）である<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT</span>シリーズ、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude</span>シリーズ、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini</span>シリーズは、それぞれの強みで差別化を図り、激しい競争を繰り広げている。<span style="color:#0d3461;font-weight:700;">GPT-4o</span>は広範なユーザー基盤と多様なアプリケーション連携で優位に立ち、<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>は安全性ベンチマークと長文脈推論タスクで最高スコアを獲得。<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万トークン</span>という最大級のコンテキストウィンドウを活かし、ネイティブなマルチモーダル処理能力でリードする。<span style="color:#b0001e;font-weight:700;">2025年末</span>には<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>、<span style="color:#0d3461;font-weight:700;">Gemini 3</span>、<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>といった新モデルが登場し、性能がさらに向上。企業は、レイテンシ、コスト、ツール連携、コンプライアンス要件などを考慮し、自社のユースケースに最適な<span style="color:#0d3461;font-weight:700;">LLMプラットフォーム</span>を選択する必要がある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">革新的技術</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">宇宙にAIデータセンター</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">JAXA支援、国産ベンチャー始動</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AI需要の拡大と宇宙開発の加速に伴い、「宇宙AIデータセンター」構想が現実味を帯びている。<span style="color:#0d3461;font-weight:700;">JAXA</span>の支援を受ける<span style="color:#0d3461;font-weight:700;">日本の宇宙スタートアップSpaceBlast</span>は、基盤技術「<span style="color:#0d3461;font-weight:700;">TENEDGE</span>」と手のひらサイズのコンピュータ「<span style="color:#0d3461;font-weight:700;">TENEDGE CORE</span>」を開発。衛星上で小型言語モデル（<span style="color:#0d3461;font-weight:700;">SLM</span>）を動かしデータを処理することで、メガバイト級の生データをキロバイト級のメタデータに軽量化し、地上へのデータ転送を効率化する。将来的には「<span style="color:#0d3461;font-weight:700;">TENEDGE SPACE AI CLOUD</span>」として、地上からの指示で宇宙側の<span style="color:#0d3461;font-weight:700;">SLM</span>がデータを加工する仕組みも視野に入れる。放射線環境や南極、高山といった過酷な環境での利用も想定されており、AIを活用した宇宙ビジネスの新境地を開くことが期待される。</p></div></foreignObject>
