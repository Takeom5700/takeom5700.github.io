<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">激化するLLM競争、企業戦略に新局面</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AIプラットフォーム</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">戦国時代</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">2026年、主要LLM市場は激しい競争に突入している。「<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-4o</span>」は強固なユーザー基盤を維持しつつ、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の「<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>」は安全性と長文推論で最高評価を獲得。一方、「<span style="color:#0d3461;font-weight:700;">Google Gemini 1.5 Pro</span>」は<span style="color:#b0001e;font-weight:700;">100万</span>トークンのコンテキストウィンドウとマルチモーダル能力で優位を確立している。企業は最適なプラットフォーム選択に直面し、API連携、ファインチューニング投資、ベンダーロックインのリスクが課題となっている。<span style="color:#0d3461;font-weight:700;">OECD</span>の<span style="color:#b0001e;font-weight:700;">2025</span>年<span style="color:#0d3461;font-weight:700;">AI</span>市場レポートによると、<span style="color:#b0001e;font-weight:700;">100万</span>出力トークンあたりの価格は<span style="color:#b0001e;font-weight:700;">2023</span>年以降<span style="color:#b0001e;font-weight:700;">80%</span>以上下落し、コストは二の次となっている。もはや単一プラットフォーム戦略では不十分であり、各社の強みを理解した上で多様なユースケースに応じた戦略的活用が求められる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">国家安全保障の脅威</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">米AIモデル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">中国が大規模抽出</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">2026年<span style="color:#b0001e;font-weight:700;">9月</span>、<span style="color:#0d3461;font-weight:700;">CISA</span>、<span style="color:#0d3461;font-weight:700;">NSA</span>、<span style="color:#0d3461;font-weight:700;">FBI</span>は、中国を拠点とする<span style="color:#0d3461;font-weight:700;">AI</span>企業が米国の主要<span style="color:#0d3461;font-weight:700;">AI</span>モデルから知的財産を組織的に抽出していると警告した。<span style="color:#0d3461;font-weight:700;">DeepSeek</span>、<span style="color:#0d3461;font-weight:700;">Moonshot AI</span>、<span style="color:#0d3461;font-weight:700;">Alibaba</span>などが、「<span style="color:#0d3461;font-weight:700;">Claude</span>」「<span style="color:#0d3461;font-weight:700;">GPT</span>」「<span style="color:#0d3461;font-weight:700;">Gemini</span>」「<span style="color:#0d3461;font-weight:700;">Grok</span>」などから数十億のトークンを抽出し、自社モデルの学習に利用。これは<span style="color:#b0001e;font-weight:700;">2024</span>年後半から行われており、米国の<span style="color:#0d3461;font-weight:700;">AI</span>企業の利用規約に違反している。専門家は、これらの活動が中国政府の認識のもとで行われている可能性が高いと指摘。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AIが詐欺阻止に貢献</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">米財務省、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">数十億回収</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">米財務省は、<span style="color:#b0001e;font-weight:700;">2024</span>会計年度に機械学習<span style="color:#0d3461;font-weight:700;">AI</span>を活用した不正検出プロセスにより、<span style="color:#b0001e;font-weight:700;">40億</span>ドル超の詐欺および不適正な支払いを防止・回収したと発表した。前年の<span style="color:#b0001e;font-weight:700;">6億5270万</span>ドルから大幅増。機械学習アルゴリズムがリアルタイムで取引パターンを分析し、疑わしい活動を特定することで、迅速な対応が可能に。AIは政府機関の効率と資産保護に不可欠なツールとなっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">エッジAIモデル普及</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">Mistral、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">軽量AI投入</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">2024年、<span style="color:#0d3461;font-weight:700;">Mistral</span>は、ノートPCやスマートフォンなどのエッジデバイス向けに最適化された軽量<span style="color:#0d3461;font-weight:700;">AI</span>モデル「<span style="color:#0d3461;font-weight:700;">Les Ministraux</span>」シリーズを投入し、プライバシー重視の低遅延アプリケーション市場を拡大している。オンデバイス翻訳やローカル分析などで競合を上回る性能を発揮。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">歴史的快挙</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">AI研究者にノーベル賞</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">2024年、<span style="color:#0d3461;font-weight:700;">J.J.ホップフィールド</span>と<span style="color:#0d3461;font-weight:700;">G.E.ヒントン</span>両教授が、人工ニューラルネットワークに関する基礎研究で初の<span style="color:#0d3461;font-weight:700;">ノーベル物理学賞</span>を受賞した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">GPU大手もモデル参入</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">NVIDIA、新AIモデル発表</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NVIDIA</span>が「<span style="color:#0d3461;font-weight:700;">Llama-3.1-Nemotron-70B-Instruct</span>」を発表、<span style="color:#0d3461;font-weight:700;">GPT-4</span>を凌駕する性能で<span style="color:#0d3461;font-weight:700;">AI</span>業界に新風を吹き込む。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">WindowsにAI統合</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">Copilot機能強化へ</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Microsoft</span>は<span style="color:#0d3461;font-weight:700;">Windows 11</span>に「<span style="color:#0d3461;font-weight:700;">Copilot Voice</span>」や「<span style="color:#0d3461;font-weight:700;">Copilot Daily</span>」など<span style="color:#0d3461;font-weight:700;">AI</span>機能を大幅強化すると発表。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">Google生産性向上</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">NotebookLM機能拡充</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">NotebookLM</span>が大幅アップデート。<span style="color:#0d3461;font-weight:700;">AI</span>による情報整理と要約能力がさらに進化し、ユーザーの生産性を高める。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">AI新興企業が躍進</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">Perplexity AI評価額急増</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Perplexity AI</span>が資金調達交渉を進め、企業評価額が<span style="color:#b0001e;font-weight:700;">80億</span>ドルに迫る勢い。市場の関心が高まる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">生成AI時代の新潮流</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">AIOがマーケティング変革</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">消費者が生成<span style="color:#0d3461;font-weight:700;">AI</span>で製品発見を行う中、「<span style="color:#0d3461;font-weight:700;">Generative Engine Optimisation (AIO)</span>」がマーケティングの新たな焦点に。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AIアシスタントの課題</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">ブランド推薦</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">意見不一致</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">2026年<span style="color:#b0001e;font-weight:700;">10月</span><span style="color:#b0001e;font-weight:700;">7日</span>、<span style="color:#0d3461;font-weight:700;">LLM Scout</span>の調査により、主要な対話型<span style="color:#0d3461;font-weight:700;">AI</span>アシスタント（<span style="color:#0d3461;font-weight:700;">ChatGPT</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>、<span style="color:#0d3461;font-weight:700;">Gemini</span>、<span style="color:#0d3461;font-weight:700;">Perplexity</span>）が同じ商業的評価プロンプトに対してブランド推奨で頻繁に意見が食い違うことが判明した。<span style="color:#b0001e;font-weight:700;">749</span>件の同一製品選択クエリを評価した結果、<span style="color:#b0001e;font-weight:700;">27.2%</span>のケースでプラットフォーム間が不一致を示したという。この乖離は、デジタルマーケターや企業の広報チームに複雑な課題をもたらしている。従来の検索エンジンとは異なり、生成モデルは複雑な合成、文脈の重み付け、そして異なる基盤アーキテクチャに依存するため、各アシスタントがどのようにクエリを処理し、エンティティ参照を表面化させるかを細かく理解する必要がある。単一プラットフォームに最適化する戦略では不十分であることがデータによって強調されており、複数モデルにわたる戦略的アプローチが不可欠となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIスキル、全産業に波及</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">雇用市場を</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">変革するAI</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Burning Glass Institute</span>が<span style="color:#b0001e;font-weight:700;">2024</span>年<span style="color:#b0001e;font-weight:700;">10月</span>に発表した「<span style="color:#0d3461;font-weight:700;">AI's Expanding Reach</span>」レポートは、生成<span style="color:#0d3461;font-weight:700;">AI</span>が従来のテクノロジーハブを超えて米国経済全体に浸透し、メディア、マーケティング、デザインなどの多様な産業の雇用市場を再形成していることを明らかにした。求人情報と履歴書データを分析することで、地域や産業における<span style="color:#0d3461;font-weight:700;">AI</span>スキルの需要と供給が詳細に示されている。この傾向は<span style="color:#b0001e;font-weight:700;">2026</span>年も継続しており、<span style="color:#0d3461;font-weight:700;">AI</span>の変革的潜在能力がキャリアパスと経済機会に広範囲に影響を与えている。企業は<span style="color:#0d3461;font-weight:700;">AI</span>関連スキルの従業員育成と外部からの獲得を急務としている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">LLM市場、三つ巴の様相</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">主要AIモデル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">シェア争奪戦</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">2026年の<span style="color:#0d3461;font-weight:700;">LLM</span>市場は、ユーザーベース、<span style="color:#0d3461;font-weight:700;">API</span>利用、ウェブトラフィックという異なる指標で各社が異なる強みを示す三つ巴の様相を呈している。<span style="color:#0d3461;font-weight:700;">ChatGPT</span>は<span style="color:#b0001e;font-weight:700;">2026</span>年<span style="color:#b0001e;font-weight:700;">8月</span>時点でウェブサイト訪問数で<span style="color:#b0001e;font-weight:700;">55.5%</span>と最大だが、前年よりは減少。一方、企業向け<span style="color:#0d3461;font-weight:700;">API</span>利用では<span style="color:#0d3461;font-weight:700;">Anthropic</span>が<span style="color:#b0001e;font-weight:700;">40%</span>を占め、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が<span style="color:#b0001e;font-weight:700;">27%</span>、<span style="color:#0d3461;font-weight:700;">Google</span>が<span style="color:#b0001e;font-weight:700;">21%</span>と続く。<span style="color:#0d3461;font-weight:700;">Sensor Tower</span>の<span style="color:#b0001e;font-weight:700;">2026</span>年<span style="color:#b0001e;font-weight:700;">5月</span>の推定では、<span style="color:#0d3461;font-weight:700;">ChatGPT</span>が<span style="color:#b0001e;font-weight:700;">11億</span>人以上、<span style="color:#0d3461;font-weight:700;">Gemini</span>が<span style="color:#b0001e;font-weight:700;">6億6200万</span>人、<span style="color:#0d3461;font-weight:700;">Claude</span>が<span style="color:#b0001e;font-weight:700;">2億4500万</span>人と、ユーザー規模にも大きな違いが見られる。市場は成熟期に入りつつあり、各社の差別化戦略が今後一層重要となる。</p></div></foreignObject>
