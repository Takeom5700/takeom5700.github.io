<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">自律型AIが新段階へ</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AIエージェント</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">コスト減と普及加速</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">生成<span style="color:#0d3461;font-weight:700;">AI</span>の進化は新たな段階に入り、ユーザーの指示を待たずに自律的に行動し、提案する<span style="color:#0d3461;font-weight:700;">AIエージェント</span>が急速に普及しています。<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の「<span style="color:#0d3461;font-weight:700;">コンピューターヒストリー</span>」機能は、ユーザーの作業を分析し自動化を提案。また、<span style="color:#0d3461;font-weight:700;">プログラミングAI</span>の「<span style="color:#0d3461;font-weight:700;">Claude Code</span>」は、危険なコマンドの検出において人間を大幅に上回る<span style="color:#b0001e;font-weight:700;">約89%</span>の成功率を示し、安全性の面で人間の判断を凌駕する結果を出しました。これにより、確認作業などの領域では<span style="color:#0d3461;font-weight:700;">AI</span>に任せる方が安全であるという認識が広がっています。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">コスト大幅削減とオンデバイス化</p><p style="text-indent:1em;margin:0 0 2px;">さらに、<span style="color:#0d3461;font-weight:700;">AIモデル</span>の利用コストが劇的に低下しています。<span style="color:#0d3461;font-weight:700;">OpenAI</span>は「<span style="color:#0d3461;font-weight:700;">GPT-5.6 Luna</span>」の価格を<span style="color:#b0001e;font-weight:700;">80%</span>削減し、<span style="color:#b0001e;font-weight:700;">100万トークンあたり$0.20</span>と発表。これに伴い、デスクトップ向け<span style="color:#0d3461;font-weight:700;">AIエージェント</span>である「<span style="color:#0d3461;font-weight:700;">Claude Cowork</span>」（<span style="color:#b0001e;font-weight:700;">月額$20</span>）や「<span style="color:#0d3461;font-weight:700;">Gemini Spark</span>」（<span style="color:#b0001e;font-weight:700;">月額$99.99</span>）も主流になりつつあります。 また、<span style="color:#0d3461;font-weight:700;">Apple</span>の<span style="color:#0d3461;font-weight:700;">A20 Bionic</span>チップや<span style="color:#0d3461;font-weight:700;">Qualcomm Snapdragon 8 Gen 5</span>チップを搭載したスマートフォンでは、<span style="color:#b0001e;font-weight:700;">700億</span>パラメータの<span style="color:#0d3461;font-weight:700;">AIモデル</span>がクラウド接続なしで完全にオンデバイスで動作可能になり、プライバシー重視のユースケースで大きな変革を促しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">AIインフラ過熱投資</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">大手クラウド</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">財務を圧迫</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">人工知能インフラへの巨額投資が、大手クラウド企業の財務を圧迫しています。<span style="color:#0d3461;font-weight:700;">Oracle</span>は<span style="color:#b0001e;font-weight:700;">2026</span>年度の設備投資が<span style="color:#b0001e;font-weight:700;">556億6千万ドル</span>に達し、フリーキャッシュフローは<span style="color:#b0001e;font-weight:700;">マイナス236億9千万ドル</span>を記録。 <span style="color:#0d3461;font-weight:700;">Amazon</span>も<span style="color:#b0001e;font-weight:700;">2026年</span>上半期の設備投資が<span style="color:#b0001e;font-weight:700;">984億ドル</span>となり、フリーキャッシュフローは<span style="color:#b0001e;font-weight:700;">マイナス270億ドル</span>となりました。 <span style="color:#0d3461;font-weight:700;">Microsoft</span>と<span style="color:#0d3461;font-weight:700;">Alphabet</span>は依然としてプラスのフリーキャッシュフローを維持しているものの、<span style="color:#0d3461;font-weight:700;">AIデータセンター</span>構築競争の激化が、各社の収益性に大きな影を落としています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">企業向けソリューション</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">ドコモビジネス</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">閉域AI提供開始</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NTTドコモビジネス</span>と<span style="color:#0d3461;font-weight:700;">エクサウィザーズ</span>は、企業の重要データを安全に活用できる「<span style="color:#0d3461;font-weight:700;">クローズドAIエージェント</span>」を共同開発し、<span style="color:#b0001e;font-weight:700;">2026年8月17日</span>より提供を開始しました。 このサービスは、顧客情報などの機微なデータを外部に持ち出すことなく、閉域ネットワーク経由で<span style="color:#0d3461;font-weight:700;">AIエージェント</span>を利用できるセキュアな実行環境を提供します。 これにより、セキュリティリスクやガバナンス上の懸念から<span style="color:#0d3461;font-weight:700;">AI</span>活用に慎重だった企業も、安心して<span style="color:#0d3461;font-weight:700;">AI</span>を業務に組み込めるようになります。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">コンテンツ産業の透明性</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">アップル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">AI生成曲にラベル</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Apple Music</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>で生成されたコンテンツに対し「<span style="color:#0d3461;font-weight:700;">Made With AI</span>」のラベル表示を開始すると発表しました。 これは音楽業界パートナーに送られたメールで明らかにされ、「実質的に<span style="color:#0d3461;font-weight:700;">AI</span>を用いて生成された」コンテンツには、すべての<span style="color:#0d3461;font-weight:700;">Apple Music</span>ユーザーに表示されるラベルが適用されます。 この取り組みは、<span style="color:#0d3461;font-weight:700;">AI</span>生成コンテンツの透明性を確保し、クリエイターと消費者の双方に公平な環境を提供することを目的としています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">AIの安全性</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">クロード、人凌ぐ</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">プログラミングAI</span>「<span style="color:#0d3461;font-weight:700;">Claude Code</span>」が危険なコマンドを<span style="color:#b0001e;font-weight:700;">89%</span>の確率で停止。人間は<span style="color:#b0001e;font-weight:700;">13%</span>と、<span style="color:#0d3461;font-weight:700;">AI</span>が安全確認で人間を大幅に上回る結果を示した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">価格競争激化</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">GPT価格80%減</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>が「<span style="color:#0d3461;font-weight:700;">GPT-5.6 Luna</span>」の価格を<span style="color:#b0001e;font-weight:700;">80%</span>削減し、<span style="color:#b0001e;font-weight:700;">100万トークンあたり$0.20</span>に。 <span style="color:#0d3461;font-weight:700;">Gemini 3.6 Flash</span>も出力コストを<span style="color:#b0001e;font-weight:700;">17%</span>削減し、競争が激化している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">オンデバイスAI</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">スマホで70Bモデル</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Apple</span> <span style="color:#0d3461;font-weight:700;">A20 Bionic</span>や<span style="color:#0d3461;font-weight:700;">Snapdragon 8 Gen 5</span>搭載のスマホで、<span style="color:#b0001e;font-weight:700;">700億</span>パラメータ<span style="color:#0d3461;font-weight:700;">AIモデル</span>がオンデバイス実行可能に。 プライバシー重視の利用が進む。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">労働市場の行方</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">ラスベガスでAI議論</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ラスベガス</span>で<span style="color:#0d3461;font-weight:700;">AI</span>と自動化の脅威を巡り、<span style="color:#0d3461;font-weight:700;">チームスターズ</span>や<span style="color:#0d3461;font-weight:700;">料理人組合</span>などが労働者中心の利益分配を求める議論を行った。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">中国AIの躍進</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">MiniMax低コスト高性能</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">中国AI</span>企業の<span style="color:#0d3461;font-weight:700;">MiniMax</span>が、既存の最先端モデルに匹敵する性能を低コストで提供する「<span style="color:#0d3461;font-weight:700;">M2.5</span>」を発表。 企業向け市場で存在感を示している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">統合と活用</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">MSコパイロット統合</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Microsoft</span>は<span style="color:#b0001e;font-weight:700;">2つ</span>の<span style="color:#0d3461;font-weight:700;">Copilot</span>を統合し、ユーザーが<span style="color:#0d3461;font-weight:700;">AI</span>を迷わず使いこなせるガイドを発表。 企業内での<span style="color:#0d3461;font-weight:700;">AI</span>活用を支援する姿勢を強化。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">LLM競争の最前線</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">GPT、Claude、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">Gemini三つ巴</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）の開発競争は激化の一途を辿り、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>が三つ巴の様相を呈しています。 各モデルには明確な強みがあり、<span style="color:#0d3461;font-weight:700;">GPT-4o</span>は幅広いエコシステムと汎用性でリードし、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>は安全性と推論能力、長文コンテキスト処理に優れ、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万トークン</span>のコンテキストウィンドウを持つマルチモーダルタスクで強みを発揮しています。 特に、企業が<span style="color:#0d3461;font-weight:700;">LLM</span>を選定する際には、抽象的なベンチマークよりも、特定のワークフローにおける失敗パターンやレイテンシ、コストが重視される傾向にあります。 <span style="color:#0d3461;font-weight:700;">Microsoft</span>は<span style="color:#0d3461;font-weight:700;">Copilot</span>に<span style="color:#0d3461;font-weight:700;">GPT-4o</span>を組み込みエコシステムの安定性を図り、<span style="color:#0d3461;font-weight:700;">Amazon Bedrock</span>は法律・金融分野で<span style="color:#0d3461;font-weight:700;">Claude</span>の長文コンテキスト処理能力を評価。 <span style="color:#0d3461;font-weight:700;">Google Workspace</span>は<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>をメールやドキュメント、ビデオ間の連携に活用するなど、各社が自社の戦略に合わせて最適なモデルを採用しています。 <span style="color:#0d3461;font-weight:700;">2026年</span>における<span style="color:#0d3461;font-weight:700;">LLM</span>の選択は、完璧さではなく、予測可能性と信頼性に基づいて行われています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIガバナンスの強化</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">EU AI法</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">世界的に規制強化</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年8月</span>、<span style="color:#0d3461;font-weight:700;">AI</span>モデルのリリースにおける規制が世界的に強化されています。<span style="color:#0d3461;font-weight:700;">EU AI Act</span>の全面的な施行が開始され、<span style="color:#0d3461;font-weight:700;">米国</span>政府もフロンティア<span style="color:#0d3461;font-weight:700;">モデル</span>に対する審査ゲートを導入。 これは、より安定した<span style="color:#0d3461;font-weight:700;">AIインフラ</span>の構築を目指す動きの一環であり、<span style="color:#0d3461;font-weight:700;">AI</span>開発企業に対し、安全性と透明性へのより厳格な対応を求めています。 また、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は<span style="color:#0d3461;font-weight:700;">Claude</span>の生成テキストにモデルレベルで透かしを組み込む技術を開発しており、<span style="color:#0d3461;font-weight:700;">AI</span>生成コンテンツの検出を可能にする計画です。 この技術は、<span style="color:#0d3461;font-weight:700;">EU</span>の規制に合致するための重要な取り組みと位置づけられ、<span style="color:#0d3461;font-weight:700;">AI</span>の信頼性確保や著作権保護に大きな影響を与える可能性があります。 コンテンツクリエイターは、<span style="color:#0d3461;font-weight:700;">AI</span>の使用を明確に開示し、独自の人間的な声と視点を構築することで競争力を維持することが求められています。 <span style="color:#0d3461;font-weight:700;">AI</span>技術の急速な進展に伴い、倫理的利用と社会的受容性のバランスを取るためのガバナンス体制の構築が喫緊の課題となっています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">Nvidiaの戦略</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AI推論市場</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">支配へ巨額投資</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Nvidia</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>の進展と<span style="color:#0d3461;font-weight:700;">データセンター</span>の発展に注力し、将来の<span style="color:#0d3461;font-weight:700;">AI</span>推論市場におけるリーダーシップを確立するため、戦略的な投資を加速しています。 同社は<span style="color:#0d3461;font-weight:700;">Cloverleaf Infrastructure</span>への投資を行うとともに、<span style="color:#0d3461;font-weight:700;">Poolside AIモデル</span>開発ソフトウェアのライセンスに<span style="color:#b0001e;font-weight:700;">60億ドル</span>を投じるなど、大規模な資金を投入しています。 これは、<span style="color:#0d3461;font-weight:700;">AI</span>インフラにおいて推論が最大かつ最も重要な層になるという同社の確信に基づいています。 <span style="color:#0d3461;font-weight:700;">Nvidia</span>は<span style="color:#0d3461;font-weight:700;">GPU</span>を基盤とするクラウドプラットフォームを展開し、<span style="color:#0d3461;font-weight:700;">Grok</span>などの競合他社と市場を巡る競争を繰り広げています。 また、<span style="color:#0d3461;font-weight:700;">Nvidia</span>の研究では、<span style="color:#0d3461;font-weight:700;">AIモデル</span>自体の性能だけでなく、その運用を支える「ハーネス」と呼ばれるフレームワークが重要であることも示されており、高品質な推論サービスの提供には総合的な技術力が不可欠であることが浮き彫りになっています。 <span style="color:#0d3461;font-weight:700;">Nvidia</span>は<span style="color:#b0001e;font-weight:700;">2027年</span>までに電力容量を現在の<span style="color:#b0001e;font-weight:700;">54MW</span>から<span style="color:#b0001e;font-weight:700;">200MW</span>超へ拡大する計画で、<span style="color:#0d3461;font-weight:700;">AI</span>開発者や企業向けにサービスを拡充しています。</p></div></foreignObject>
