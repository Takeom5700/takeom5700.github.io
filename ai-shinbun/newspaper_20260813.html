<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">EU法規制、運用本格化へ</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AI透明性義務</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">欧州で全面適用</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">EU AI法</span>、透明性義務が正式適用開始。<span style="color:#0d3461;font-weight:700;">欧州連合（EU）</span>は<span style="color:#b0001e;font-weight:700;">2026年8月</span>、人工知能（<span style="color:#0d3461;font-weight:700;">AI</span>）システムに対する<span style="color:#b0001e;font-weight:700;">透明性義務</span>の本格運用を開始した。これにより、<span style="color:#0d3461;font-weight:700;">AI生成コンテンツ</span>には機械可読なラベル付与が義務付けられ、利用者は<span style="color:#0d3461;font-weight:700;">AI</span>との対話を認識できるようになる。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">高リスクシステムへの影響</p><p style="text-indent:1em;margin:0 0 2px;">特に<span style="color:#0d3461;font-weight:700;">高リスクAIシステム</span>に対する主要な義務の適用期限は<span style="color:#b0001e;font-weight:700;">2027年12月2日</span>まで延長されたものの、<span style="color:#0d3461;font-weight:700;">透明性要件</span>は<span style="color:#b0001e;font-weight:700;">2026年8月</span>から適用されている。これは、<span style="color:#0d3461;font-weight:700;">AI技術</span>の急速な発展に対する<span style="color:#0d3461;font-weight:700;">EU</span>の規制強化姿勢を示すものだ。企業は、特に<span style="color:#b0001e;font-weight:700;">2026年8月2日</span>以降に市場投入された<span style="color:#0d3461;font-weight:700;">生成AIシステム</span>について、ウォーターマーク義務への対応が求められる。また、<span style="color:#0d3461;font-weight:700;">AI</span>の利用が社会に浸透する中で、その倫理的な側面や安全性確保が国際的な課題となっており、<span style="color:#0d3461;font-weight:700;">EU</span>のこの動きは世界中の規制当局に影響を与える可能性がある。専門家は、<span style="color:#0d3461;font-weight:700;">AI</span>の信頼性と説明責任を確立する上で不可欠なステップだと評価しており、企業にはコンプライアンス体制の早期確立が求められている。この新たな規制は、<span style="color:#0d3461;font-weight:700;">AI開発</span>における<span style="color:#0d3461;font-weight:700;">倫理</span>と<span style="color:#0d3461;font-weight:700;">ガバナンス</span>の重要性を一層高めるものとなるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">LLM開発競争が激化</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">OpenAI「Astra」</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">成果と懸念、同時に</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>が次期主力モデル「<span style="color:#0d3461;font-weight:700;">Astra</span>」の社内版が数学・理論計算機科学の未解決問題を<span style="color:#b0001e;font-weight:700;">10件</span>解決したと発表した。わずか<span style="color:#b0001e;font-weight:700;">約2,000ドル</span>の計算コストでの成果は、<span style="color:#0d3461;font-weight:700;">AI</span>の科学的推論能力の飛躍的向上を示すものとして注目を集めている。しかし、「<span style="color:#0d3461;font-weight:700;">Critical</span>」級のサイバー能力の可能性が否定できないため、一部開発を停止したことも報じられた。一方、<span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#b0001e;font-weight:700;">2026年8月6日</span>、最新モデル「<span style="color:#0d3461;font-weight:700;">GPT-5.6 Luna</span>」を無料ユーザーに開放し、テキストチャットの回数制限を撤廃した。これにより、より多くのユーザーが最先端の<span style="color:#0d3461;font-weight:700;">AI</span>を利用できる環境が整った。また、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は最新フロンティアモデル「<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>」をリリースし、<span style="color:#0d3461;font-weight:700;">Google DeepMind</span>も経営・研究開発体制を再編するなど、大手各社は競争激化の中で<span style="color:#0d3461;font-weight:700;">AI開発</span>の新たな局面を迎えている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">計算資源の確保が焦点</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">AIインフラ投資</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">NVIDIAが主導</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>技術の進化に伴い、その基盤となる<span style="color:#0d3461;font-weight:700;">インフラ</span>への投資が加速している。<span style="color:#0d3461;font-weight:700;">NVIDIA</span>は<span style="color:#0d3461;font-weight:700;">BlackRock</span>など金融大手と連携し、<span style="color:#0d3461;font-weight:700;">AI計算基盤</span>への<span style="color:#b0001e;font-weight:700;">5,000億ドル</span>規模の第三者資本を動員する投資枠組みを発表した。<span style="color:#0d3461;font-weight:700;">Anthropic</span>も<span style="color:#0d3461;font-weight:700;">シンガポールGIC</span>と共同で専用データセンターを設立するなど、<span style="color:#0d3461;font-weight:700;">AIインフラ</span>の確保は産業全体のボトルネックと認識されている。<span style="color:#0d3461;font-weight:700;">AI競争</span>の焦点は、モデルの性能だけでなく、電力供給や推論コストといった計算資源の確保へ移りつつある。<span style="color:#0d3461;font-weight:700;">Mistral AI</span>も<span style="color:#0d3461;font-weight:700;">欧州</span>における<span style="color:#0d3461;font-weight:700;">AI</span>主権確立のため、<span style="color:#b0001e;font-weight:700;">2030年</span>までに<span style="color:#b0001e;font-weight:700;">1GW</span>の計算容量構築を計画している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">環境負荷への懸念</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AI、化石燃料</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">増産促進か</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>が気候変動に与える影響に関する研究結果が発表された。この研究は、<span style="color:#0d3461;font-weight:700;">AI</span>による生産性向上が、再生可能エネルギーよりも化石燃料の増産を促進し、年間<span style="color:#b0001e;font-weight:700;">0.47〜1.8ギガトン</span>の炭素排出量増加につながる可能性を指摘している。<span style="color:#0d3461;font-weight:700;">AIデータセンター</span>の建設が急速に進み、その電力消費が主に化石燃料に依存していることが背景にある。<span style="color:#0d3461;font-weight:700;">AI</span>の恩恵と環境負荷のバランスが新たな課題として浮上している。</p></div></foreignObject>

<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google DeepMind</span>が経営・研究体制を大幅に再編。<span style="color:#0d3461;font-weight:700;">AI</span>開発競争激化に対応するため、<span style="color:#0d3461;font-weight:700;">Sundar Pichai</span>氏が発表した。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">Foxconn利益35%増</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Foxconn</span>は<span style="color:#b0001e;font-weight:700;">第2四半期</span>の純利益が<span style="color:#b0001e;font-weight:700;">35%</span>増。データセンター向け<span style="color:#0d3461;font-weight:700;">AIサーバー</span>需要が好調な業績を牽引した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">規制の複雑化</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">米国のAI規制</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">連邦と州の狭間</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">米国では連邦レベルの<span style="color:#0d3461;font-weight:700;">AI</span>法は存在しないものの、<span style="color:#0d3461;font-weight:700;">AI規制</span>の動きが活発化している。<span style="color:#b0001e;font-weight:700;">トランプ大統領</span>は<span style="color:#b0001e;font-weight:700;">2026年6月2日</span>に<span style="color:#0d3461;font-weight:700;">AI</span>イノベーションとセキュリティを推進する大統領令に署名。これは企業に直接的な義務を課すものではないが、連邦政府の<span style="color:#0d3461;font-weight:700;">AI開発サイクル</span>への関与を公式化した。一方、州レベルでは<span style="color:#0d3461;font-weight:700;">カリフォルニア州</span>の「<span style="color:#0d3461;font-weight:700;">Transparency in Frontier AI Act</span>」や「<span style="color:#0d3461;font-weight:700;">AI Training Data Transparency Act</span>」などが<span style="color:#b0001e;font-weight:700;">2026年1月1日</span>から施行されており、フロンティアモデルの開発者や生成<span style="color:#0d3461;font-weight:700;">AIシステム</span>の透明性義務を課している。また、<span style="color:#0d3461;font-weight:700;">コロラド州</span>も<span style="color:#b0001e;font-weight:700;">2027年1月1日</span>発効の<span style="color:#0d3461;font-weight:700;">ADMT</span>法を制定するなど、州ごとの規制のパッチワークが企業にとって複雑なコンプライアンス環境を生み出している。連邦政府は州法の事前抑制を推奨する姿勢を見せているが、これはまだ確定しておらず、企業は複数の規制フレームワークへの対応が求められる状況だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">成長続く巨大市場</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">生成AI市場</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">2026年1610億ドル超</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">生成<span style="color:#0d3461;font-weight:700;">AI市場</span>は急速な成長を続けており、<span style="color:#b0001e;font-weight:700;">2025年</span>の<span style="color:#b0001e;font-weight:700;">1,035.8億ドル</span>から、<span style="color:#b0001e;font-weight:700;">2026年</span>には<span style="color:#b0001e;font-weight:700;">1,610億ドル</span>に達すると予測されている。<span style="color:#b0001e;font-weight:700;">2034年</span>には<span style="color:#b0001e;font-weight:700;">1兆2,601.5億ドル</span>に拡大し、予測期間中に<span style="color:#b0001e;font-weight:700;">年平均成長率（CAGR）29.30%</span>を示す見込みだ。この成長は、企業における<span style="color:#0d3461;font-weight:700;">AI</span>導入、基盤モデルの革新、および業界特化型アプリケーションの拡大によって牽引されている。特に、<span style="color:#0d3461;font-weight:700;">GANs（Generative Adversarial Networks）</span>セグメントは<span style="color:#b0001e;font-weight:700;">2026年</span>に市場全体の<span style="color:#b0001e;font-weight:700;">57.51%</span>を占めると予測されており、テキスト、画像、音声、動画生成への需要増が背景にある。地域別では、<span style="color:#0d3461;font-weight:700;">北米</span>が<span style="color:#b0001e;font-weight:700;">2025年</span>に<span style="color:#b0001e;font-weight:700;">48.70%</span>のシェアで市場を支配したが、<span style="color:#0d3461;font-weight:700;">アジア太平洋地域</span>がデジタルインフラの拡大と政府支援により最も速い成長を示すと見られている。市場の競争軸はモデル品質だけでなく、信頼性、コスト効率、データセキュリティ、既存システムとの統合、測定可能なビジネス成果へと広がりつつある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">雇用の変革期</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AIと雇用市場</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">職務内容に変化</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>の進展は「大量失業」という当初の予測とは異なり、雇用を完全に破壊するのではなく、その「性質」を変えていることが示されている。<span style="color:#0d3461;font-weight:700;">AI</span>は業務の自動化を通じて役割を統合し、新規採用を抑制する傾向にある一方で、<span style="color:#0d3461;font-weight:700;">AIスキル</span>を持つ人材の需要は高まっている。<span style="color:#0d3461;font-weight:700;">ZipRecruiter</span>の調査によると、雇用主の<span style="color:#b0001e;font-weight:700;">74%</span>が<span style="color:#0d3461;font-weight:700;">AIスキル</span>を「強い利点」または「必須要件」と考えている。しかし、新卒者の失業率は上昇しており、これは<span style="color:#0d3461;font-weight:700;">AI</span>の影響も一因とされる。<span style="color:#0d3461;font-weight:700;">MIT</span>の<span style="color:#0d3461;font-weight:700;">ポール・オスターマン教授</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>が「使い捨て労働者」を増加させ、雇用主が正社員ではなく契約社員やフリーランサーに移行する傾向を強めると指摘。長期的に見れば、<span style="color:#0d3461;font-weight:700;">AI</span>が労働市場に与える真の影響はまだ途上にあり、システムの変更、職務内容の再定義、新しいスキルの習得など、社会全体での適応が求められる。</p></div></foreignObject>
