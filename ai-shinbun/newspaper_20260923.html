<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AI規制論争激化</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">米国、AIを「超知能」に</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">国際監視を拒否</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">米国<span style="color:#0d3461;font-weight:700;">ドナルド・トランプ</span>大統領は、AIを「超知能」と改称し、国際的な監督を「グローバリストの企み」として拒否した。これに対し、<span style="color:#0d3461;font-weight:700;">国連</span>人権高等弁務官<span style="color:#0d3461;font-weight:700;">フォルカー・ターク</span>氏は、AIが「前例のないリスク」をもたらすと警告し、緊急の対応を求めた。また、<span style="color:#0d3461;font-weight:700;">アンソロピック</span>社の<span style="color:#0d3461;font-weight:700;">ダリオ・アモデイ</span>氏、<span style="color:#0d3461;font-weight:700;">OpenAI</span>社の<span style="color:#0d3461;font-weight:700;">サム・アルトマン</span>氏、<span style="color:#0d3461;font-weight:700;">SpaceXAI</span>社の<span style="color:#0d3461;font-weight:700;">イーロン・マスク</span>氏といったAI企業幹部らは、開発ペースの減速を訴えている。これを受けて、<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>は「人間中心のAI行動規範」を発表した。中国もAIが国家安全保障上の脅威となりうると警鐘を鳴らしている。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">AI開発の倫理と安全</p><p style="text-indent:1em;margin:0 0 2px;">国際社会におけるAIの倫理と安全確保に向けた議論は避けられない状況だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">中国AI戦略</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">アリババ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">最強チップ</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アリババグループ</span>は、中国で最も強力なAIチップ「<span style="color:#0d3461;font-weight:700;">Zhenwu V900</span>」を発表し、<span style="color:#b0001e;font-weight:700;">5兆</span>から<span style="color:#b0001e;font-weight:700;">10兆</span>パラメータ規模の次世代AIモデル開発計画を明らかにした。これは米国の最先端モデルに近づく動きである。同社<span style="color:#0d3461;font-weight:700;">エディ・ウーCEO</span>は、AIコンピューティング需要の「指数関数的な」増加に対応するため、データセンターの拡張も進める方針を示した。現在の<span style="color:#0d3461;font-weight:700;">Qwen3.8-Max</span>モデルは<span style="color:#b0001e;font-weight:700;">2.4兆</span>パラメータを持つ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">市場拡大</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">世界のAI支出</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">2.7兆ドルへ</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ガートナー</span>は<span style="color:#b0001e;font-weight:700;">2026年</span>の世界AI支出総額が前年比<span style="color:#b0001e;font-weight:700;">49.5%</span>増の<span style="color:#b0001e;font-weight:700;">2.7兆ドル</span>に達するとの見通しを発表した。この上方修正は、<span style="color:#0d3461;font-weight:700;">IaaS</span>、サーバー、半導体などのAIインフラへの投資と、ソフトウェア製品におけるエージェンティックAIの実装加速が主な要因。企業は既存ベンダーの組み込みAIで業務効率化を図る傾向にある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">国際標準化</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">OpenAI</text>
<text font-family="'Noto Sans JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">米国主導提言</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は、急速に進化するAIに安全に対応するため、米国が国際的なAI標準策定を主導すべきと提言した。<span style="color:#0d3461;font-weight:700;">サム・アルトマンCEO</span>は、<span style="color:#b0001e;font-weight:700;">9月23日</span>の<span style="color:#0d3461;font-weight:700;">国連安保理</span>会合でAI安全対策を訴える予定だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">自律配送</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">Arrive AIが披露</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Arrive AI</span>は<span style="color:#b0001e;font-weight:700;">9月23日</span>、インディアナ州の本社で自律配送インフラのデモンストレーションを実施。ロボットによる配送やドローンと<span style="color:#0d3461;font-weight:700;">Arrive Point</span>間の荷物受け渡しを披露する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">安全なAI開発</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">LawZeroへ巨額資金</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">カナダ</span>と<span style="color:#0d3461;font-weight:700;">ドイツ</span>両政府は、信頼できる安全な高度AIを開発する非営利団体<span style="color:#0d3461;font-weight:700;">LawZero</span>に<span style="color:#b0001e;font-weight:700;">3億カナダドル</span>（約<span style="color:#b0001e;font-weight:700;">2億1600万米ドル</span>）を共同出資した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">日本企業の動向</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">ソフトバンクAI戦略</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ソフトバンク</span>は、AIロボットから<span style="color:#0d3461;font-weight:700;">NVIDIA</span>対抗の半導体まで「全方位AI戦略」を展開中。<span style="color:#0d3461;font-weight:700;">アリババ</span>も次世代AIチップを発表し、競争が激化している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">産業応用</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">AI外観検査市場</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">人工知能による外観検査システムの世界市場は<span style="color:#b0001e;font-weight:700;">2026年</span>から<span style="color:#b0001e;font-weight:700;">2032年</span>の成長が予測されており、事前学習済みモデルやディープラーニングモデルが牽引する見込みだ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">LLM競争</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">次世代モデル動向</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アンソロピック</span>が<span style="color:#0d3461;font-weight:700;">Claude Opus 5.5</span>を投入予定。一方、<span style="color:#0d3461;font-weight:700;">グーグル</span>の<span style="color:#0d3461;font-weight:700;">Gemini 4 Pro</span>がステルス試験中との観測もある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">AIの未来</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">再帰的進化と課題</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">AIがAIを開発する「再帰的進化」が加速。効率化による「生産性のパラドックス」や電力不足など、AI社会の課題が浮上している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AI開発の倫理と安全</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">国際的な</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">規制の行方</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AI開発の国際的な規制を巡る論争が激化している。<span style="color:#0d3461;font-weight:700;">米国</span>の<span style="color:#0d3461;font-weight:700;">トランプ</span>大統領は、AIを「超知能」と称し、国際的な監視は「グローバリストの企み」だと一蹴。これに対し、<span style="color:#0d3461;font-weight:700;">国連</span>人権高等弁務官<span style="color:#0d3461;font-weight:700;">フォルカー・ターク</span>氏は、AIが「前例のないリスク」をもたらすとして、各国と「フロンティアAI」企業に対し、緊急の行動を促した。また、<span style="color:#0d3461;font-weight:700;">アンソロピック</span>社の<span style="color:#0d3461;font-weight:700;">ダリオ・アモデイ</span>氏、<span style="color:#0d3461;font-weight:700;">OpenAI</span>社の<span style="color:#0d3461;font-weight:700;">サム・アルトマン</span>氏、<span style="color:#0d3461;font-weight:700;">SpaceXAI</span>社の<span style="color:#0d3461;font-weight:700;">イーロン・マスク</span>氏ら主要AI企業幹部は、AI開発の減速を訴えている。<span style="color:#0d3461;font-weight:700;">マイクロソフト</span>は「人間中心のAI行動規範」を発表し、AIモデルが人類に従属すべきだと提唱。中国の情報機関もAIが国家安全保障上の脅威となりうると警告しており、国際社会におけるAIの倫理と安全確保に向けた議論は避けられない状況だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIチップ開発競争</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">中国アリババ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">最先端に迫る</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">中国の<span style="color:#0d3461;font-weight:700;">アリババグループ</span>は、独自開発したAIチップ「<span style="color:#0d3461;font-weight:700;">Zhenwu V900</span>」を発表し、これが現時点で中国で最も強力なAIチップであると強調した。従来の「<span style="color:#0d3461;font-weight:700;">Zhenwu M890</span>」と比較して<span style="color:#b0001e;font-weight:700;">3倍</span>の性能向上を達成している。同社はまた、<span style="color:#b0001e;font-weight:700;">5兆</span>から<span style="color:#b0001e;font-weight:700;">10兆</span>パラメータ規模のAIモデルを訓練する計画も公表し、これは米国の最先端モデルに匹敵するレベルに近づくものとみられる。これに対し、中国のAI企業<span style="color:#0d3461;font-weight:700;">月之暗面</span>（<span style="color:#0d3461;font-weight:700;">Moonshot AI Technology</span>）は、<span style="color:#b0001e;font-weight:700;">7月</span>にリリースした「<span style="color:#0d3461;font-weight:700;">Kimi K3</span>」が<span style="color:#b0001e;font-weight:700;">2.8兆</span>パラメータで世界最大のオープンモデルであると主張している。AIコンピューティング需要が「指数関数的に」増加する中、<span style="color:#0d3461;font-weight:700;">アリババ</span>はデータセンターの拡張を急いでおり、<span style="color:#b0001e;font-weight:700;">2032年</span>までに<span style="color:#b0001e;font-weight:700;">20ギガワット</span>以上のコンピューティング能力を目指す。しかし、AIデータセンターのサプライチェーンにおける世界的な不足が、その拡張ペースを制限しているという課題も浮上している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AI投資の現状と展望</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">インフラ投資が</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">成長を牽引</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">世界のAI支出は急増しており、<span style="color:#0d3461;font-weight:700;">ガートナー</span>の最新予測によれば、<span style="color:#b0001e;font-weight:700;">2026年</span>には総額が前年比<span style="color:#b0001e;font-weight:700;">49.5%</span>増の<span style="color:#b0001e;font-weight:700;">2.7兆ドル</span>に達する見込みだ。これは<span style="color:#b0001e;font-weight:700;">1月</span>および<span style="color:#b0001e;font-weight:700;">5月</span>の予測から段階的に上方修正されたものであり、AI市場の急速な拡大を示している。支出を牽引する主要因は、<span style="color:#0d3461;font-weight:700;">IaaS</span>（サービスとしてのインフラ）、サーバー、ネットワーク、半導体、デバイスなどを含むAIインフラへの大規模な投資である。<span style="color:#b0001e;font-weight:700;">2026年</span>にはこの分野だけで<span style="color:#b0001e;font-weight:700;">1兆4844億ドル</span>が投じられ、総支出の過半を占める見通しだ。特にハイパースケーラーやサービス事業者によるAI向けサーバー購入需要が継続するとみられている。もう一つの成長要因は、既存のソフトウェア製品における「エージェンティックAI」の実装が進むことである。ユーザー企業は、大規模な新規AIプロジェクトを立ち上げるよりも、既存のベンダーが提供する組み込みAI機能を利用して業務の効率化や自動化を進める傾向が強いと<span style="color:#0d3461;font-weight:700;">ガートナー</span>は分析している。この動向は、AIが特定の業務や業界に特化したドメイン特化型言語モデル（<span style="color:#0d3461;font-weight:700;">DSLM</span>）の市場拡大にも繋がっている。</p></div></foreignObject>
