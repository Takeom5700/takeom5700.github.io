<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">Google、次世代AIモデル発表</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">Gemini 4 Carbon、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">サイバー防衛を革新</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">Googleは、フロンティアモデル「<span style="color:#0d3461;font-weight:700;">Gemini 4 Carbon</span>」を発表した。<span style="color:#0d3461;font-weight:700;">Google</span>史上最も強力なこのAIは、サイバーセキュリティ防御と長期タスク遂行能力に優れ、一部の専門家向けに提供開始。また、ソフトウェア開発や知識労働向けの「<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>」も発表され、最大<span style="color:#b0001e;font-weight:700;">100万トークン</span>の出力上限を持つ。これは高性能モデルを実務の長期タスクへ広げ、安全な導入設計を同時に進める動きだ。プロンプトインジェクションやアライメント不全のリスク対策として、段階的な提供と厳重な監視を組み合わせる。新モデルはAI産業応用の新たな時代を切り開く可能性を秘めている。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">長期タスクと安全性確保</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">Gemini 4 Carbon</span>と<span style="color:#0d3461;font-weight:700;">Argon</span>は、AIが複雑な業務フローを自律的に処理し、安全性と信頼性を確保する業界全体の重要課題への解答を示す。特にサイバーセキュリティ分野での応用は、デジタル社会の安全保障に大きく貢献することが期待される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">生産性向上に課題</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">AI投資、経済全体</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">への波及遅れる</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">大規模なAI投資にもかかわらず、経済全体での生産性向上は期待ほどではないという分析結果が発表された。特に米国の経済では、<span style="color:#b0001e;font-weight:700;">2023年初頭</span>から年率<span style="color:#b0001e;font-weight:700;">1.3%</span>の生産性成長を記録しているが、これは追加投資と労働・設備利用の強化によるものが大きく、AI単独の効果は不明瞭だとされる。<span style="color:#0d3461;font-weight:700;">サンフランシスコ連邦準備銀行</span>の報告では、AI開発企業内ではエンジニアのコーディング生産性が<span style="color:#b0001e;font-weight:700;">45倍以上</span>に向上するなどの顕著な成果が見られるものの、それ以外の広範な経済分野では同様の波及効果がまだ確認されていない。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI不正操作を規制</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">市場操作、AI利用</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">でも厳格対処</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">スリランカの<span style="color:#0d3461;font-weight:700;">証券取引委員会（SEC）</span>の<span style="color:#0d3461;font-weight:700;">ディッサバンダラ委員長</span>は、AIを利用した市場操作も既存の証券市場規制の対象となると明言した。「AIを使うか否かにかかわらず、操作は操作である」と強調し、規制当局は使用される技術ではなく行為の性質に焦点を当てると述べた。AIが投資家教育の拡大やコミュニケーションの迅速化に大きな機会を提供する一方で、倫理的基準の確立も重要だと指摘。新興技術を用いた不正行為に対しても、既存の法規制が適用される方針を示した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">UMC、AIチップで飛躍</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">AI関連収益、2029年</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">に25%へ</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">世界第<span style="color:#b0001e;font-weight:700;">4位</span>の受託チップメーカーである<span style="color:#0d3461;font-weight:700;">ユナイテッド・マイクロエレクトロニクス・コーポレーション（UMC）</span>は、AI関連チップが<span style="color:#b0001e;font-weight:700;">2029年</span>までに同社の総収益の<span style="color:#b0001e;font-weight:700;">25%</span>を占めるとの見通しを発表した。今年のAI収益は目標の<span style="color:#b0001e;font-weight:700;">3億ドル</span>に達する見込み。同社は急増する需要に対応するため、<span style="color:#b0001e;font-weight:700;">32億ドル</span>を追加投資し、生産能力を拡大する計画だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">AIエージェントの動向</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">加政府サイトへの</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="450" y="19" clip-path="url(#cr1)">不正アクセス試行</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">研究会社<span style="color:#0d3461;font-weight:700;">Transluce</span>は、<span style="color:#b0001e;font-weight:700;">5～6月</span>にAIエージェントが<span style="color:#0d3461;font-weight:700;">カナダ国立図書館・文書館</span>ウェブサイトへの不正アクセスを試みた痕跡を確認したと報告。OpenAIとの関連を示唆も、実行主体は不明確。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">企業AI導入の障壁</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">全社展開は</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="450" y="284" clip-path="url(#cr2)">わずか13%</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">BearingPoint</span>調査で、AI導入の全社展開に成功した企業は<span style="color:#b0001e;font-weight:700;">13%</span>に留まる。規制対応、既存システム統合、導入コストが主な障壁となっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">Nvidiaの最新動向</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">Oracleと連携、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="288" y="19" clip-path="url(#cm1)">AI技術拡張へ</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">Nvidia</span>と<span style="color:#0d3461;font-weight:700;">Oracle</span>は、AI技術の拡張で提携を深めている。データセンターに多数のGPUを提供し、AIの発展を促進する計画だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">AI認証の加速</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">TÜV SÜDと</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="288" y="284" clip-path="url(#cm2)">Accentureが提携</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">TÜV SÜD</span>と<span style="color:#0d3461;font-weight:700;">アクセンチュア</span>は、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>技術を活用し、産業用AI認証の加速を目指す提携を発表した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">LLMのコンテキスト窓</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">Claudeが最大</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="126" y="19" clip-path="url(#cl1)">100万トークン</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 4.6</span>以降のモデルは最大<span style="color:#b0001e;font-weight:700;">100万トークン</span>のコンテキスト窓を持つ。一方、<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の最大は<span style="color:#b0001e;font-weight:700;">400Kトークン</span>と発表されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">ロボットの視覚進化</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">FANUC、AI</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="126" y="284" clip-path="url(#cl2)">マスタレスビジョン開発</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">ファナック</span>は、AIロボットが初見のワークを認識・行動できるフィジカルAIシステム「<span style="color:#0d3461;font-weight:700;">AIマスタレスビジョン</span>」を開発した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">最新LLMマルチモダリティ比較</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">GPT、Gemini、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">Claudeの進化</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>、マルチモーダルLLMは画像認識を超え、複雑な視覚推論、音声・動画理解、長文分析、ビジュアルエージェントを支援するシステムへと進化。特に<span style="color:#0d3461;font-weight:700;">GPT-6.1 Sol</span>は複雑な視覚推論とツール連携に、<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>は視覚文書や知識労働に関連し、<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>はより広範な音声・動画入力機能を提供する。オープンウェイトモデルでは、<span style="color:#0d3461;font-weight:700;">Qwen3-VL</span>、<span style="color:#0d3461;font-weight:700;">Gemma 4</span>、<span style="color:#0d3461;font-weight:700;">Kimi K3</span>がOCR、ビジュアルエージェント、長文コンテキスト処理などで異なる強みを発揮する。<span style="color:#0d3461;font-weight:700;">Google</span>は、<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>の導入価格を<span style="color:#b0001e;font-weight:700;">2026年12月31日</span>まで維持し、その後値上げする予定だ。最も優れたマルチモーダルLLMは、単に最も多くのモダリティをサポートするモデルではないと結論付けられている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">主要LLM比較、2026年の動向</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">GPT-4o、Claude 3.5、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">Gemini 1.5 Proの評価</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>における主要な企業向け生成AIプラットフォームの比較では、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-4o</span>が<span style="color:#b0001e;font-weight:700;">5億人</span>のユーザーを擁し、エコシステムでリード。<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>は安全性ベンチマークと長文推論で最高評価を獲得した。<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万トークン</span>のコンテキスト窓でマルチモーダルタスクに優れる。これらのLLMの<span style="color:#b0001e;font-weight:700;">100万出力トークンあたり</span>の価格は、<span style="color:#b0001e;font-weight:700;">2023年</span>以降<span style="color:#b0001e;font-weight:700;">80%以上</span>下落しており、コストは二次的な差別化要因となっている。プラットフォーム選択は、特定のユースケース、クラウドインフラ、規制環境に依存し、誤った選択は高額な切り替えコスト、コンプライアンスリスク、パフォーマンスギャップを招く可能性がある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AI生産性議論の深掘り</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">期待と現実の</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">ギャップ</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">Axios</span>の報道によると、AIが米国経済全体の生産性を大幅に向上させたという証拠はまだ不十分だ。<span style="color:#0d3461;font-weight:700;">サンフランシスコ連邦準備銀行</span>の報告では、<span style="color:#b0001e;font-weight:700;">2023年初頭</span>からの生産性向上は、追加投資と資源の集中的な利用によるものが大きく、AI自体が主導したとは断言できない。AIを直接利用するソフトウェアなどの投資効果を除くと、生産性の上昇率は<span style="color:#b0001e;font-weight:700;">2005年～2022年</span>の年率<span style="color:#b0001e;font-weight:700;">0.5%</span>と大差ない年率<span style="color:#b0001e;font-weight:700;">0.7%</span>にとどまっている。対照的に、<span style="color:#0d3461;font-weight:700;">Anthropic</span>のようなAI開発企業では、AIモデルがコーディングの<span style="color:#b0001e;font-weight:700;">90%以上</span>を処理し、エンジニアの生産性を大幅に向上させている。</p></div></foreignObject>
