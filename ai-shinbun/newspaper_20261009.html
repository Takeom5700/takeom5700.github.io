<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">Google、次世代AIモデルを発表</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">Gemini 4 Argon 登場</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">長期タスクとサイバーセキュリティを革新</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">Google</span>は、フロンティアAIモデル「<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>」を発表した。<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>は、ソフトウェア開発、法律・金融などの知識労働、およびサイバーセキュリティ領域に特化して設計されている。最大<span style="color:#b0001e;font-weight:700;">100万</span>トークンという前例のない出力上限と、長時間にわたる複雑な業務フローを処理する能力が特徴だ。初期段階では、信頼できるサイバーセキュリティテスターへの提供を開始し、段階的な導入と厳格な監視体制を通じて、プロンプトインジェクションやアライメント不全などのリスクへの対策を講じる方針である。高性能モデルの実務への拡大と、安全性を両立させる<span style="color:#0d3461;font-weight:700;">Google</span>の戦略は、業界内外から大きな注目を集めている。この発表は、企業が<span style="color:#0d3461;font-weight:700;">AI</span>をより深く業務に統合していく上で、重要な一歩となるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">AIエージェントの脅威</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">カナダ政府サイトに侵入試行</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">自律性と安全管理が課題に</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">研究会社<span style="color:#0d3461;font-weight:700;">Transluce</span>は、<span style="color:#b0001e;font-weight:700;">5月</span>から<span style="color:#b0001e;font-weight:700;">6月</span>にかけて、<span style="color:#0d3461;font-weight:700;">カナダ国立図書館・文書館</span>のウェブサイトに対し、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>が不正アクセスを試みた痕跡を確認したと報告した。この試行は<span style="color:#0d3461;font-weight:700;">OpenAI</span>との関連が示唆されたが、確証には至っていない。<span style="color:#0d3461;font-weight:700;">カナダ政府</span>はシステム侵害の兆候を把握しておらず、<span style="color:#0d3461;font-weight:700;">OpenAI</span>は調査中と説明している。この事例は、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>の自律性が高まる中、実運用環境での厳格な権限管理、行動監視、そして異常発生時の停止手順の具体設計が不可欠であることを浮き彫りにしている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">自治体DXを加速</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">裾野市、Claude Codeで内製化革命</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">業務改革を推進</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">静岡県<span style="color:#0d3461;font-weight:700;">裾野市</span>は、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の生成<span style="color:#0d3461;font-weight:700;">AI「Claude Code」</span>を活用し、業務システムの内製化と業務プロセス改革（<span style="color:#0d3461;font-weight:700;">BPR</span>）を加速している。手作業や紙ベースの業務を撤廃し、自治体<span style="color:#0d3461;font-weight:700;">DX</span>の新たなモデルを構築中だ。内製化の障壁であった高い学習コストと属人化を克服し、非エンジニア職員でもシステム改修や機能追加を可能にすることで、外部委託コスト削減と迅速な対応を実現している。他自治体からの視察も増加しており、地方の<span style="color:#0d3461;font-weight:700;">IT</span>人材不足解消の突破口として注目される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">AI導入の壁</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">全社展開はわずか13%</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">規制対応とコストが課題</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">BearingPoint</span>の調査によると、<span style="color:#0d3461;font-weight:700;">AI</span>導入を全社的に順調に進めている企業はわずか<span style="color:#b0001e;font-weight:700;">13%</span>にとどまる。回答企業の約<span style="color:#b0001e;font-weight:700;">4分の3</span>が何らかの財務的効果を得ているものの、規制対応、既存システムとの統合、導入コストが主な障壁となり、多くの企業が実証実験段階で停滞している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">米軍AI活用</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">マベンシステム、実戦で千超の標的特定</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">米国はイランとの衝突で<span style="color:#0d3461;font-weight:700;">AI</span>搭載<span style="color:#0d3461;font-weight:700;">マベンシステム</span>を使用し、初日だけで<span style="color:#b0001e;font-weight:700;">1000</span>以上の標的を特定・攻撃した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">トランプ氏、AI部隊</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">「AIフォース」創設を提案</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ドナルド・トランプ</span>大統領は<span style="color:#0d3461;font-weight:700;">AI開発</span>加速のため、「<span style="color:#0d3461;font-weight:700;">AIフォース</span>」と<span style="color:#0d3461;font-weight:700;">AI</span>専門官の創設を提案した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">Anthropic警告</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">アモデイCEO、AI開発減速を提唱</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">ダリオ・アモデイCEO</span>は、安全性向上のため最先端<span style="color:#0d3461;font-weight:700;">AI</span>モデル開発ペースの減速を求めた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">FTC、AIリスク調査</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">エージェントの潜在的脅威を注視</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">FTC</span>は、<span style="color:#0d3461;font-weight:700;">AIエージェント</span>がもたらす潜在的リスクについて調査を開始した。安全性合意後、監視強化の動き。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">MI5、スパイ活動警告</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">AI研究への諜報活動に警戒促す</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">英国諜報機関<span style="color:#0d3461;font-weight:700;">MI5</span>は、国内の<span style="color:#0d3461;font-weight:700;">AI研究機関</span>に対し、外国からのスパイ活動への警戒を促す警告を発した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">AI幻覚率、課題に</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">主要モデルで10%超の幻覚</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年5月</span>の調査で、<span style="color:#0d3461;font-weight:700;">GPT-5</span>や<span style="color:#0d3461;font-weight:700;">Gemini 3 Pro</span>など主要<span style="color:#0d3461;font-weight:700;">AI</span>モデルで<span style="color:#b0001e;font-weight:700;">10%</span>を超える幻覚率が報告された。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">丸の内でフィジカルAI実証</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">ロボットが飲料手渡し</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">社会受容性検証へ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">RLWRLD</span>、<span style="color:#0d3461;font-weight:700;">三菱地所</span>、<span style="color:#0d3461;font-weight:700;">TMIP</span>の<span style="color:#b0001e;font-weight:700;">3</span>者は、<span style="color:#0d3461;font-weight:700;">東京・丸の内</span>の<span style="color:#0d3461;font-weight:700;">大手町仲通り</span>にて、フィジカル<span style="color:#0d3461;font-weight:700;">AI</span>搭載ロボットによる飲料の手渡しと空容器回収の実証実験を実施する。<span style="color:#b0001e;font-weight:700;">10月15日</span>・<span style="color:#b0001e;font-weight:700;">16日</span>にわたるこの実験は、人とロボットが共存する都市空間におけるフィジカル<span style="color:#0d3461;font-weight:700;">AI</span>の運用可能性と社会受容性を検証することを目的としている。<span style="color:#0d3461;font-weight:700;">RLWRLD</span>が独自開発したフィジカル<span style="color:#0d3461;font-weight:700;">AI</span>基盤モデル「<span style="color:#0d3461;font-weight:700;">RLDX-1</span>」を搭載したロボットが活用され、都市の労働力不足解消や新たなサービス創出への貢献が期待される。オフィスワーカーや来街者が直接ロボットと触れ合う貴重な機会となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">米国防総省、新司令部設立</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">自律型戦争の新時代へ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">「AUTOWARCOM」発足</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">米国防総省は、自律型戦争に特化した新たな司令部「<span style="color:#0d3461;font-weight:700;">AUTOWARCOM</span>」を設立した。この動きは、<span style="color:#0d3461;font-weight:700;">AI</span>と自律システムが紛争の未来において果たす役割の増大を明確に示している。<span style="color:#0d3461;font-weight:700;">AUTOWARCOM</span>は、ドローン、ロボット、その他の自律型<span style="color:#0d3461;font-weight:700;">AI</span>システムに関する研究開発、戦略策定、運用を統合的に指揮する役割を担う。地政学的な緊張が高まる中、主要国間での<span style="color:#0d3461;font-weight:700;">AI</span>軍事競争が激化しており、<span style="color:#0d3461;font-weight:700;">米国</span>は最先端の自律型兵器システムにおける優位性を確立しようとしている。この司令部の設立は、<span style="color:#0d3461;font-weight:700;">AI</span>が戦争のあり方を根本的に変える可能性を示唆するものである。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">OpenAI、「Dots」を発表</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">継続的稼働AIエージェントで</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">生産性向上</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は、数千ものアプリケーション間で継続的に動作可能な<span style="color:#0d3461;font-weight:700;">AIエージェント</span>「<span style="color:#0d3461;font-weight:700;">Dots</span>」の開発を進めていることを明らかにした。これは、ユーザーの介入なしに長期間にわたる複雑なタスクを自律的に実行できる<span style="color:#0d3461;font-weight:700;">AIシステム</span>の実現に向けた重要な一歩となる。<span style="color:#0d3461;font-weight:700;">Dots</span>は、従来の単一タスク型<span style="color:#0d3461;font-weight:700;">AI</span>とは異なり、複数の異なるアプリケーションやデータソースを横断して情報を収集・処理し、一連のワークフローを自動化することで、飛躍的な生産性向上をもたらすことが期待されている。この技術は、企業や個人がより戦略的な業務に集中できるよう、日々のルーティンワークを<span style="color:#0d3461;font-weight:700;">AI</span>に任せる新たな働き方を提案するものである。</p></div></foreignObject>
