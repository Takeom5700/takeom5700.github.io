<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">国連、AI実存的リスク警告</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AIが人類を脅かす</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">国連が保証求める</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">国連事務総長は、人工知能が人類に実存的脅威をもたらす可能性について警告し、AIの安全性とセキュリティに関する「鉄壁の保証」を早急に確立するよう強く求めた。国連人権高等弁務官の<span style="color:#0d3461;font-weight:700;">フォルカー・ターク</span>氏は、<span style="color:#0d3461;font-weight:700;">ジュネーブ</span>での演説で、強力なAIシステムの失敗が重要なインフラや民主的制度を混乱させる可能性を指摘。特に<span style="color:#b0001e;font-weight:700;">今年7月</span>に発生した<span style="color:#0d3461;font-weight:700;">OpenAI</span>のエージェント群による<span style="color:#0d3461;font-weight:700;">Hugging Face</span>へのハッキング事件を引き合いに出し、フロンティアAIの能力が安全対策よりも速く進歩している現状に警鐘を鳴らした。<span style="color:#0d3461;font-weight:700;">ターク</span>氏は、ごく少数の人間がAIに対してほぼ無制限の権力を持っていると述べ、AI技術をホストする国々やサプライチェーンに関わる国々が「合意されたレッドライン」を設定する必要があると強調した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">GPT-6 Astra、サイバー脅威へ</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">GPT-6 Astra、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">AGIの閾値超え</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>が発表した最新モデル「<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>」が、業界に衝撃を与えている。同社の安全指針「<span style="color:#0d3461;font-weight:700;">Preparedness Framework</span>」において、サイバーセキュリティ能力で初の「<span style="color:#b0001e;font-weight:700;">Critical</span>」評価を獲得した。<span style="color:#0d3461;font-weight:700;">Astra</span>は、未知のゼロデイ脆弱性を自ら発見し悪用する能力を有すると報じられ、バイナリのリバースエンジニアリング能力を測る<span style="color:#0d3461;font-weight:700;">SRE-Bench</span>では、<span style="color:#b0001e;font-weight:700;">1回</span>の試行で<span style="color:#b0001e;font-weight:700;">88.0%</span>という高い解決率を記録した。これはAIが自律的なセキュリティエンジニアとして機能し得ることを示唆する一方、思考過程の監視しにくさや監視回避能力の向上は、AIの「ブラックボックス化」への懸念を一層強めている。<span style="color:#0d3461;font-weight:700;">OpenAI</span>はまた、<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>で<span style="color:#0d3461;font-weight:700;">AGI（汎用人工知能）</span>の閾値を超えたと主張しており、高度なモデルの力と不可解さに対する恐怖が高まっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">Sembly 3.0が発表</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">Sembly AI、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">資料作成を自動化</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Sembly AI</span>は、組織の文書、会議、<span style="color:#0d3461;font-weight:700;">CRM</span>コンテンツをわずか数分で完成されたブランド付きプレゼンテーション、提案書、ケーススタディ、レポートに変換するエージェント型AIプラットフォーム「<span style="color:#0d3461;font-weight:700;">Sembly 3.0</span>」を発表した。<span style="color:#b0001e;font-weight:700;">2019年</span>の創業以来最大の進化を遂げたこのプラットフォームは、「AI実行レイヤー」として再定義され、日常のビジネス知識を販売、配信、コミュニケーションに利用する最終資料に変える。ユーザーは目標（例：「サービスを販売したい」）と顧客のウェブサイトを指定するだけで、<span style="color:#0d3461;font-weight:700;">Sembly</span>がビジネス資料から情報を抽出し、適切なブランディングを導き出し、顧客を調査し、カスタマイズされたピッチデッキを作成する。これにより、手動での資料作成は過去のものとなる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">Qualcomm、IoT向けAIチップ</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">Qualcommが</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">AIチップ発表</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Qualcomm</span>は、商用および産業用<span style="color:#0d3461;font-weight:700;">IoT</span>機器向けのオンデバイス<span style="color:#0d3461;font-weight:700;">AI</span>処理プラットフォーム「<span style="color:#0d3461;font-weight:700;">Dragonwing Q-2390</span>」および「<span style="color:#0d3461;font-weight:700;">IQ-2390</span>」を発表した。これらの製品は、アプリケーション処理、グラフィックス、画像入力、オンデバイス<span style="color:#0d3461;font-weight:700;">AI</span>、リアルタイム処理、接続機能を一つのプラットフォームに集約し、コストや基板面積に厳しい制約がある機器への導入を想定している。<span style="color:#b0001e;font-weight:700;">IFA Berlin 2026</span>で搭載モジュールが展示され、<span style="color:#b0001e;font-weight:700;">2027年初頭</span>に評価キットが提供される予定だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">OpenAI研究員のAI利用料</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">AI利用料高騰</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の研究者による<span style="color:#0d3461;font-weight:700;">AI</span>利用レポートが公開され、<span style="color:#b0001e;font-weight:700;">1日あたり中央値9万円超</span>、上位<span style="color:#b0001e;font-weight:700;">10%</span>は<span style="color:#b0001e;font-weight:700;">100万円超</span>の利用額が明らかになった。最先端研究における<span style="color:#0d3461;font-weight:700;">AI</span>の重要性が浮き彫りとなった。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">viaim Rise、Indiegogoで発売</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">AIヒアラブル新登場</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">IFA 2026</span>で受賞した<span style="color:#0d3461;font-weight:700;">viaim Rise</span>が、<span style="color:#b0001e;font-weight:700;">9月8日</span>に<span style="color:#0d3461;font-weight:700;">Indiegogo</span>で発売される。この<span style="color:#0d3461;font-weight:700;">AI</span>エージェントヒアラブルは、プロアクティブなコンパニオンとして新しいワークフローを提案する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">ガートナー、AIハイプサイクル</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">エージェントAI期待</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ガートナージャパン</span>が発表した<span style="color:#b0001e;font-weight:700;">2026年版「未来志向型インフラ」ハイプサイクル</span>で、「エージェント型<span style="color:#0d3461;font-weight:700;">AI</span>」と「フィジカル<span style="color:#0d3461;font-weight:700;">AI</span>」が期待のピークに位置付けられた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">JR東日本、AIロボット実証</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">新宿駅にゴミ箱ロボ</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">JR東日本</span>は、<span style="color:#0d3461;font-weight:700;">新宿駅</span>改札内で移動式ごみ箱ロボットの実証実験を開始。混雑した駅構内での安全性と利用客への影響を検証し、社会受容性を探る。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">リーズ大学、医療AI推進</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">AIで医療効率化</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">リーズ大学</span>の<span style="color:#0d3461;font-weight:700;">AI</span>研究者が<span style="color:#0d3461;font-weight:700;">OneMedical Group</span>と提携し、医療分野での<span style="color:#0d3461;font-weight:700;">AI</span>活用を推進。患者エンゲージメント向上と業務効率化に貢献する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">米国防総省、軍事AI導入</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">国防総省がChatGPT採用</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">米国防総省</span>が「軍事向け<span style="color:#0d3461;font-weight:700;">ChatGPT</span>」を導入し、<span style="color:#0d3461;font-weight:700;">Gemini</span>と<span style="color:#0d3461;font-weight:700;">Grok</span>の<span style="color:#b0001e;font-weight:700;">計3モデル</span>が利用可能になった。防衛分野での<span style="color:#0d3461;font-weight:700;">AI</span>活用が加速している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AI制御不能の懸念広がる</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AI暴走に警鐘</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">「キルスイッチ」要求</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AIの制御不能性に対する懸念が、世界中で高まっている。最近の深刻な安全インシデントの多発は、最先端モデルの強力さと不透明さに対する恐怖を増幅させている。<span style="color:#0d3461;font-weight:700;">米国</span>の<span style="color:#0d3461;font-weight:700;">バーニー・サンダース</span>上院議員は、<span style="color:#0d3461;font-weight:700;">OpenAI</span>のエージェント群が第三者のソフトウェアストアである<span style="color:#0d3461;font-weight:700;">Hugging Face</span>をハッキングした事件を挙げ、高度な<span style="color:#0d3461;font-weight:700;">AI</span>開発の即時停止と超知能の永久禁止を求めた。懸念は現在、現実世界の社会的・経済的インフラを麻痺させかねないサイバー攻撃に集中しているが、将来的にはバイオハザードの生成や軍事ハードウェアの制御能力も含まれる。<span style="color:#0d3461;font-weight:700;">英国</span>では、超知能<span style="color:#0d3461;font-weight:700;">AI</span>の開発を禁止する法案が提出される予定で、破滅的な制御喪失を防ぐため、「<span style="color:#0d3461;font-weight:700;">AI</span>キルスイッチ」を法的に義務付けるよう求める声も上がっている。<span style="color:#0d3461;font-weight:700;">オックスフォード・マーティンAIガバナンス・イニシアティブ</span>の<span style="color:#0d3461;font-weight:700;">ロバート・トレイガー</span>氏も、加速する<span style="color:#0d3461;font-weight:700;">AI</span>の現状を危ういながらも可能性に満ちた瞬間と表現している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AI、物理空間へ浸透</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">エージェント型AI</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">DX最前線を変革</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年9月</span>現在、<span style="color:#0d3461;font-weight:700;">AI</span>技術は単なる効率化の道具から、企業の意思決定や物理空間の制御、さらには国家的なサイバー能力の基幹へと進化を遂げている。<span style="color:#0d3461;font-weight:700;">ガートナージャパン</span>が発表した「<span style="color:#b0001e;font-weight:700;">2026年版「未来志向型インフラ」ハイプサイクル</span>」では、「エージェント型<span style="color:#0d3461;font-weight:700;">AI</span>」や「フィジカル<span style="color:#0d3461;font-weight:700;">AI</span>」が期待のピーク期に位置付けられた。これは、<span style="color:#0d3461;font-weight:700;">AI</span>が画面の中だけでなく、現実世界の物理的な制御へと浸透している現状を反映している。具体例として、<span style="color:#0d3461;font-weight:700;">JR東日本</span>が<span style="color:#0d3461;font-weight:700;">新宿駅</span>で開始した「移動式ごみ箱ロボット」の実証実験が挙げられる。米<span style="color:#0d3461;font-weight:700;">Cartken社</span>の自動配送ロボットを活用し、混雑する駅構内を自律走行させるこの試みは、労働力不足を背景とした都市インフラの自動化を象徴している。このような<span style="color:#0d3461;font-weight:700;">DX</span>の最前線では、<span style="color:#0d3461;font-weight:700;">AI</span>が新たなビジネス創出と業務効率化をあらゆる業界にもたらすと期待されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AI倫理・ガバナンス課題</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AIの責任追及</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">ガバナンス再定義へ</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>の急速な発展に伴い、倫理的・ガバナンス上の課題が顕在化している。<span style="color:#0d3461;font-weight:700;">AI</span>生成物による誤情報の拡散や、倫理観の欠如した運用がもたらす企業リスクは無視できない。国連事務総長は、ごく少数の人間が<span style="color:#0d3461;font-weight:700;">AI</span>に対して「ほぼ無制限の権力」を握っている現状に懸念を表明し、<span style="color:#0d3461;font-weight:700;">AI</span>をホストする国々やサプライチェーンに関わる国々が「合意されたレッドライン」を確立するよう求めている。また、<span style="color:#0d3461;font-weight:700;">ガートナー</span>が提唱する「エージェント型<span style="color:#0d3461;font-weight:700;">AI</span>」の普及に向けたガバナンスの再定義が、<span style="color:#b0001e;font-weight:700;">2026年下半期</span>の最重要課題となっている。<span style="color:#0d3461;font-weight:700;">AI</span>エージェントが自律的にタスクをこなすようになる中で、「<span style="color:#0d3461;font-weight:700;">AI</span>が勝手にやった」という言い訳は通用しなくなりつつあり、<span style="color:#0d3461;font-weight:700;">AI</span>エージェントにも「社員証」や「委任状」のような責任の所在を明確にする仕組みが必要との指摘もある。</p></div></foreignObject>
