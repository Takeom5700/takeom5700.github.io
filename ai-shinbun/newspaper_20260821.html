<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">技術革新の最前線</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">OpenAI「アストラ」</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">未解決数学問題10件解決</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の次期主力モデル「<span style="color:#0d3461;font-weight:700;">Astra</span>」の社内版が、数学・理論計算機科学の未解決問題を<span style="color:#b0001e;font-weight:700;">10</span>件解決したと報じられ、<span style="color:#0d3461;font-weight:700;">AI</span>の科学的推論能力の飛躍的な向上を示しました。わずか約<span style="color:#b0001e;font-weight:700;">2,000ドル</span>の計算コストで、非ソフィック群の存在証明や球充填密度の新しい上限など、本格的な研究領域に踏み込む成果です。これは、<span style="color:#0d3461;font-weight:700;">AI</span>が単なるツールから、独創的な研究貢献者へと進化する可能性を示唆しています。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">IPOに向け加速</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#b0001e;font-weight:700;">2026年</span>第<span style="color:#b0001e;font-weight:700;">4</span>四半期の<span style="color:#0d3461;font-weight:700;">IPO</span>（新規株式公開）に向け、財務チームを強化していると報じられました。年間売上高は<span style="color:#b0001e;font-weight:700;">400億ドル</span>を突破し、<span style="color:#b0001e;font-weight:700;">2025年</span>末の<span style="color:#b0001e;font-weight:700;">2</span>倍となっています。<span style="color:#0d3461;font-weight:700;">Apple</span>との企業秘密訴訟では、同社は<span style="color:#b0001e;font-weight:700;">31</span>ページにわたる棄却申立書を提出し、訴訟は「核心から腐っている」と反論しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">業界再編の動き</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">Google、AI研究</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">体制をカリフォルニアに集約</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は、<span style="color:#0d3461;font-weight:700;">Anthropic</span>や<span style="color:#0d3461;font-weight:700;">OpenAI</span>との競争激化を受け、<span style="color:#0d3461;font-weight:700;">AI</span>研究開発の指揮をカリフォルニア本社に集中させる方針を打ち出しました。<span style="color:#0d3461;font-weight:700;">Koray Kavukcuoglu氏</span>が<span style="color:#0d3461;font-weight:700;">AI</span>研究・オペレーション全体を統括し、<span style="color:#0d3461;font-weight:700;">Demis Hassabis氏</span>は<span style="color:#0d3461;font-weight:700;">Google DeepMind</span>の会長兼<span style="color:#0d3461;font-weight:700;">Alphabet</span>のチーフサイエンティストとして戦略的役割に移行します。また、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は元カリフォルニア州最高裁判事の<span style="color:#0d3461;font-weight:700;">Tino Cuéllar氏</span>を初代グローバル渉外責任者に任命し、<span style="color:#0d3461;font-weight:700;">AI</span>規制・政策対応を強化する動きを示しています。年間売上高は<span style="color:#b0001e;font-weight:700;">650億ドル</span>を突破し、好調を維持しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">世界市場と規制</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">AIチップ出荷へ</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">エヌビディア</span>は年内に中国顧客向けの新型<span style="color:#0d3461;font-weight:700;">AI</span>特化チップの少量出荷を開始する計画です。これは<span style="color:#0d3461;font-weight:700;">Groq</span>からライセンス供与された<span style="color:#0d3461;font-weight:700;">LPU</span>（言語処理ユニット）の改良版であり、米国の輸出規制に完全準拠するよう設計されています。一方、<span style="color:#0d3461;font-weight:700;">EU AI法</span>の透明性義務が<span style="color:#b0001e;font-weight:700;">2026年8月2日</span>に施行され、<span style="color:#0d3461;font-weight:700;">AI</span>システムとの対話や生成物には開示が義務付けられます。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AI、質問応答から</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">「実行」へ変貌</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">この<span style="color:#b0001e;font-weight:700;">10年</span>で<span style="color:#0d3461;font-weight:700;">AI</span>は、質問に答えるツールから、目標を追求し、計画し、行動し、自身の作業をチェックし、仕事を完了させる「同僚」へと進化しています。<span style="color:#b0001e;font-weight:700;">ChatGPT</span>の登場から<span style="color:#b0001e;font-weight:700;">3年</span>で、生成<span style="color:#0d3461;font-weight:700;">AI</span>の人口レベルでの普及率は<span style="color:#b0001e;font-weight:700;">53%</span>に達し、個人用<span style="color:#0d3461;font-weight:700;">PC</span>やインターネットよりも速い普及速度を見せています。組織内での導入も<span style="color:#b0001e;font-weight:700;">88%</span>に上ります。<span style="color:#0d3461;font-weight:700;">Gartner</span>は、<span style="color:#b0001e;font-weight:700;">2026年末</span>までに企業アプリケーションの<span style="color:#b0001e;font-weight:700;">40%</span>がタスク特化型<span style="color:#0d3461;font-weight:700;">AIエージェント</span>を内蔵すると予測しており、前年の<span style="color:#b0001e;font-weight:700;">5%</span>未満から大幅な増加となります。これは、<span style="color:#0d3461;font-weight:700;">AI</span>が急速に社会の中核に入り込んでいることを示しています。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">LLM選定の新たな視点</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">2026年、最適LLMは</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">「失敗パターン」で選ぶ</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>における企業向けの<span style="color:#0d3461;font-weight:700;">LLM</span>選定は、「どのモデルが最も賢いか」という単純な問いから、「特定のワークフローでどのモデルが最も失敗しにくいか」という実践的な視点へと変化しています。<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>といった主要モデルは、それぞれ異なる得意分野を持ちます。<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>は長文コンテキストの法務・コード分析に優れ、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>はマルチモーダル推論でリード、<span style="color:#0d3461;font-weight:700;">GPT-4o</span>は最も安定した汎用モデルとしての地位を確立しています。実世界でのパフォーマンスは、抽象的なベンチマークよりも、コンテキストウィンドウの長さ、トークン価格、推論速度、そしてモデルの信頼性に大きく依存します。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">国家戦略としてのAI</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">米政府、AI研究に</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">50億ドル超を投入</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">米政府は、<span style="color:#b0001e;font-weight:700;">15以上</span>の連邦機関に対し<span style="color:#b0001e;font-weight:700;">50億ドル以上</span>を投じ、<span style="color:#0d3461;font-weight:700;">AI</span>を国家科学研究に組み込むことを決定しました。これは、<span style="color:#0d3461;font-weight:700;">AI</span>、ライフサイエンス、エネルギー、半導体、防衛企業に対する新たな連邦需要とパートナーシップの機会を示唆しています。特に医学分野では、<span style="color:#0d3461;font-weight:700;">AI</span>の導入が急速に進んでおり、臨床文書作成、医療画像処理、診断推論でその効果を発揮しています。製薬研究では、<span style="color:#b0001e;font-weight:700;">2026年</span>は<span style="color:#0d3461;font-weight:700;">AI</span>が不可欠な年とされており、複雑な薬剤候補の計算評価が日常的に行われています。<span style="color:#0d3461;font-weight:700;">ホワイトハウス</span>と<span style="color:#0d3461;font-weight:700;">HHS</span>は、臨床<span style="color:#0d3461;font-weight:700;">AI</span>のベンチマークと評価に関する合意原則を策定するための専門家会合も開催しています。</p></div></foreignObject>
