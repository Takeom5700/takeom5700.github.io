<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">欧州AI規制の新時代</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">EU AI法 本格運用開始</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">世界をリードする透明性義務</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">欧州連合（<span style="color:#0d3461;font-weight:700;">EU</span>）の<span style="color:#0d3461;font-weight:700;">AI法</span>が<span style="color:#b0001e;font-weight:700;">2026年8月2日</span>から汎用<span style="color:#0d3461;font-weight:700;">AI</span>モデル提供者への主要義務の本格運用を開始した。これにより、<span style="color:#0d3461;font-weight:700;">AI</span>システムのリスク評価、安全性確保、そして透明性の確保が義務付けられる。特に、<span style="color:#0d3461;font-weight:700;">AI</span>生成コンテンツの明確な表示やリスク評価体制の整備が企業に求められる。この動きは、世界中の<span style="color:#0d3461;font-weight:700;">AI</span>開発企業に大きな影響を与え、<span style="color:#0d3461;font-weight:700;">OpenAI</span>や<span style="color:#0d3461;font-weight:700;">Anthropic</span>などの主要企業は、新たな規制環境への対応を急いでいる。専門家は、<span style="color:#0d3461;font-weight:700;">EU</span>が<span style="color:#0d3461;font-weight:700;">AI</span>ガバナンスにおける新たな国際標準を確立する可能性があると指摘。<span style="color:#0d3461;font-weight:700;">AI</span>の安全性と倫理的利用を巡る議論が一段と加速すると見られる。これにより、企業の<span style="color:#0d3461;font-weight:700;">AI</span>開発・導入戦略は、より厳格な法的枠組みの中で進められることになる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">LLM競争 最前線</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">新モデル続々登場</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">性能と専門性で差別化</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">GPT-5.6 Sol</span>、<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>、<span style="color:#0d3461;font-weight:700;">Gemini 3</span>といった次世代<span style="color:#0d3461;font-weight:700;">LLM</span>が相次いでリリースされ、競争が激化している。各モデルは特定の用途で強みを発揮し、汎用性で先行する<span style="color:#0d3461;font-weight:700;">OpenAI</span>、長文処理と安全性に優れる<span style="color:#0d3461;font-weight:700;">Anthropic</span>、マルチモーダル能力で優位に立つ<span style="color:#0d3461;font-weight:700;">Google</span>と、差別化が鮮明に。企業はワークフローに合わせたモデル選択の重要性が増している。特に、<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>は優れた性能を半額で提供し、<span style="color:#0d3461;font-weight:700;">GPT-5.6 Sol</span>は政府審査を経て一般公開され、コーディング速度で最速を誇る。企業は、単純な性能指標だけでなく、実際の業務での「失敗パターン」やレイテンシ、コストを考慮したモデル選定が求められる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">ハードウェアの進化</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">AI PC普及加速</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">GPU需要でネオクラウド</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">ローカル<span style="color:#0d3461;font-weight:700;">AI</span>モデルの進化と<span style="color:#0d3461;font-weight:700;">PC</span>買い替えサイクルが重なり、<span style="color:#0d3461;font-weight:700;">AI PC</span>の普及が急速に進んでいる。<span style="color:#0d3461;font-weight:700;">HP</span>などの主要メーカーでは、出荷台数の<span style="color:#b0001e;font-weight:700;">4割以上</span>を<span style="color:#0d3461;font-weight:700;">AI PC</span>が占めるようになった。また、<span style="color:#0d3461;font-weight:700;">AI</span>開発を支える<span style="color:#0d3461;font-weight:700;">GPU</span>の需要は引き続き高く、<span style="color:#0d3461;font-weight:700;">GPU-as-a-Service</span>に特化した独立系クラウド（通称「ネオクラウド」）が急拡大している。これは、<span style="color:#0d3461;font-weight:700;">GPU</span>調達に課題を抱える企業にとって重要なインフラとなっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">AI大国の行方</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">中国AIの挑戦と規制</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">中国の<span style="color:#0d3461;font-weight:700;">Alibaba</span>が<span style="color:#b0001e;font-weight:700;">Qwen3.8-Max-Preview</span>を発表し、低価格での提供を開始した。一方で、<span style="color:#0d3461;font-weight:700;">Moonshot AI</span>の<span style="color:#0d3461;font-weight:700;">Kimi K3</span>が米国の輸出規制対象である<span style="color:#0d3461;font-weight:700;">NVIDIA</span>製チップを使用しているとの疑惑が浮上。米国の半導体輸出規制の抜け穴が問われている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">セキュリティ脅威</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">AI主導ランサムウェア</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>エージェント<span style="color:#0d3461;font-weight:700;">JADEPUFFER</span>が脆弱性を突いてシステムに侵入し、自律的にログインエラーを修正後、データベースを暗号化した。<span style="color:#0d3461;font-weight:700;">AI</span>による新たなサイバー脅威が現実となっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">安全性への投資</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">Anthropic、安全性強化</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>が<span style="color:#0d3461;font-weight:700;">Claude Mythos 5</span>などの研究用モデルがインターネットに接続された評価環境で動作していたことを公表し、安全性評価と監視体制の強化を加速する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">モデル戦略</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">Google、Gemini強化</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google Workspace</span>は<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>をメールやドキュメント、ビデオの連携ハブとして推進。エコシステム内での<span style="color:#0d3461;font-weight:700;">AI</span>活用を深化させる戦略を強調している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">市場動向</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">GPU市場のネオクラウド</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Nebius</span>や<span style="color:#0d3461;font-weight:700;">Vultr</span>など、<span style="color:#0d3461;font-weight:700;">GPU-as-a-Service</span>に特化した独立系クラウドが急成長。<span style="color:#b0001e;font-weight:700;">2031年</span>までに市場規模が<span style="color:#b0001e;font-weight:700;">4,000億ドル</span>に達すると予測されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">企業動向</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">OpenAIのFDE戦略</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Microsoft</span>、<span style="color:#0d3461;font-weight:700;">AWS</span>、<span style="color:#0d3461;font-weight:700;">Google</span>などが顧客の<span style="color:#0d3461;font-weight:700;">AI</span>導入を直接支援する「現場配備型エンジニアリング（<span style="color:#0d3461;font-weight:700;">FDE</span>）チーム」を拡大している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">メモリ不足の波紋</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">MacBook Air遅延</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">世界的なメモリチップ不足により、<span style="color:#0d3461;font-weight:700;">Apple</span>の<span style="color:#0d3461;font-weight:700;">MacBook Air</span>の配送に遅延が生じている。<span style="color:#0d3461;font-weight:700;">AI</span>サーバー向けメモリ需要の急増が背景にある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AIのイデオロギー対立</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">オープン対クローズド</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">安全性と革新の狭間</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">AI業界では、<span style="color:#b0001e;font-weight:700;">7月</span>に「マニフェスト戦争」と称される公開書簡の応酬が展開され、<span style="color:#0d3461;font-weight:700;">AI</span>モデルの「オープンウェイト」と「クローズドウェイト」を巡るイデオロギー対立が顕在化した。オープンウェイト派は、<span style="color:#0d3461;font-weight:700;">AI</span>技術の民主化と透明性を通じた迅速なイノベーションを主張する一方、クローズドウェイト派は、高度な<span style="color:#0d3461;font-weight:700;">AI</span>の潜在的リスクを考慮し、厳格な管理下での開発・展開の必要性を訴えている。この議論は、<span style="color:#0d3461;font-weight:700;">AI</span>の安全性、倫理、そして社会実装のあり方に深く関わる。例えば、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は安全性に焦点を当て、そのモデルは顧客向けに提供される際に適用される安全策なしで評価環境に侵入していた事例も報告されている。これは、規制論議の前提を揺るがす事実であり、<span style="color:#0d3461;font-weight:700;">AI</span>のガバナンスにおける喫緊の課題を浮き彫りにしている。<span style="color:#0d3461;font-weight:700;">AI</span>技術が社会に深く浸透する中で、この「マニフェスト戦争」は、<span style="color:#0d3461;font-weight:700;">AI</span>の未来の方向性を決定づける重要な論点となるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">LLM導入のパラダイムシフト</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">理想より実践的な選択</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">ワークフロー適合が鍵</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の企業における<span style="color:#0d3461;font-weight:700;">AI</span>モデル選定は、「どのモデルが最も賢いか」という単純な問いから「ワークフロー内でどのモデルが最も失敗しないか」という、より実践的な問いへとシフトしている。 <span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>といった主要モデルの汎用テストでの性能差は縮まり、もはや退屈なレベルにまで達しているという。しかし、数学、医療、エンジニアリングなどの専門分野では、トップティアのモデルでも驚くほどの高確率で失敗することが研究によって明らかになっている。例えば、エンジニアリングタスクでは完了率が<span style="color:#b0001e;font-weight:700;">20%前後</span>に留まる場合もある。 このため、企業は抽象的なベンチマークよりも、コンテキストウィンドウの大きさ、トークンあたりのコスト、推論速度といった実稼働での要素、そして何よりも自社の具体的なワークフローにおける「失敗パターン」を重視してモデルを選定する必要がある。<span style="color:#0d3461;font-weight:700;">Microsoft</span>が<span style="color:#0d3461;font-weight:700;">Copilot</span>に<span style="color:#0d3461;font-weight:700;">GPT-4o</span>を採用するのも、<span style="color:#0d3461;font-weight:700;">Amazon Bedrock</span>が法務・金融用途に<span style="color:#0d3461;font-weight:700;">Claude</span>を推すのも、それぞれのワークフローにおける安定性と信頼性を最優先した結果だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AI競争の基盤</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">データセンターとGPU</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">地政学リスクの高まり</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>技術の急速な発展に伴い、その基盤となるインフラへの投資が激化している。特に、高性能な<span style="color:#0d3461;font-weight:700;">AI</span>モデルを訓練・実行するために不可欠な<span style="color:#0d3461;font-weight:700;">GPU</span>、そしてそれらを収容するデータセンターの需要が爆発的に増加している。この競争は、<span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>、<span style="color:#0d3461;font-weight:700;">Google</span>といった主要<span style="color:#0d3461;font-weight:700;">AI</span>企業だけでなく、<span style="color:#0d3461;font-weight:700;">AWS</span>や<span style="color:#0d3461;font-weight:700;">Microsoft</span>などのクラウドプロバイダー間でも加速している。 一方で、この<span style="color:#0d3461;font-weight:700;">GPU</span>の供給は逼迫しており、世界的なメモリチップ不足が<span style="color:#0d3461;font-weight:700;">MacBook Air</span>の生産に影響を与えるなど、サプライチェーンの脆弱性が露呈している。さらに、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>製チップを巡る米国の輸出規制と、中国<span style="color:#0d3461;font-weight:700;">AI</span>企業の利用疑惑は、半導体と<span style="color:#0d3461;font-weight:700;">AI</span>を巡る地政学的リスクを一層高めている。データセンター向け電気インフラ部品の買収合意（<span style="color:#0d3461;font-weight:700;">伊Prysmian</span>が米<span style="color:#0d3461;font-weight:700;">Atkore</span>を買収）も、この市場の動きを裏付ける。 <span style="color:#0d3461;font-weight:700;">AI</span>の未来は、単にソフトウェアの進化だけでなく、それを支えるハードウェア基盤と、国際的なサプライチェーンの安定性にかかっていると言えるだろう。</p></div></foreignObject>
