<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">宇宙AI競争、新時代へ</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">Google、AIチップを宇宙へ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">軌道上データセンター構想始動</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">Google</span>は<span style="color:#b0001e;font-weight:700;">10月1日</span>、独自の<span style="color:#0d3461;font-weight:700;">AI</span>プロセッサを搭載した衛星を低地球軌道に打ち上げると発表した。これは「<span style="color:#0d3461;font-weight:700;">Project Suncatcher</span>」計画の一環で、宇宙空間でのチップの耐久性をテストし、将来的な宇宙ベース<span style="color:#0d3461;font-weight:700;">AI</span>データセンターの構築を目指すものだ。この動きは、<span style="color:#0d3461;font-weight:700;">Elon Musk</span>氏率いる<span style="color:#0d3461;font-weight:700;">SpaceX</span>や<span style="color:#0d3461;font-weight:700;">Blue Origin</span>といった競合他社に先駆けて、<span style="color:#0d3461;font-weight:700;">Google</span>が宇宙<span style="color:#0d3461;font-weight:700;">AI</span>競争で一歩リードしたことを意味する。衛星は<span style="color:#0d3461;font-weight:700;">SpaceX Falcon 9</span>に搭載され、<span style="color:#0d3461;font-weight:700;">Google</span>の野心的な計画の初のハードウェアテストとなる。競合各社が大規模な衛星計画で<span style="color:#0d3461;font-weight:700;">FCC</span>の審査を待つ中、<span style="color:#0d3461;font-weight:700;">Google</span>は実証段階へ移行。宇宙環境下での安定稼働は、地球上の<span style="color:#0d3461;font-weight:700;">AI</span>インフラへの依存度を低減し、新たなデータ処理能力をもたらす可能性を秘めている。この試みが成功すれば、<span style="color:#0d3461;font-weight:700;">AI</span>技術の利用範囲は宇宙へと大きく広がるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">AI安全性、業界主導で強化</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">米AI大手6社 自主的協定</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">Copilotは全面刷新へ</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>、<span style="color:#0d3461;font-weight:700;">Meta</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">xAI</span>、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>の米主要<span style="color:#b0001e;font-weight:700;">6社</span>は、「自主的<span style="color:#0d3461;font-weight:700;">AI</span>協定（<span style="color:#0d3461;font-weight:700;">Voluntary AI Accord</span>）」に合意した。この協定は、<span style="color:#0d3461;font-weight:700;">AI</span>モデル訓練中の監視強化や第三者監査の受け入れを柱とし、生成<span style="color:#0d3461;font-weight:700;">AI</span>の安全運用フェーズへの移行を加速させるものだ。同時に、<span style="color:#0d3461;font-weight:700;">Microsoft</span>は<span style="color:#0d3461;font-weight:700;">Copilot</span>のブランドと製品アーキテクチャを全面刷新し、<span style="color:#0d3461;font-weight:700;">OS</span>や業務ツール群との統合を一層強化。企業の業務自動化推進に向け、安全要件と統合ツールの両面からのアプローチが進行している。この動きは、<span style="color:#0d3461;font-weight:700;">AI</span>の信頼性と実用性を高める上で重要な一歩となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">消費者保護、厳格化へ</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">米FTC、AI大手調査着手</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">潜在的危険性に注視</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">米国の<span style="color:#0d3461;font-weight:700;">連邦取引委員会</span>（<span style="color:#0d3461;font-weight:700;">FTC</span>）は、<span style="color:#0d3461;font-weight:700;">OpenAI</span>や<span style="color:#0d3461;font-weight:700;">Anthropic</span>などの大手<span style="color:#0d3461;font-weight:700;">AI</span>企業を対象に、<span style="color:#0d3461;font-weight:700;">AI</span>が消費者に及ぼす潜在的な危険性について業界横断的な調査を開始した。この調査は数週間前から進行していたが、最近発生した<span style="color:#0d3461;font-weight:700;">OpenAI</span>の開発者サイトへの大規模攻撃を受けて、問題の緊急性が高まったとされている。<span style="color:#0d3461;font-weight:700;">FTC</span>は今後、<span style="color:#0d3461;font-weight:700;">AI</span>企業に文書提出を求め、幹部らからの証言聴取を進める見込みで、消費者保護の観点から<span style="color:#0d3461;font-weight:700;">AI</span>規制が厳格化する動きが加速する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">サイバー防御、新兵器</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">Google「Gemini 4 Argon」発表</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">専門家向け限定提供</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は、新たな高性能<span style="color:#0d3461;font-weight:700;">AI</span>モデル「<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>」を発表した。まずは信頼できる少数のサイバー防御担当者向けに提供が始まる。<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>は、ソフトウェア開発や金融、法務といった複雑かつ長時間にわたる作業に対応するよう設計されており、前世代モデルから約<span style="color:#b0001e;font-weight:700;">1年</span>での主力発表となる。専門分野での<span style="color:#0d3461;font-weight:700;">AI</span>活用を一段と推進する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">市場予測</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">生成AI市場2.3兆ドルへ</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">生成<span style="color:#0d3461;font-weight:700;">AI</span>市場は<span style="color:#b0001e;font-weight:700;">2032年</span>までに<span style="color:#b0001e;font-weight:700;">2.3兆ドル</span>に達すると予測されており、テクノロジー総支出の<span style="color:#b0001e;font-weight:700;">22%</span>を占める見込みだ。エージェントシステムが実験段階から企業導入へ移行する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">産業動向</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">AIブームで部品不足</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>も<span style="color:#0d3461;font-weight:700;">AI</span>インフラ投資の急増により、メモリや部品の供給不足が続いている。業界全体で深刻な問題となっており、価格上昇にも影響。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">Claude Opus 5.5が優勢</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>の「<span style="color:#0d3461;font-weight:700;">Claude Opus 5.5</span>」が評価を大きく上げ、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の「<span style="color:#0d3461;font-weight:700;">Astra</span>」から勢いを奪っている。競争の潮目が急速に変化している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">OpenAI動向</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">新モデル発表見送り</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は安全性の懸念から、新しい<span style="color:#0d3461;font-weight:700;">AI</span>モデルのリリースを見送った。同社は「基準を完全に満たさなかった」と説明。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">新サービス</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">ELNET AIが正式開始</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ELNET</span>と<span style="color:#0d3461;font-weight:700;">NTTドコモビジネス</span>は<span style="color:#b0001e;font-weight:700;">10月1日</span>、法人向け生成<span style="color:#0d3461;font-weight:700;">AI</span>サービス「<span style="color:#0d3461;font-weight:700;">ELNET AI</span>」を正式リリース。新聞記事を活用した情報整理を支援する。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">Claude、GPT、Gemini</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">三つ巴の進化、適材適所へ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>における<span style="color:#0d3461;font-weight:700;">大規模言語モデル</span>（<span style="color:#0d3461;font-weight:700;">LLM</span>）の競争は激化の一途を辿っている。<span style="color:#0d3461;font-weight:700;">OpenAI</span>は「<span style="color:#0d3461;font-weight:700;">GPT-6.1 Sol</span>」、<span style="color:#0d3461;font-weight:700;">Anthropic</span>は「<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5.5</span>」と高性能な「<span style="color:#0d3461;font-weight:700;">Opus 5.5</span>」、そして<span style="color:#0d3461;font-weight:700;">Google</span>は「<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>」をそれぞれ展開し、各社が「究極の<span style="color:#0d3461;font-weight:700;">LLM</span>」の座を巡って投資を加速させている。特に<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>は、先進的な推論能力とエージェント機能に加え、競争力のある価格設定で注目を集めている。顧客体験、運用効率、コスト、リスクとコンプライアンス、スケーラビリティといったビジネス上の重要指標に直結するため、どのモデルを選択するかは単なる技術的詳細に留まらない戦略的コミットメントとなっている。企業は、全体ランキングに加え、コーディングやエージェント機能、特定のユースケースに最適なモデルを慎重に選ぶ必要があり、実用的な導入に向けて各社の強みが活かされる適材適所の時代へと進んでいる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">ビジネスとAI</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">AI PC普及元年、企業導入加速</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">高性能化と効率化を両立</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>は<span style="color:#0d3461;font-weight:700;">AI PC</span>の普及が本格化する年として注目されている。調査によると、企業の<span style="color:#b0001e;font-weight:700;">21%</span>が今後<span style="color:#b0001e;font-weight:700;">12ヶ月以内</span>に<span style="color:#0d3461;font-weight:700;">AI PC</span>を導入する計画があるという。データ管理とセキュリティを両立しながら、<span style="color:#0d3461;font-weight:700;">AI</span>とデジタルトランスフォーメーションを推進する需要が高まっている背景がある。<span style="color:#0d3461;font-weight:700;">Microsoft</span>の<span style="color:#b0001e;font-weight:700;">13インチ</span><span style="color:#0d3461;font-weight:700;">Surface Pro</span>や<span style="color:#0d3461;font-weight:700;">Snapdragon X2</span>搭載の<span style="color:#0d3461;font-weight:700;">Surface Laptop</span>、<span style="color:#0d3461;font-weight:700;">Lenovo</span>の<span style="color:#0d3461;font-weight:700;">ThinkPad X13</span>や<span style="color:#0d3461;font-weight:700;">L14</span>、<span style="color:#0d3461;font-weight:700;">Dell Technologies</span>の<span style="color:#b0001e;font-weight:700;">Pro 5</span>シリーズ、<span style="color:#0d3461;font-weight:700;">HP</span>の<span style="color:#0d3461;font-weight:700;">ZBook</span>ワークステーションなど、企業向けの新モデルが続々と市場に投入されている。これら<span style="color:#0d3461;font-weight:700;">AI</span>搭載デバイスは、業務の効率化と生産性向上に貢献し、企業の<span style="color:#0d3461;font-weight:700;">DX</span>を加速させる重要なツールとなることが期待されている。高性能化が進む<span style="color:#0d3461;font-weight:700;">AI PC</span>は、データ分析、コンテンツ生成、自動化といった領域でビジネスに革新をもたらすだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AIの未来を巡る議論</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AI安全性か、経済成長か</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">米政界で規制論争続く</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>の安全性と規制を巡る議論が、米政界で活発に続いている。一部の政治家は<span style="color:#0d3461;font-weight:700;">AI</span>開発の制限を支持する一方、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>の<span style="color:#0d3461;font-weight:700;">Jensen Huang</span><span style="color:#0d3461;font-weight:700;">CEO</span>や元<span style="color:#0d3461;font-weight:700;">Trump</span>政権の<span style="color:#0d3461;font-weight:700;">AI</span>・暗号通貨担当責任者であった<span style="color:#0d3461;font-weight:700;">David Sacks</span>氏らは「終末論的なシナリオ」を否定し、<span style="color:#0d3461;font-weight:700;">AI</span>がもたらす経済的利益を強調している。<span style="color:#0d3461;font-weight:700;">Trump</span>大統領自身も、<span style="color:#0d3461;font-weight:700;">AI</span>が人類を危険に晒すという懸念を「でっち上げ」と一蹴し、<span style="color:#0d3461;font-weight:700;">AI</span>ブームによる経済効果を称賛。<span style="color:#0d3461;font-weight:700;">Trump</span>氏と<span style="color:#0d3461;font-weight:700;">Mike Johnson</span>下院議長は、<span style="color:#0d3461;font-weight:700;">Anthropic</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Google</span>、<span style="color:#0d3461;font-weight:700;">Meta</span>などの主要<span style="color:#0d3461;font-weight:700;">AI</span>企業幹部と会合を持つ予定で、<span style="color:#0d3461;font-weight:700;">AI</span>の将来像を巡る議論はさらに深まるだろう。安全性と技術革新のバランスをどう取るかが、今後の政策決定の焦点となる。</p></div></foreignObject>
