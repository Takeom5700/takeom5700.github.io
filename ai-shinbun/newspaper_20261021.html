<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">国家戦略</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">中国が「国家データ集団」を設立</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">AI発展とデジタル経済を加速</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">中国は<span style="color:#0d3461;font-weight:700;">雄安新区</span>に「<span style="color:#0d3461;font-weight:700;">国家データ集団</span>」を正式に発足させた。<span style="color:#0d3461;font-weight:700;">習近平</span>国家主席を核心とする<span style="color:#0d3461;font-weight:700;">中国共産党中央委員会</span>の主要な戦略的決定として、データ資源の開発と活用を加速し、デジタル経済を強化、<span style="color:#0d3461;font-weight:700;">AI</span>分野での国の野心を支援する狙いがある。これにより、中央政府直轄の国有企業は<span style="color:#b0001e;font-weight:700;">100社</span>となった。<span style="color:#0d3461;font-weight:700;">丁薛祥副総理</span>は、<span style="color:#0d3461;font-weight:700;">デジタル中国</span>の構築を加速し、新たな競争優位性を築くための努力を呼びかけた。<span style="color:#0d3461;font-weight:700;">国家データ集団</span>は、世界クラスのデータ技術企業を目指し、開発とセキュリティのバランスを取りながら、データ関連サービスを拡大、データインフラの構築を加速し、中核技術でのブレークスルーを図る。<span style="color:#b0001e;font-weight:700;">2026年10月20日</span>に就任式が行われた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">次世代モデル</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">Inception「Mercury 3」発表</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">拡散型LLMが高速・大容量化</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#0d3461;font-weight:700;">Inception</span>は<span style="color:#b0001e;font-weight:700;">10月19日</span>、拡散型大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）「<span style="color:#0d3461;font-weight:700;">Mercury 3</span>」を発表した。初代<span style="color:#0d3461;font-weight:700;">Mercury</span>の<span style="color:#b0001e;font-weight:700;">40倍</span>を超える総パラメーター数を持ちながら、<span style="color:#0d3461;font-weight:700;">NVIDIA</span>製<span style="color:#0d3461;font-weight:700;">GPU</span>上で毎秒<span style="color:#b0001e;font-weight:700;">1,068トークン</span>という高速生成を達成したという。一度に処理できるコンテキスト長も前世代の<span style="color:#b0001e;font-weight:700;">26万トークン</span>から<span style="color:#b0001e;font-weight:700;">100万トークン</span>へ拡大。従来の自己回帰方式とは異なり、文章のまとまりを並列に生成・修正する「拡散方式」を採用していることが、この高速化を可能にした。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">米中AI摩擦</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">米政府、DeepSeek製品排除へ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">情報流出懸念で対中警戒強化</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#0d3461;font-weight:700;">米国トランプ政権</span>は<span style="color:#b0001e;font-weight:700;">10月20日</span>、中国の<span style="color:#0d3461;font-weight:700;">AI</span>企業<span style="color:#0d3461;font-weight:700;">DeepSeek</span>の製品・サービスを連邦政府機関から排除する命令を公表した。情報流出への懸念が理由で、既存導入製品も削除対象となる。この命令は<span style="color:#b0001e;font-weight:700;">7月24日</span>付で既に出ており、米中間での<span style="color:#0d3461;font-weight:700;">AI</span>分野の技術覇権争いが激化する中、中国製<span style="color:#0d3461;font-weight:700;">AI</span>への警戒を一段と強める形だ。<span style="color:#0d3461;font-weight:700;">国土安全保障省</span>は、中国の法律が政府による民間企業システムへのアクセスを認めている点を問題視している。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">音声生成AI</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">マルチトラックで多様な音源生成</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span>マルチモーダル<span style="color:#0d3461;font-weight:700;">AI</span>企業<span style="color:#0d3461;font-weight:700;">NC AI</span>は<span style="color:#b0001e;font-weight:700;">10月20日</span>、生成<span style="color:#0d3461;font-weight:700;">AI</span>音源制作プラットフォーム「<span style="color:#0d3461;font-weight:700;">VARCO Sound</span>」を正式リリースした。テキスト、画像、動画からオーディオ生成・編集が可能で、開発者やプロデューサーの創造性を支援。特別割引プロモーションも実施中。</span></p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">Ellice株価急落、AI投資に波紋</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#0d3461;font-weight:700;">AI</span>企業<span style="color:#0d3461;font-weight:700;">Ellice</span>の株価が<span style="color:#b0001e;font-weight:700;">32%</span>急落。個社ニュースがセクター全体に波及し、<span style="color:#0d3461;font-weight:700;">CoreWeave</span>など他社株にも一時影響を与え、<span style="color:#0d3461;font-weight:700;">AI</span>投資センチメントの敏感さを示した。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">サイバー脅威</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">中国製AI「ARTEX」で日本企業攻撃</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#0d3461;font-weight:700;">GMOインターネットグループ</span>傘下企業が、日本企業へのサイバー攻撃に中国製<span style="color:#0d3461;font-weight:700;">AI</span>ツール「<span style="color:#0d3461;font-weight:700;">ARTEX</span>」が使用されたことを確認したと発表。数十社が被害に。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">防災テクノロジー</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">台湾、地震被害評価AIを開発</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span>台湾の研究者らが、地震被害を評価し構造物の耐震係数を測定する<span style="color:#0d3461;font-weight:700;">AI</span>ツールを開発。国内外の<span style="color:#b0001e;font-weight:700;">8000枚</span>の建物被害画像で訓練された。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">開発コスト</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">DeepSeek V3を低コストで訓練</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#0d3461;font-weight:700;">DeepSeek</span>が最先端<span style="color:#0d3461;font-weight:700;">AI</span>「<span style="color:#0d3461;font-weight:700;">V3</span>」を約<span style="color:#b0001e;font-weight:700;">8億円</span>で訓練し、業界常識を破る低コスト化を実現したと報じられた。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">Nvidia戦略</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">Nvidia、オープンソース・デバイス上AI強化</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#0d3461;font-weight:700;">Nvidia</span>は新しい<span style="color:#0d3461;font-weight:700;">AI</span>モデル戦略としてオープンソースとデバイス上展開を強化。ユーザーの柔軟性向上とデータプライバシー確保を目指す。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">LLM競争</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">GPT, Claude, Geminiの競争激化</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#0d3461;font-weight:700;">GPT</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>、<span style="color:#0d3461;font-weight:700;">Gemini</span>など主要<span style="color:#0d3461;font-weight:700;">LLM</span>の競争が激化。<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>、<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>、<span style="color:#0d3461;font-weight:700;">Gemini 3</span>が各分野で優位性を競う。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">LLM動向分析</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">進化するLLM群雄割拠</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">GPT、Claude、Geminiの現在地と未来</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#b0001e;font-weight:700;">2026年</span>、大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）市場はかつてない競争時代を迎えている。<span style="color:#0d3461;font-weight:700;">OpenAI</span>の「<span style="color:#0d3461;font-weight:700;">GPT-4o</span>」は幅広いエコシステムとユーザーベースで優位に立ち、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の「<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>」は安全性と推論能力で高い評価を得ている。<span style="color:#0d3461;font-weight:700;">Google</span>の「<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>」は<span style="color:#b0001e;font-weight:700;">100万トークン</span>のコンテキストウィンドウとマルチモーダルタスク処理で先行する。これらのモデルはそれぞれ異なる強みを持ち、企業はレイテンシ、コスト、ツール連携、コンプライアンスを考慮して選択する必要がある。年末にかけては「<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>」、「<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>」、「<span style="color:#0d3461;font-weight:700;">Gemini 3</span>」といった次世代モデルが登場し、性能競争はさらに激化する見込みだ。<span style="color:#0d3461;font-weight:700;">LLM</span>は顧客体験から業務効率、リスク管理に至るまで、ビジネスのあらゆる側面に影響を与えるため、その選択は企業の戦略的コミットメントとなる。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">地政学とAI</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">高まる米中AI技術覇権争い</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">サイバー攻撃から産業基盤まで</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span><span style="color:#b0001e;font-weight:700;">2026年</span>の<span style="color:#b0001e;font-weight:700;">10月</span>に入り、<span style="color:#0d3461;font-weight:700;">AI</span>を巡る米中間の技術覇権争いが新たな局面を迎えている。<span style="color:#0d3461;font-weight:700;">米国トランプ政権</span>は、情報流出の懸念から中国の<span style="color:#0d3461;font-weight:700;">AI</span>企業<span style="color:#0d3461;font-weight:700;">DeepSeek</span>の製品・サービスを連邦政府調達から排除する命令を発出した。これは中国の法律が政府による民間企業システムへのアクセスを許容していることに起因する。同時に、日本企業へのサイバー攻撃に中国製の<span style="color:#0d3461;font-weight:700;">AI</span>ツール「<span style="color:#0d3461;font-weight:700;">ARTEX</span>」が使用されたことが確認され、<span style="color:#0d3461;font-weight:700;">AI</span>が国家安全保障上の脅威となりうる現実が浮き彫りになった。一方、中国は「<span style="color:#0d3461;font-weight:700;">国家データ集団</span>」を設立し、データ資源の戦略的活用と<span style="color:#0d3461;font-weight:700;">AI</span>発展を国家主導で加速する。この動きは、<span style="color:#0d3461;font-weight:700;">AI</span>技術が経済的競争力だけでなく、地政学的な優位性を左右する重要な要素となっていることを示唆している。両国の<span style="color:#0d3461;font-weight:700;">AI</span>リスク協調の必要性が叫ばれる一方で、技術とデータの管理を巡る緊張は高まる一方だ。</span></p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">新アーキテクチャ</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">拡散型LLMの可能性と課題</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">高速生成とコスト効率の新たな地平</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span>大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）の開発競争は、モデル規模の拡大だけでなく、新しいアーキテクチャの探求にも及んでいる。<span style="color:#0d3461;font-weight:700;">Inception</span>が<span style="color:#b0001e;font-weight:700;">10月19日</span>に発表した「<span style="color:#0d3461;font-weight:700;">Mercury 3</span>」は、その典型的な例だ。従来の自己回帰型とは異なり、文章のまとまりを並列で生成・修正する「拡散方式」を採用することで、総パラメーター数が<span style="color:#b0001e;font-weight:700;">40倍</span>以上になっても、毎秒<span style="color:#b0001e;font-weight:700;">1,068トークン</span>という驚異的な生成速度を維持している。この種のモデルは、<span style="color:#0d3461;font-weight:700;">AI</span>エージェントのようにモデルを繰り返し呼び出すアプリケーションにおいて、処理時間の劇的な短縮に貢献する可能性がある。さらに、中国の<span style="color:#0d3461;font-weight:700;">DeepSeek</span>が「<span style="color:#0d3461;font-weight:700;">V3</span>」を約<span style="color:#b0001e;font-weight:700;">8億円</span>という低コストで訓練した との報道もあり、高速化と同時にコスト効率の改善も進む。しかし、公称性能が実際のアプリケーションの応答速度や運用コストにどれだけ反映されるかは、利用条件によって異なり、導入時の重要な検討事項となる。</span></p></div></foreignObject>
