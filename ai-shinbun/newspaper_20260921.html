<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AI経済と国際規制</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">世界AI支出2.7兆ドルへ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">国連、国際連携を強化</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">米国の<span style="color:#0d3461;font-weight:700;">ガートナー</span>は<span style="color:#b0001e;font-weight:700;">2026年</span>の世界<span style="color:#0d3461;font-weight:700;">AI</span>支出総額が前年比<span style="color:#b0001e;font-weight:700;">49.5%</span>増の<span style="color:#b0001e;font-weight:700;">2兆7000億ドル</span>に達する見通しを発表した。AIインフラとエージェントへの投資加速が背景にあるという。一方、急速な<span style="color:#0d3461;font-weight:700;">AI</span>進化に伴うリスク増大を受け、<span style="color:#0d3461;font-weight:700;">国連</span>は<span style="color:#b0001e;font-weight:700;">AI</span>ガバナンスにおける国際連携の必要性を強調。アントロピックの元研究者の警告を受け、国連事務総長<span style="color:#0d3461;font-weight:700;">アントニオ・グテーレス氏</span>は「国家的な行動は不可欠だが、地球規模の調整が不可欠」と述べ、安全なデジタル未来のための共通原則とコミットメントの採用を各国に促している。各国は<span style="color:#0d3461;font-weight:700;">AI</span>技術の共通理解を深め、安全、人権、アクセス格差といった課題への対応に向けた協議を進めている段階だ。規制の枠組み作りで、業界と政府の連携が注目される。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">技術と倫理の狭間</p><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">AI</span>の軍事利用や監視システムへの応用、サイバー攻撃への悪用リスクなど、倫理的な側面での議論も活発化している。<span style="color:#0d3461;font-weight:700;">国連</span>は、これらの課題に対応するため、各国の専門家や政策立案者が参加するフォーラムを設け、国際的な規範の策定を目指している。<span style="color:#0d3461;font-weight:700;">AI</span>技術の責任ある開発と利用に向けた世界的なコンセンサス形成が急がれる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">新AIモデル続々登場</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">アントロピック、悪用対策強化</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">新型モデル群を発表</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アントロピック</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>の悪用検出と対策に関する報告書を発表した。サイバー作戦、監視作戦、影響力工作など、<span style="color:#b0001e;font-weight:700;">2025年12月</span>から<span style="color:#b0001e;font-weight:700;">2026年8月</span>までの事例を検証し、<span style="color:#0d3461;font-weight:700;">AI</span>の安全対策を強化した。同時に、<span style="color:#b0001e;font-weight:700;">2026年9月</span>には新たな<span style="color:#0d3461;font-weight:700;">AI</span>モデルのリリースが相次ぎ、急速な技術進歩が注目される。<span style="color:#0d3461;font-weight:700;">Claude Mythos 5.1</span>、<span style="color:#0d3461;font-weight:700;">Claude Fable 5.1</span>、<span style="color:#0d3461;font-weight:700;">Gemini 3.8 Flash</span>、<span style="color:#0d3461;font-weight:700;">GPT-6 Astra</span>などが含まれ、特にエージェントワークフローやサイバーセキュリティ機能が強化されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">LLM進化の最前線</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">2026年版主要モデル比較</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">特定用途で優位性</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の<span style="color:#0d3461;font-weight:700;">LLM</span>市場は、<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>、<span style="color:#0d3461;font-weight:700;">Gemini</span>、<span style="color:#0d3461;font-weight:700;">Llama</span>が主要なプレイヤーとなっている。<span style="color:#0d3461;font-weight:700;">Gemini</span>は大規模なコンテキストウィンドウ、<span style="color:#0d3461;font-weight:700;">Claude</span>は繊細な推論、<span style="color:#0d3461;font-weight:700;">Llama</span>はオープンソースの柔軟性で優位性を示す。ベンチマークだけでなく、特定のワークロード要件に基づいたモデル選択が重要。特に<span style="color:#0d3461;font-weight:700;">Claude</span>は、安全性と複雑な分析タスクで評価が高い。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">企業AI導入の壁</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">規制産業のAI加速課題</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">CMO/CIO連携不足</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Abacus</span>は、規制産業における<span style="color:#0d3461;font-weight:700;">AI</span>導入加速に向けた取り組みを開始した。実装支援、ガバナンス、ドメイン固有機能の統合に注力する。<span style="color:#0d3461;font-weight:700;">Acquia</span>の調査では、<span style="color:#0d3461;font-weight:700;">CMO</span>と<span style="color:#0d3461;font-weight:700;">CIO</span>間で<span style="color:#0d3461;font-weight:700;">AI</span>所有権とガバナンスに関する認識のズレが判明。<span style="color:#0d3461;font-weight:700;">CMO</span>の<span style="color:#b0001e;font-weight:700;">41%</span>しか、チームがガバナンスを組み込む能力に自信がないと回答した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">中国の巨大AI計算基盤</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">華為、100万プロセッサ統合へ</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">華為</span>が<span style="color:#b0001e;font-weight:700;">100万</span>規模のプロセッサを単一の計算機として統合する「<span style="color:#0d3461;font-weight:700;">Peerium Computing Architecture</span>」を発表。AI半導体競争はシステム全体の計算能力で競う時代へ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">OpenAI、AIの逸脱行動を公開</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">モデルのミスアライメント報告</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>が「<span style="color:#0d3461;font-weight:700;">Model Misalignment Reporting Framework</span>」を導入。AIが人間の意図から逸脱した行動事例を継続的に調査・公開する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">AI開発ペース調整を提言</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">アントロピックCEOが安全性訴え</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アントロピックCEO</span>が、<span style="color:#0d3461;font-weight:700;">AI</span>の急速な自己改善による安全上の脅威に対応するため、開発ペース抑制の<span style="color:#b0001e;font-weight:700;">3段階計画</span>を公表。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">生成AIのトークン課金問題</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">予算超過とコスト増深刻化</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">生成<span style="color:#0d3461;font-weight:700;">AI</span>や<span style="color:#0d3461;font-weight:700;">AI</span>エージェントの利用拡大で、トークン課金による想定外のコスト増が企業で深刻化。「<span style="color:#0d3461;font-weight:700;">AI</span>コーディングより人を雇う方が安い」時代か。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">国連事務総長が強調</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">AIリスクに国際協調不可欠</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アントニオ・グテーレス国連事務総長</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>の世界的リスクに対し「国家行動は必須だが、グローバルな協調が不可欠」と述べ、国際連携の強化を訴えた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">トランプ氏、AI規制に逆行</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">州法の制限停止を命令</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">トランプ氏</span>は<span style="color:#b0001e;font-weight:700;">昨年12月</span>、<span style="color:#0d3461;font-weight:700;">AI</span>を制限する州法を停止する大統領令に署名。連邦タスクフォースが州の規制に異議を唱える役割を担う。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">AI開発の光と影</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">超高速開発と業務システムの限界</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">人間の泥臭いプロセスが鍵</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">現代のシステム開発現場では、<span style="color:#0d3461;font-weight:700;">AI</span>による超高速開発が現実となっている。米<span style="color:#0d3461;font-weight:700;">アントロピック社</span>の「<span style="color:#0d3461;font-weight:700;">Claude Fable 5</span>」など高度な<span style="color:#0d3461;font-weight:700;">AI</span>モデルを活用し、従来<span style="color:#b0001e;font-weight:700;">3人</span>のエンジニアが<span style="color:#b0001e;font-weight:700;">1年</span>を要したアプリ開発を、わずか<span style="color:#b0001e;font-weight:700;">1週間</span>（実働<span style="color:#b0001e;font-weight:700;">16時間</span>）で完了させた事例も報告されている。しかし、この「<span style="color:#0d3461;font-weight:700;">AI駆動開発</span>」がすべての領域に適用できるわけではない。特に、不特定多数のアクターが関わり、リレーショナルデータベースの整合性と永続性が求められる業務システムにおいては、<span style="color:#0d3461;font-weight:700;">AI</span>による自動記述だけでは不十分であることが明らかになりつつある。数万行に及ぶコードのレビュー体制や、複数の立場からの更新リクエストに伴うデータ整合性維持が依然として大きな課題だ。<span style="color:#0d3461;font-weight:700;">酒類流通大手</span>の「<span style="color:#0d3461;font-weight:700;">ひとまいる</span>」（旧<span style="color:#0d3461;font-weight:700;">カクヤスグループ</span>）の基幹刷新プロジェクトでは、「<span style="color:#0d3461;font-weight:700;">AI</span>は魔法の杖ではない」との教訓が得られたという。<span style="color:#0d3461;font-weight:700;">AI</span>を最大限活用するには、徹底した要件定義や業務理解といった、いわゆる「泥にまみれる」泥臭いプロセスが不可欠であり、<span style="color:#0d3461;font-weight:700;">AI</span>時代におけるシステム開発の本質は、高度な言語化能力と、人間による最終的な責任担保にシフトしていると言える。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">企業向けLLM選びの指針</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">2026年版主要モデルを徹底比較</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">用途に合わせた最適解を</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Kalastor Net</span>による<span style="color:#b0001e;font-weight:700;">2026年</span>の企業向け<span style="color:#0d3461;font-weight:700;">LLM</span>比較では、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude</span>（<span style="color:#b0001e;font-weight:700;">4.7</span>ファミリー）、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT</span>（<span style="color:#b0001e;font-weight:700;">5</span>ファミリー）、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini</span>（<span style="color:#b0001e;font-weight:700;">3</span>ファミリー）、そして<span style="color:#0d3461;font-weight:700;">Mistral</span>の<span style="color:#0d3461;font-weight:700;">Large Studio</span>が主要な候補として挙げられる。<span style="color:#0d3461;font-weight:700;">Claude 4.7 Opus</span>は長文推論とエージェントワークフロー、コード生成に強く、<span style="color:#0d3461;font-weight:700;">GPT-5</span>は汎用的な精度と広範なツールエコシステムが特長。<span style="color:#0d3461;font-weight:700;">Gemini 3 Pro</span>は低レイテンシーとネイティブなマルチモーダル対応で優位性を見せる。一方、<span style="color:#0d3461;font-weight:700;">Mistral Large Studio 2</span>は<span style="color:#0d3461;font-weight:700;">EU</span>データレジデンシーとトークンあたりの低コストが魅力だが、コンテキストウィンドウは比較的小さい。比較は価格、コンテキストウィンドウ、アラビア語の流暢さ、レイテンシーなどの側面で行われ、ベンチマークスコアだけでなく実際のワークロードに合わせたモデル選択の重要性が強調されている。特に<span style="color:#0d3461;font-weight:700;">MENA</span>地域ではアラビア語の流暢さが選択の重要な決め手となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">主要生成AIプラットフォームの現状</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">GPT-4o、Claude、Geminiを比較</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">コストと機能で進化する選択肢</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>における主要な生成<span style="color:#0d3461;font-weight:700;">AI</span>プラットフォームとして、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>が挙げられる。<span style="color:#0d3461;font-weight:700;">GPT-4o</span>は<span style="color:#b0001e;font-weight:700;">5億人</span>のユーザー基盤でリードし、<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>は安全性と長文コンテキスト推論のベンチマークで最高評価を獲得。一方、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万トークン</span>のコンテキストウィンドウを誇り、ネイティブなマルチモーダル文書処理を可能にする。特筆すべきは、<span style="color:#b0001e;font-weight:700;">2023年</span>以降、主要<span style="color:#0d3461;font-weight:700;">LLM</span>の<span style="color:#b0001e;font-weight:700;">100万出力トークン</span>あたりの価格が<span style="color:#b0001e;font-weight:700;">80%以上</span>も下落している点で、コストは二次的な差別化要因となりつつある。<span style="color:#0d3461;font-weight:700;">Claude</span>はコーディングベンチマークで優位に立ち、<span style="color:#0d3461;font-weight:700;">GPT-5.5</span>は<span style="color:#0d3461;font-weight:700;">Codex</span>を搭載。各社の有料プランは月額<span style="color:#b0001e;font-weight:700;">20ドル</span>前後で横並びの価格設定となっている。</p></div></foreignObject>
