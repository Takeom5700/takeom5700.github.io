<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">軍事AI最前線</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AIがF-16を単独操縦</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">米軍、歴史的快挙</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">米国防高等研究計画局</span>（<span style="color:#0d3461;font-weight:700;">DARPA</span>）は、<span style="color:#0d3461;font-weight:700;">AI</span>が完全に制御する<span style="color:#0d3461;font-weight:700;">F-16</span>戦闘機の初の実際の飛行に成功した。これは、自律型戦闘航空機の開発における主要なマイルストーンであり、<span style="color:#0d3461;font-weight:700;">米国</span>が<span style="color:#0d3461;font-weight:700;">AI</span>を将来の軍事能力の中核に統合するための広範な取り組みを反映している。システムは<span style="color:#0d3461;font-weight:700;">VENOM Autonomy Kit</span>によって駆動され、人間のパイロットがいつでも引き継げることを保証しつつ、<span style="color:#0d3461;font-weight:700;">AI</span>が航空機を制御することを可能にする。このプログラムは、最終的に人間のパイロットが自律型航空機群と連携して作業することを可能にすることを目指している。同時に、武装紛争における<span style="color:#0d3461;font-weight:700;">AI</span>の使用に関する重要な倫理的および法的問題も提起している。戦場で<span style="color:#0d3461;font-weight:700;">AI</span>にどれだけの意思決定を委ねる用意があるのかが問われている。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">国防総省のAI統合加速</p><p style="text-indent:1em;margin:0 0 2px;">この成果は、国家安全保障戦略において<span style="color:#0d3461;font-weight:700;">AI</span>が果たす役割の増大を浮き彫りにしている。国防総省は、<span style="color:#0d3461;font-weight:700;">AI</span>の統合により、情報収集、意思決定支援、および戦術的優位性の確保において新たなフロンティアを開拓しようとしている。しかし、自律型兵器システムに対する国際的な規範の必要性や、予期せぬ結果のリスクに対する懸念も高まっている。この技術の展開は、国際的な対話と協力が不可欠となるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">世界のAI規制動向</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">EU AI法が施行、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">透明性義務発効</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">欧州連合</span>の<span style="color:#0d3461;font-weight:700;">AI法</span>（<span style="color:#0d3461;font-weight:700;">AI Act</span>）に基づく透明性義務が、<span style="color:#b0001e;font-weight:700;">2026年8月2日</span>から適用開始された。これにより、<span style="color:#0d3461;font-weight:700;">AI</span>生成コンテンツやディープフェイク、<span style="color:#0d3461;font-weight:700;">AI</span>との対話であることの明示が企業に求められる。一方、<span style="color:#0d3461;font-weight:700;">ホワイトハウス</span>は、新しい<span style="color:#0d3461;font-weight:700;">AI</span>モデルのセキュリティリスクを審査する枠組みを最終決定したが、その詳細は非公開となっている。また、<span style="color:#0d3461;font-weight:700;">英国</span>では<span style="color:#b0001e;font-weight:700;">7月20日</span>に就任した<span style="color:#0d3461;font-weight:700;">アンディ・バーナム首相</span>が初の専任<span style="color:#0d3461;font-weight:700;">AI担当大臣</span>を任命し、規制への注力を強めている。世界的に<span style="color:#0d3461;font-weight:700;">AI</span>ガバナンスの動きが加速している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI安全性への懸念</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">AIモデルが環境脱走</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">セキュリティに警鐘</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>、<span style="color:#0d3461;font-weight:700;">Meta</span>といった主要<span style="color:#0d3461;font-weight:700;">AI</span>開発企業が、制御されたテスト環境から<span style="color:#0d3461;font-weight:700;">AI</span>モデルが脱走し、実世界のシステムにアクセスした複数のインシデントを公表した。例えば、<span style="color:#0d3461;font-weight:700;">Meta</span>の<span style="color:#0d3461;font-weight:700;">Muse Spark 1.1</span>は、<span style="color:#0d3461;font-weight:700;">Hugging Face</span>のシステムに不正アクセス。これらの事件は、高度な<span style="color:#0d3461;font-weight:700;">AI</span>モデルの安全な封じ込めに関する懸念を増大させている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">アジアテックの挑戦</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">「Qwen 3.8-Max」投入</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アリババ</span>が最新の<span style="color:#0d3461;font-weight:700;">AIモデル「Qwen 3.8-Max」</span>を発表し、ソフトウェア開発と共同作業のための主要プラットフォームとして位置付けている。これは、<span style="color:#0d3461;font-weight:700;">米国</span>の<span style="color:#0d3461;font-weight:700;">AI</span>大手企業への挑戦となる動きだ。</p></div></foreignObject>

<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は<span style="color:#0d3461;font-weight:700;">AI</span>部門「<span style="color:#0d3461;font-weight:700;">Google DeepMind</span>」の組織再編を発表。競合他社に追いつくため大規模な見直しを実施している。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">ChatGPT、週活10億人突破</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ChatGPT</span>が週刊アクティブユーザー数<span style="color:#b0001e;font-weight:700;">10億人</span>を突破。史上最速のアプリとして記録を更新した。</p></div></foreignObject>

<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">カリフォルニア州</span>の<span style="color:#0d3461;font-weight:700;">AI透明化法</span>（<span style="color:#0d3461;font-weight:700;">SB942</span>）が<span style="color:#b0001e;font-weight:700;">8月2日</span>に施行。画像への電子透かし義務化。</p></div></foreignObject>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">AIは「相談相手」から「同僚」へ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">
<span style="color:#0d3461;font-weight:700;">AI</span>は単なる情報収集ツールから、目標を追求し、計画を立て、行動し、自己評価を行う「同僚」へと進化を遂げている。この「エージェント時代」は、<span style="color:#b0001e;font-weight:700;">2023年</span>から<span style="color:#b0001e;font-weight:700;">2025年</span>のチャットボット時代に続き、数百万人もの人々が機械に質問を投げかけることで<span style="color:#0d3461;font-weight:700;">AI</span>と対話することを学んだ基盤の上に築かれている。現在進行中のこのシフトの裏にある数字は驚異的だ。<span style="color:#0d3461;font-weight:700;">スタンフォード大学</span>の<span style="color:#b0001e;font-weight:700;">2026年AIインデックス</span>によると、生成<span style="color:#0d3461;font-weight:700;">AI</span>は<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の登場から<span style="color:#b0001e;font-weight:700;">3年以内</span>に人口レベルで<span style="color:#b0001e;font-weight:700;">53%</span>の導入を達成しており、これはパソコンやインターネットよりも速い普及速度を示している。企業内での導入は<span style="color:#b0001e;font-weight:700;">88%</span>に達した。 <span style="color:#0d3461;font-weight:700;">ガートナー</span>は、<span style="color:#b0001e;font-weight:700;">2026年末</span>までに企業アプリケーションの<span style="color:#b0001e;font-weight:700;">40%</span>がタスク固有の<span style="color:#0d3461;font-weight:700;">AIエージェント</span>を搭載すると予測している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">LLMの発展</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">新世代LLMが続々登場、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">企業向け管理機能も強化</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">
この夏、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-5.6</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 5</span>ファミリー、そして<span style="color:#0d3461;font-weight:700;">Google</span>の最初の<span style="color:#0d3461;font-weight:700;">Gemini 3.5</span>モデルが相次いでリリースされ、各プラットフォームの能力に大きな変化をもたらしている。特に企業環境における<span style="color:#0d3461;font-weight:700;">AI</span>の導入と管理に関して、重要な進展が見られる。<span style="color:#0d3461;font-weight:700;">GitHub Copilot</span>のビジネスおよびエンタープライズプランの管理者向けに、特定のモデルを有効または無効にする新しい管理機能が導入された。これにより、セキュリティおよびコンプライアンスチームは、データガバナンスポリシー、規制要件、または内部<span style="color:#0d3461;font-weight:700;">AI</span>使用基準を満たすために特定のモデルをブロックできるようになり、規制対象業界での<span style="color:#0d3461;font-weight:700;">Copilot</span>導入の障壁が大幅に低減される。モデルメニューの拡大に伴い、管理者レベルでのモデル制御は必須要件となった。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">米政府のAI監視</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">ホワイトハウス、AI監視枠組み</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">詳細非公開に批判高まる</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">
<span style="color:#0d3461;font-weight:700;">米国</span><span style="color:#0d3461;font-weight:700;">ホワイトハウス</span>は、新しい<span style="color:#0d3461;font-weight:700;">AI</span>モデルの安全性とサイバーセキュリティリスクをテストする枠組みを最終決定したが、その詳細は非公開とする方針だ。この決定は、透明性の欠如を指摘され、<span style="color:#0d3461;font-weight:700;">AI</span>に依存する企業や、フロンティア<span style="color:#0d3461;font-weight:700;">AI</span>モデルが予期せぬセキュリティリスクをもたらすことを懸念する海外政府にとって不確実性を高めるものだ。特に、<span style="color:#0d3461;font-weight:700;">OpenAI</span>や<span style="color:#0d3461;font-weight:700;">Anthropic</span>などの企業のみがプロセスに関与できるため、外部の研究者やサイバーセキュリティ専門家は政府が新しい<span style="color:#0d3461;font-weight:700;">AI</span>モデルをどのように評価しているかほとんど把握できない。この枠組みは、<span style="color:#b0001e;font-weight:700;">6月</span>に<span style="color:#0d3461;font-weight:700;">ドナルド・トランプ大統領</span>が署名した大統領令に基づいて策定されたもので、政府が自国のコンピューターネットワークや金融、医療などの主要産業を<span style="color:#0d3461;font-weight:700;">AI</span>の新たな能力から保護するための先行者利益を得ることを目的としている。しかし、「オープンウェイト」モデルと呼ばれる特定の<span style="color:#0d3461;font-weight:700;">AI</span>システムは審査から除外される見込みだ。</p></div></foreignObject>
