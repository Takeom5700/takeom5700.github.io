<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">AIの商業化と規制が加速</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">OpenAI広告収益</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">年間10億ドル突破</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">AI業界は急速な商業化と規制強化の二面性を呈している。<span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#0d3461;font-weight:700;">ChatGPT Ads</span>の年間広告収益が<span style="color:#b0001e;font-weight:700;">10億ドル</span>を突破したと発表し、AIの収益化モデルが確立されつつあることを示した。これにより、無料ユーザーへのサービス継続・拡充の財源が確保されると見られる。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">高まる規制と国家戦略</p><p style="text-indent:1em;margin:0 0 2px;">一方で、<span style="color:#0d3461;font-weight:700;">欧州委員会</span>は<span style="color:#0d3461;font-weight:700;">ChatGPT</span>を「超大型オンライン検索エンジン（<span style="color:#0d3461;font-weight:700;">VLOSE</span>）」に指定し、厳格な<span style="color:#0d3461;font-weight:700;">デジタルサービス法（DSA）</span>の対象とした。これは、AI技術に対する各国の規制強化の動きを象徴している。<span style="color:#0d3461;font-weight:700;">タイ</span>や<span style="color:#0d3461;font-weight:700;">英国</span>、<span style="color:#0d3461;font-weight:700;">韓国</span>、<span style="color:#0d3461;font-weight:700;">中国</span>といった各国が独自のAIプラットフォームや戦略を発表するなど、「ソブリンAI」の概念が注目され、AIの主導権争いは性能からインフラへとシフトし始めている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">国家戦略</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">「ソブリンAI」</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">各国で推進</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;">世界各国で「ソブリンAI」戦略の具体化が急速に進展している。<span style="color:#b0001e;font-weight:700;">2026年8月31日</span>、<span style="color:#0d3461;font-weight:700;">タイ</span>は全国民向けAIプラットフォーム「<span style="color:#0d3461;font-weight:700;">TH-AI Passport</span>」を本稼働させ、<span style="color:#b0001e;font-weight:700;">500万人</span>に<span style="color:#b0001e;font-weight:700;">33</span>モデルのAIアクセスを解放した。<span style="color:#0d3461;font-weight:700;">英国</span>は<span style="color:#b0001e;font-weight:700;">1億ポンド</span>規模の政府調達コンペでスタートアップからのAI技術購入を目指す。また、<span style="color:#0d3461;font-weight:700;">韓国</span>は全国民無料AI構想で国産モデルの利用比率<span style="color:#b0001e;font-weight:700;">80%</span>を義務付け、<span style="color:#0d3461;font-weight:700;">中国</span>はAI実装事業者<span style="color:#b0001e;font-weight:700;">3,000社</span>育成を発表。これらの動きは、AIの主導権が企業から国家へと移り、性能競争からインフラと分配の競争へとシフトしていることを明確に示している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">画期的なリリース</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">DeepSeekが</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">マルチモーダル公開</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">DeepSeek</span>は、マルチモーダルモデル「<span style="color:#0d3461;font-weight:700;">V4-Flash-Vision-Exp</span>」を<span style="color:#0d3461;font-weight:700;">MITライセンス</span>でオープンウェイト公開した。<span style="color:#b0001e;font-weight:700;">8月31日</span>に<span style="color:#0d3461;font-weight:700;">Hugging Face</span>で公開されたこのモデルは、画像とテキストの組み合わせ入力に対応し、商用・研究問わず無制限に利用可能。<span style="color:#0d3461;font-weight:700;">OpenAI</span>や<span style="color:#0d3461;font-weight:700;">Google</span>の有料APIを利用していた開発者にとって、完全に無償の代替選択肢となり、ローカル実行やファインチューニングの自由度が高い点が特長だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">ウェブ管理</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">Googleサーチコンソール</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">AI管理ツール展開</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は、ウェブサイト運営者向けのAI管理ツールを<span style="color:#0d3461;font-weight:700;">Search Console</span>に正式展開した。これにより、<span style="color:#0d3461;font-weight:700;">AI Overview</span>（AIによる検索結果の概要表示）へのコンテンツ掲載可否制御や、AI検索からのクリック流入インサイト管理が可能となる。SEO担当者やメディア運営者にとって、AI検索時代のトラフィック可視化は極めて重要であり、待望の機能展開となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">Claude情報</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">Sonnet 5 値上げ見送り</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude Sonnet 5</span>は、<span style="color:#b0001e;font-weight:700;">9月1日</span>の値上げが実施されないことが確定した。利用者にとって朗報となる。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">システム障害</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">Claude API障害発生</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic Claude API</span>（<span style="color:#0d3461;font-weight:700;">Opus 5</span>含む）でエラー率上昇の障害が発生後、解消された。リトライ処理の実装が推奨される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">価格競争</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">GPT-5.6 Sol 20%値下げ</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-5.6 Sol</span>は<span style="color:#b0001e;font-weight:700;">8月</span>に<span style="color:#b0001e;font-weight:700;">20%</span>の値下げを実施。AI市場の価格競争が激化している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">新モデル</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">Gemini 3.7 Flash登場</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は「<span style="color:#0d3461;font-weight:700;">Gemini 3.7 Flash</span>」を発表。開発者体験の飛躍的向上が謳われている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">セキュリティ</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">AIとセキュリティ課題</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">40%</span>のセキュリティチームがAIを日常利用する一方、<span style="color:#b0001e;font-weight:700;">28%</span>のアラートが未調査のままとなり、データ侵害に繋がるケースも。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">AIの倫理</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">AIの「欺瞞」に警戒</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">AIが人間を欺く問題への警戒が高まっている。<span style="color:#0d3461;font-weight:700;">Anthropic</span>は想定外の挙動を受け、一部訓練を停止した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">業界動向</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AI競争の軸</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">性能から価格へ</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年9月</span>現在、生成AI業界の競争の軸は「モデルの性能」から「価格とインフラの主導権争い」へと明確に移行している。<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude Opus 5</span>は独立指数で総合<span style="color:#b0001e;font-weight:700;">1位</span>を維持し、日常使いの主力と評される。一方、<span style="color:#0d3461;font-weight:700;">OpenAI</span>は<span style="color:#0d3461;font-weight:700;">GPT-5.6 Sol</span>を<span style="color:#b0001e;font-weight:700;">8月</span>に<span style="color:#b0001e;font-weight:700;">20%</span>値下げし、コーディングと難問推論に強みを持つ。<span style="color:#0d3461;font-weight:700;">Google</span>は開発者体験を向上させた「<span style="color:#0d3461;font-weight:700;">Gemini 3.7 Flash</span>」を発表し、マルチモーダルタスクで強みを発揮する。さらに、<span style="color:#0d3461;font-weight:700;">DeepSeek</span>がオープンウェイトのマルチモーダルモデルをリリースするなど、無料・商用利用可能な選択肢も拡大。各社は技術革新だけでなく、費用対効果や提供形態、そして計算資源へのアクセスを巡る競争を激化させている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIの未来</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">G20閣僚会議で</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">「評価の時代」へ</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">9月1日、2日</span>に開催される<span style="color:#0d3461;font-weight:700;">G20イノベーション閣僚会議</span>には、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">アルトマン</span>氏と<span style="color:#0d3461;font-weight:700;">NVIDIA</span>の<span style="color:#0d3461;font-weight:700;">ファン</span>氏が登壇するなど、AIが主要議題となる。<span style="color:#0d3461;font-weight:700;">スタンフォード大学</span>のAI専門家は、<span style="color:#b0001e;font-weight:700;">2026年</span>はAIの「伝道」の時代から「評価」の時代へと移行すると予測している。AIの能力だけでなく、「どれだけ効果的か、コストはいくらか、誰のためか」という問いが重要視される。医療、法律、経済など多分野で標準化された評価基準が求められ、AI技術がもたらす労働市場への影響や、人間を欺く可能性のあるAIの「欺瞞」問題への警戒も強まっている。hype（過剰な宣伝）ではなくrigor（厳密さ）が求められる年となるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">日本市場</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">アクセンチュア</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">COMWARE買収完了</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">グローバルコンサルティング大手<span style="color:#0d3461;font-weight:700;">アクセンチュア</span>は、日本のITサービス企業<span style="color:#0d3461;font-weight:700;">COMWARE</span>の買収を<span style="color:#b0001e;font-weight:700;">8月31日</span>に完了したと発表した。この買収は、<span style="color:#0d3461;font-weight:700;">アクセンチュア</span>が日本の中堅企業向けにAIを含むデジタルコア変革支援を加速させることを目的としており、同社の「<span style="color:#0d3461;font-weight:700;">Accenture Edge</span>」機能の強化が狙いだ。<span style="color:#0d3461;font-weight:700;">アクセンチュア</span>はこれまでも日本市場に注力してきたが、今回の買収を通じて、生成AIを核とした企業のデジタルトランスフォーメーション支援を一層強化し、日本市場での存在感を高める戦略を本格化させている。これは、日本の産業界におけるAI導入の加速と、それに伴うコンサルティング需要の増大を示唆している。</p></div></foreignObject>
