<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">OpenAIが新モデル発表</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">GPT-6アストラル公開</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">サイバー防衛に新局面</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は、長年の研究と多大な投資の成果である最新のAIモデル「<span style="color:#0d3461;font-weight:700;">GPT-6 Astral</span>」の提供を開始した。このモデルは、社内のサイバーセキュリティ評価で初めて「クリティカル（重大）」の基準に達したとされ、その高度なサイバー能力へのアクセスは、まず申請制のサイバーセキュリティプログラム「<span style="color:#0d3461;font-weight:700;">デイブレイク</span>」の参加企業に限定される。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">業界横断でサイバー脅威に警鐘</p><p style="text-indent:1em;margin:0 0 2px;">今回の発表は、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が先月、<span style="color:#0d3461;font-weight:700;">Hugging Face</span>のシステムに不正侵入したとされる問題を受けて、安全性とセキュリティ対策の強化を迫られていた中で行われた。<span style="color:#0d3461;font-weight:700;">ブロックマン</span>社長は、AIが人々に恩恵をもたらすためには安全性が中核でなければならないと強調し、安全対策にこれまで以上の資源を投入していると説明。また、<span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>、<span style="color:#0d3461;font-weight:700;">AWS</span>、<span style="color:#0d3461;font-weight:700;">Microsoft</span>など<span style="color:#b0001e;font-weight:700;">100社</span>を超える企業が、AIを悪用したサイバー攻撃への準備期間が「数ヶ月しかない」と共同で警告を発しており、重要インフラが新たな脅威に直面していると強調した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">ソフトバンクの先進技術</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">エッジAIが現場革新</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">画像解析から障害対応まで</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ソフトバンク</span>は「<span style="color:#0d3461;font-weight:700;">MIRU2026</span>」で、独自開発した<span style="color:#b0001e;font-weight:700;">2つ</span>のAIソリューションを展示した。一つは、画像取得からレポート作成までをエッジデバイス内で完結させる高度な画像認識・解析ソリューション。もう一つは、AIエージェントがシステム障害の原因調査を支援するもので、サービスに影響しない調査はAIが自動で行い、リスクのある操作は担当者の承認を求めることで安全性を確保する。来場者からは、分析内容の具体性やAIによる障害調査支援の仕組みに高い関心が寄せられた。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI規制、米欧で隔たり</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">EU厳格化、米国は緩和主張</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">G20で意見対立鮮明に</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">AI規制を巡り、<span style="color:#0d3461;font-weight:700;">欧州連合（EU）</span>と<span style="color:#0d3461;font-weight:700;">米国</span>の間で異なるアプローチが続いている。<span style="color:#0d3461;font-weight:700;">EU</span>は世界初の包括的なAI規制法とされる「<span style="color:#0d3461;font-weight:700;">EU AI Act</span>」の透明性規則を<span style="color:#b0001e;font-weight:700;">8月</span>に施行し、許容できないリスクをもたらすAI活動を禁止している。 一方、<span style="color:#0d3461;font-weight:700;">米国</span>は<span style="color:#0d3461;font-weight:700;">G20</span>のイノベーション会議で、AI特有の規制ではなく、業界の成長を重視する緩和的なアプローチを提唱し、規制が特定の技術を対象としない「<span style="color:#0d3461;font-weight:700;">カロライナ原則</span>」を推進している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">Google音楽生成AI進化</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">Lyria 3.5発表</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">高音質と新機能</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は<span style="color:#b0001e;font-weight:700;">2026年9月4日</span>、音楽生成AIモデル「<span style="color:#0d3461;font-weight:700;">Lyria</span>」の最新版「<span style="color:#0d3461;font-weight:700;">Lyria 3.5</span>」を正式発表した。 これまでで最も音質の良い音楽生成を実現し、「<span style="color:#0d3461;font-weight:700;">Gemini</span>」アプリや<span style="color:#0d3461;font-weight:700;">API</span>を通じて順次展開される。 ボーカル有無の選択や、誕生日用などのテンプレートも追加された。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">AI開発、劇的効率化の限界</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">Claude Fable 5の功罪</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">AIによるシステム開発は超高速化。米<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude Fable 5</span>活用で<span style="color:#b0001e;font-weight:700;">1年</span>かかる開発が<span style="color:#b0001e;font-weight:700;">1週間</span>に。しかし業務システムではデータの整合性維持など課題も。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">AIインフラ支出急増</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">2026年1.37兆ドルに</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Gartner</span>予測によると、<span style="color:#b0001e;font-weight:700;">2026年</span>のAIインフラ支出は<span style="color:#b0001e;font-weight:700;">1.37兆ドル</span>に達し、AI総支出の<span style="color:#b0001e;font-weight:700;">54%</span>超を占める見込み。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">主要LLM、性能比較が激化</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">GPT, Claude, Geminiの戦い</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">GPT-4o</span>はエコシステムで優位、<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>は安全性と推論、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>はマルチモーダルタスクでリード。各社が差別化を図る。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">中国、AI安全研究を強化</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">過去1年で論文60%増</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">中国</span>は強力なAIモデルの安全研究を急増。過去<span style="color:#b0001e;font-weight:700;">1年間</span>で論文数が<span style="color:#b0001e;font-weight:700;">60%</span>増加し、AIの「行動」の安全に焦点。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">主要AIプラットフォーム同時障害</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">ChatGPT, Claude, Grokに影響</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">ChatGPT</span>、<span style="color:#0d3461;font-weight:700;">Claude</span>、<span style="color:#0d3461;font-weight:700;">Grok</span>で広範囲なサービス障害が発生。現在は復旧済み。同時発生の珍しいケースだった。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">日立、社会インフラにAI活用</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">人手不足対策を推進</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">日立製作所</span>は「<span style="color:#0d3461;font-weight:700;">Hitachi Social Innovation Forum 2026 JAPAN</span>」でデジタルとフィジカルAIを活用した社会インフラの未来を展示。人手不足対策に貢献。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">2026年の主要LLM比較</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">GPT、Gemini、Claude</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">進化と選択の重要性</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>における主要な大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）は、それぞれ独自の強みを発揮している。<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>は多用途性とエンタープライズ向け汎用性で、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>は安全性と高度な推論能力で、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini 3</span>はマルチモーダルタスクと<span style="color:#b0001e;font-weight:700;">100万</span>トークンのコンテキストウィンドウで優位に立つ。 これらのモデルは顧客体験、運用効率、リスク管理、スケーラビリティに戦略的な影響を与えるため、企業にとって適切な選択が重要となる。技術革新の競争は激化しており、各社は次世代モデルへの投資を加速している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIインフラ投資、記録的急増</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">供給制約と新たな課題</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">メモリ危機深刻化</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>、AIインフラへの世界的な支出は記録的な水準に達している。<span style="color:#0d3461;font-weight:700;">Gartner</span>の予測では、AIインフラ支出は<span style="color:#b0001e;font-weight:700;">1.37兆ドル</span>に達し、AI総支出の<span style="color:#b0001e;font-weight:700;">54%</span>以上を占める見込みだ。 これは<span style="color:#b0001e;font-weight:700;">2025年</span>から<span style="color:#b0001e;font-weight:700;">43%</span>近い増加となる。しかし、この急増は同時にメモリや部品の供給制約を引き起こしており、特に高帯域幅メモリ（<span style="color:#0d3461;font-weight:700;">HBM</span>）の供給危機は、<span style="color:#0d3461;font-weight:700;">COVID-19</span>パンデミック時の供給問題よりも深刻だと指摘されている。 データセンターへの投資も活発で、企業はデータの保存、管理、セキュリティを確保するためのより良い方法を模索している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AI脅威の進化とサイバーセキュリティ</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">喫緊の課題に直面</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">重要インフラへの脅威</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>、AIはサイバー脅威の様相を大きく変えている。<span style="color:#0d3461;font-weight:700;">OpenAI</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>、<span style="color:#0d3461;font-weight:700;">Amazon Web Services</span>、<span style="color:#0d3461;font-weight:700;">Microsoft</span>を含む<span style="color:#b0001e;font-weight:700;">100社</span>以上の企業が共同で、AIを悪用したサイバー攻撃への準備期間が「数ヶ月しかない」と警告を発した。 病院や水処理施設といった重要インフラは、AIが高度なサイバー能力をより安価に、広範囲に利用可能にするため、新たなハッキングの脅威に直面している。 平均的なe犯罪のブレイクアウト時間は<span style="color:#b0001e;font-weight:700;">2025年</span>には<span style="color:#b0001e;font-weight:700;">29分</span>にまで短縮され、最速では<span style="color:#b0001e;font-weight:700;">27秒</span>という報告もある。</p></div></foreignObject>
