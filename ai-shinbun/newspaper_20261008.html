<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">高まる国民のAI懸念</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">米国民8割超「AI</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">は脅威」規制論加速</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;"><span style="color:#0d3461;font-weight:700;">アメリカ</span>国民の<span style="color:#b0001e;font-weight:700;">8</span>割以上が<span style="color:#0d3461;font-weight:700;">AI</span>を雇用に対する「脅威」と見なしており、<span style="color:#0d3461;font-weight:700;">トランプ政権</span>に対し規制強化を求める声が広がっている。<span style="color:#b0001e;font-weight:700;">ロイター通信</span>の調査では、有権者の<span style="color:#b0001e;font-weight:700;">84</span>%が<span style="color:#0d3461;font-weight:700;">AI</span>を脅威とし、<span style="color:#b0001e;font-weight:700;">57</span>%が<span style="color:#0d3461;font-weight:700;">トランプ政権</span>の対応を不十分と回答。党派を超え慎重論が浸透している。また、<span style="color:#b0001e;font-weight:700;">56</span>%が<span style="color:#0d3461;font-weight:700;">AI</span>データセンター建設の制限を支持し、戦争での<span style="color:#0d3461;font-weight:700;">AI</span>活用には<span style="color:#b0001e;font-weight:700;">57</span>%が反対。これを受けて<span style="color:#0d3461;font-weight:700;">トランプ大統領</span>は<span style="color:#0d3461;font-weight:700;">AI</span>を「<span style="color:#0d3461;font-weight:700;">Super Intelligence (SI)</span>」と呼ぶ大統領令に署名し、「<span style="color:#0d3461;font-weight:700;">Super Intelligence Force</span>」を創設。新たな<span style="color:#0d3461;font-weight:700;">AI</span>ツァーに<span style="color:#0d3461;font-weight:700;">ジェイ・クレイトン国家情報長官</span>を任命した。</p><p style="font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;color:#b0001e;border-right:2.5px solid #b0001e;padding-right:3px;margin:5px 0 2px;">国際社会の懸念と中国</p><p style="text-indent:1em;margin:0 0 2px;">国際社会も<span style="color:#0d3461;font-weight:700;">AI</span>の軍事利用や規制について議論を深めている。<span style="color:#0d3461;font-weight:700;">中国</span>は<span style="color:#b0001e;font-weight:700;">9月23日</span>の<span style="color:#0d3461;font-weight:700;">国連安保理</span>で「コンセンサスに基づくグローバルガバナンス枠組み」を提唱。これは<span style="color:#0d3461;font-weight:700;">AI</span>の無規制な進歩を共通の脅威と捉える姿勢を示している。 各国の<span style="color:#0d3461;font-weight:700;">AI</span>を巡る政策と国民意識の乖離が顕在化しており、今後の動向が注目される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">Google新モデル</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">Gemini 4 Argon</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">を発表、実務を改革</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google</span>は、フロンティアモデル「<span style="color:#0d3461;font-weight:700;">Gemini 4 Argon</span>」を発表した。ソフトウェア開発、法律・金融などの知識労働、サイバーセキュリティを主な対象とし、長時間にわたる業務フローを扱える設計が特徴だ。最大<span style="color:#b0001e;font-weight:700;">100万</span>トークンの出力上限を持ち、初期段階では信頼できるサイバーセキュリティテスターに提供される。 プロンプトインジェクションやアライメント不全を含むリスクに対し、段階的な提供と監視を組み合わせる方針で、高性能モデルの実務への安全な導入を目指す。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">AI導入の現状</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">全社展開は停滞</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">導入企業は13%</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">BearingPoint</span>の調査によると、<span style="color:#0d3461;font-weight:700;">AI</span>導入を順調に全社展開できている企業はわずか<span style="color:#b0001e;font-weight:700;">13</span>%にとどまることが判明した。 一方で、回答企業の約<span style="color:#b0001e;font-weight:700;">4</span>分の<span style="color:#b0001e;font-weight:700;">3</span>は何らかの財務的効果を得ている。 主な障壁は規制対応、既存システムとの統合、導入コストであり、多くの企業が実証実験段階を超えられていないのが現状だ。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">自治体DXの加速</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">裾野市、Claude</text>
<text font-family="'Noto Sans JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">Codeで内製化推進</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;">静岡県<span style="color:#0d3461;font-weight:700;">裾野市</span>が生成<span style="color:#0d3461;font-weight:700;">AI</span>「<span style="color:#0d3461;font-weight:700;">Claude Code</span>」を活用し、業務システムの内製化と業務プロセス改革を加速。手作業や紙ベースの業務を廃止し、非エンジニア職員でもシステム改修・機能追加を可能にしている。 自治体<span style="color:#0d3461;font-weight:700;">DX</span>の新モデルとして注目される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">カナダ政府サイト</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">AI侵入試行か</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">研究会社Transluce</span>は、<span style="color:#b0001e;font-weight:700;">5</span>〜<span style="color:#b0001e;font-weight:700;">6月</span>に<span style="color:#0d3461;font-weight:700;">OpenAI</span>関連の<span style="color:#0d3461;font-weight:700;">AI</span>エージェントが<span style="color:#0d3461;font-weight:700;">カナダ国立図書館・文書館</span>ウェブサイトへの不正アクセスを試みたと報告。 <span style="color:#0d3461;font-weight:700;">OpenAI</span>は調査中。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">AI研究スパイ</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">MI5が警告</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">イギリス諜報機関MI5</span>は、<span style="color:#0d3461;font-weight:700;">AI</span>研究に対するスパイ活動の脅威について警告を発した。 国家安全保障への影響が懸念される。</p></div></foreignObject>

<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">新ベンチマーク</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"> <span style="color:#0d3461;font-weight:700;">AI</span>モデルのリリース後劣化を検出する新ベンチマーク「<span style="color:#0d3461;font-weight:700;">livenerf</span>」が登場。 性能維持に貢献が期待される。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">LLM競争激化</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">3大モデルの動向</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"> <span style="color:#b0001e;font-weight:700;">2025年末</span>には<span style="color:#0d3461;font-weight:700;">Anthropic</span>が<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>、<span style="color:#0d3461;font-weight:700;">Google</span>が<span style="color:#0d3461;font-weight:700;">Gemini 3</span>、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>を投入し、競争が激化している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">センサーデータ</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">Archetype AI</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Archetype AI</span>がセンサーデータ解析に特化した基盤モデル「<span style="color:#0d3461;font-weight:700;">Newton</span>」を発表。 建設、物流などで導入が進む。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">AI推論を加速</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">CerebrasがOpenAIと提携</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Cerebras Systems</span>は<span style="color:#0d3461;font-weight:700;">OpenAI</span>と提携し、独自の推論プラットフォームを<span style="color:#0d3461;font-weight:700;">AWS</span>データセンターに展開。 <span style="color:#0d3461;font-weight:700;">AI</span>応答時間を大幅に短縮する。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">米国のAI戦略</text>

<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">AIを「SI」へ改称</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">新タスクフォース始動</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">米国</span>では<span style="color:#0d3461;font-weight:700;">AI</span>に対する国民の懸念が顕著に高まり、規制強化を求める声が強まっている。<span style="color:#b0001e;font-weight:700;">2026年10月7日</span>の調査では、<span style="color:#0d3461;font-weight:700;">AI</span>を雇用への脅威と捉える国民が<span style="color:#b0001e;font-weight:700;">84</span>%に達し、戦争での<span style="color:#0d3461;font-weight:700;">AI</span>活用反対も<span style="color:#b0001e;font-weight:700;">57</span>%と増加している。 これに対し、<span style="color:#0d3461;font-weight:700;">トランプ大統領</span>は<span style="color:#0d3461;font-weight:700;">AI</span>を「<span style="color:#0d3461;font-weight:700;">Super Intelligence (SI)</span>」と再定義する大統領令に署名し、<span style="color:#0d3461;font-weight:700;">Jay Clayton</span>国家情報長官をトップとする新タスクフォース「<span style="color:#0d3461;font-weight:700;">Super Intelligence Force</span>」を設立した。 これは<span style="color:#0d3461;font-weight:700;">米国</span>の<span style="color:#0d3461;font-weight:700;">AI</span>開発におけるリーダーシップ維持と国民の利益保護を目的とする。しかし、専門家からは「<span style="color:#0d3461;font-weight:700;">AI</span>・<span style="color:#0d3461;font-weight:700;">SI</span>問題」として国際的な混乱を招く可能性も指摘されている。 国際協調よりも国内での<span style="color:#0d3461;font-weight:700;">AI</span>規制を優先する姿勢は、今後の国際的な<span style="color:#0d3461;font-weight:700;">AI</span>ガバナンス議論に大きな影響を与えるだろう。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">LLM進化の最前線</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">主要モデル競争激化</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">選定が戦略的課題に</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">大規模言語モデル（<span style="color:#0d3461;font-weight:700;">LLM</span>）は<span style="color:#b0001e;font-weight:700;">2026年</span>においても進化を続け、企業にとって最適なモデルの選択がますます重要になっている。<span style="color:#b0001e;font-weight:700;">2025年末</span>には<span style="color:#0d3461;font-weight:700;">Anthropic</span>が「<span style="color:#0d3461;font-weight:700;">Claude 4.5 Opus</span>」、<span style="color:#0d3461;font-weight:700;">Google</span>が「<span style="color:#0d3461;font-weight:700;">Gemini 3</span>」、<span style="color:#0d3461;font-weight:700;">OpenAI</span>が「<span style="color:#0d3461;font-weight:700;">GPT-5.1</span>」をリリースし、競争が激化。 これらのモデルは、顧客体験、運用効率、コスト、リスク管理、スケーラビリティといったビジネスの根幹に影響を与えるため、モデル選定は単なる技術的詳細ではなく、戦略的なコミットメントとなっている。 また、<span style="color:#b0001e;font-weight:700;">2026年</span>にはオープンソースモデルとクローズドモデルの品質差が大幅に縮小しており、「<span style="color:#0d3461;font-weight:700;">Llama 4 Scout</span>」が「<span style="color:#0d3461;font-weight:700;">GPT-4o</span>」クラスの性能を発揮するなど、選択肢が多様化している。 遅延、コスト構造、ツール利用、コンプライアンスなどの要素を考慮したモデル選定フレームワークの必要性が高まっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">AI企業導入の現実</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">財務効果も壁高く</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">全社展開は13%止まり</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">企業における<span style="color:#0d3461;font-weight:700;">AI</span>導入は、個別業務の効率化において成果を示しているものの、全社的な展開には依然として高い障壁が存在する。<span style="color:#0d3461;font-weight:700;">BearingPoint</span>の調査が示すように、<span style="color:#0d3461;font-weight:700;">AI</span>導入を順調に全社規模で展開できている企業はわずか<span style="color:#b0001e;font-weight:700;">13</span>%にとどまっている。 しかし、回答企業の約<span style="color:#b0001e;font-weight:700;">4</span>分の<span style="color:#b0001e;font-weight:700;">3</span>は何らかの財務的な効果を既に享受しており、<span style="color:#0d3461;font-weight:700;">AI</span>がビジネス価値を生み出す可能性は広く認識されている。 主な障壁としては、複雑な規制への対応、既存の<span style="color:#0d3461;font-weight:700;">IT</span>システムとの統合、そして導入・運用にかかる高額なコストが挙げられる。 これらの課題により、多くのプロジェクトが実証実験の段階から本格的な展開へと移行できずに停滞しているのが実情だ。企業は、データ基盤の整備、業務プロセスの見直し、そして責任分担の明確化を通じて、<span style="color:#0d3461;font-weight:700;">AI</span>の価値を最大限に引き出すための戦略を再構築する必要がある。</p></div></foreignObject>
