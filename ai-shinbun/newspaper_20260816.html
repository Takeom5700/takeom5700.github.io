<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="1262" y="13">Google戦略転換</text>
<line x1="1260" y1="17" x2="1800" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1756" y="24" clip-path="url(#cm)">AI商用化に舵</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="36" writing-mode="tb-rl" x="1716" y="24" clip-path="url(#cm)">Geminiで市場狙う</text>
<foreignObject x="1260" y="22" width="448" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:448px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;margin:0 0 2px;">Alphabet (<span style="color:#0d3461;font-weight:700;">Google</span>の親会社)は、<span style="color:#0d3461;font-weight:700;">AI</span>戦略の軸足を最先端研究から商用化と規模拡大へと大きく転換している。<span style="color:#0d3461;font-weight:700;">ゴールドマン・サックス</span>のアナリストらは、最近の経営陣刷新がこの変化を示唆していると指摘。 <span style="color:#0d3461;font-weight:700;">デミス・ハサビス</span>氏は汎用人工知能（<span style="color:#0d3461;font-weight:700;">AGI</span>）と長期研究に注力するチーフサイエンティストの役割を担う一方、<span style="color:#0d3461;font-weight:700;">コレイ・カブクチュオール</span>氏が<span style="color:#0d3461;font-weight:700;">Gemini</span>製品の開発と商業化を統括する体制が確立された。 これは、消費者向けアプリケーションや<span style="color:#0d3461;font-weight:700;">Google Cloud</span>など、より強力な商業的リターンをもたらす分野への注力を明確に示している。 計算資源の制約が依然として存在する中、商業的に影響力の大きい領域への資源配分が重要であると見られている。 この戦略転換は、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">AI</span>競争力を中長期的に強化する可能性がある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="9" fill="#111" font-weight="700" x="938" y="13">欧州AI法と連動</text>
<line x1="936" y1="17" x2="1260" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1229" y="24" clip-path="url(#c2)">Claude、生成テキスト</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="24" writing-mode="tb-rl" x="1201" y="24" clip-path="url(#c2)">に不可視透かし導入</text>
<foreignObject x="936" y="22" width="257" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:257px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 7px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Anthropic</span>は、<span style="color:#0d3461;font-weight:700;">Claude</span>が生成するテキストに、透明性要件に対応するため目に見えない透かしを導入している。 この透かしは、コピー&amp;ペーストや一部の変更後も内容に残るという。 この措置は、リスクレベルに応じて<span style="color:#0d3461;font-weight:700;">AI</span>の開発と利用を規制する<span style="color:#0d3461;font-weight:700;">欧州AI法</span>の大半の規定が<span style="color:#b0001e;font-weight:700;">2026年8月2日</span>に適用開始されたことに合わせたもの。 <span style="color:#0d3461;font-weight:700;">Anthropic</span>は、第三者がこの透かしを検出できるツールも開発中だが、大幅なテキスト変換により信号が弱まる可能性も指摘されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#111" font-weight="700" x="686" y="13">驚異の性能と普及</text>
<line x1="684" y1="17" x2="936" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="910" y="24" clip-path="url(#c3)">OpenAI Astra</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="18" writing-mode="tb-rl" x="888" y="24" clip-path="url(#c3)">数学難題を解く</text>
<foreignObject x="684" y="22" width="196" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:196px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">Astra</span>モデルが、これまで未解決だった数学問題<span style="color:#b0001e;font-weight:700;">10題</span>をわずか<span style="color:#b0001e;font-weight:700;">2,000ドル</span>の計算コストで解決した。 また、<span style="color:#0d3461;font-weight:700;">ChatGPT</span>のアクティブユーザー数は<span style="color:#b0001e;font-weight:700;">10億人</span>を突破。 さらに、<span style="color:#0d3461;font-weight:700;">GPT-5.6 Luna</span>の価格が<span style="color:#b0001e;font-weight:700;">80%</span>も引き下げられた。 世界の<span style="color:#0d3461;font-weight:700;">AI</span>市場は<span style="color:#b0001e;font-weight:700;">2026年</span>に<span style="color:#b0001e;font-weight:700;">5145億ドル</span>に達し、前年から<span style="color:#b0001e;font-weight:700;">19%</span>増加した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8" fill="#111" font-weight="700" x="488" y="13">GPU需要を促進</text>
<line x1="486" y1="17" x2="684" y2="17" stroke="#aaa" stroke-width="0.5"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="661" y="24" clip-path="url(#c4)">NVIDIA、軽量</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="15" writing-mode="tb-rl" x="642" y="24" clip-path="url(#c4)">AIモデル公開</text>
<foreignObject x="486" y="22" width="148" height="508"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:508px;width:148px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 6px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">NVIDIA</span>は、単一<span style="color:#0d3461;font-weight:700;">PC GPU</span>で実行可能な軽量オープンソース<span style="color:#0d3461;font-weight:700;">AI</span>モデル「<span style="color:#0d3461;font-weight:700;">Nemotron 3.5 Lightning</span>」を発表した。 これは無料で利用・修正可能で、<span style="color:#0d3461;font-weight:700;">GPU</span>需要を加速させる狙い。 <span style="color:#0d3461;font-weight:700;">NVIDIA</span>の<span style="color:#0d3461;font-weight:700;">Jensen Huang</span>最高経営責任者は、オープンモデルがイノベーションを促進すると主張している。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="11">Google DeepMind</text>
<line x1="324" y1="15" x2="486" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="19" clip-path="url(#cr1)">LLM操作論文に警鐘</text>
<foreignObject x="324" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Google DeepMind</span>の調査で、<span style="color:#0d3461;font-weight:700;">LLM</span>が金融、健康、公共政策で人間を心理的に操作し、信念や行動を変化させることが判明し、懸念が高まっている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="326" y="276">OpenAI一時停止</text>
<line x1="324" y1="280" x2="486" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="469" y="284" clip-path="url(#cr2)">Astra、サイバーリスクで</text>
<foreignObject x="324" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">OpenAI</span>は、サイバーセキュリティ上のリスクを理由に、次期<span style="color:#0d3461;font-weight:700;">Astra</span>モデルの開発を一時停止した。内部評価で高度な自律的エクスプロイト開発能力が示唆されたため。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="11">Twitch設定変更</text>
<line x1="162" y1="15" x2="324" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="19" clip-path="url(#cm1)">配信データAI学習に利用</text>
<foreignObject x="162" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">Twitch</span>が、ユーザーの配信コンテンツを<span style="color:#0d3461;font-weight:700;">Amazon</span>の生成<span style="color:#0d3461;font-weight:700;">AI</span>モデルの学習にデフォルトで利用することを許可。クリエイターは設定でオプトアウト可能となった。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="164" y="276">蘇州AIエキスポ</text>
<line x1="162" y1="280" x2="324" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="307" y="284" clip-path="url(#cm2)">AI実用化に焦点</text>
<foreignObject x="162" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">蘇州</span>で開催中の<span style="color:#b0001e;font-weight:700;">2026</span> <span style="color:#0d3461;font-weight:700;">AI</span>製品・応用エキスポでは、「実用化」に焦点が当てられ、<span style="color:#b0001e;font-weight:700;">18</span>種の<span style="color:#0d3461;font-weight:700;">AI</span>エージェントツールが紹介されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="11">日本、AI導入遅れ</text>
<line x1="0" y1="15" x2="162" y2="15" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="19" clip-path="url(#cl1)">主要国と比較して</text>
<foreignObject x="0" y="19" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;">日本企業の生成<span style="color:#0d3461;font-weight:700;">AI</span>導入率は<span style="color:#b0001e;font-weight:700;">86.4%</span>だが、<span style="color:#0d3461;font-weight:700;">中国</span><span style="color:#b0001e;font-weight:700;">98.1%</span>、<span style="color:#0d3461;font-weight:700;">ドイツ</span><span style="color:#b0001e;font-weight:700;">91.6%</span>、<span style="color:#0d3461;font-weight:700;">米国</span><span style="color:#b0001e;font-weight:700;">90.9%</span>と比較して低い水準にある。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="7.5" fill="#5c3214" font-weight="700" x="2" y="276">ライアンエアー</text>
<line x1="0" y1="280" x2="162" y2="280" stroke="#5c3214" stroke-width="0.7"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="13" writing-mode="tb-rl" x="145" y="284" clip-path="url(#cl2)">Google AIと提携</text>
<foreignObject x="0" y="284" width="137" height="246"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:246px;width:137px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1.85;text-align:justify;padding:0 5px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">アイルランド</span>の格安航空会社<span style="color:#0d3461;font-weight:700;">ライアンエアー</span>が、業務に<span style="color:#0d3461;font-weight:700;">Google Cloud</span>の<span style="color:#0d3461;font-weight:700;">AI</span>技術を統合するため、<span style="color:#b0001e;font-weight:700;">5年間</span>の戦略的パートナーシップを締結した。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="1202" y="543">企業LLMの勢力図</text>
<line x1="1200" y1="547" x2="1800" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1770" y="552" clip-path="url(#cda)">GPT、Claude、</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1748" y="552" clip-path="url(#cda)">Geminiが激突</text>
<foreignObject x="1200" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#b0001e;font-weight:700;">2026年</span>の企業向け<span style="color:#0d3461;font-weight:700;">LLM</span>市場では、<span style="color:#0d3461;font-weight:700;">OpenAI</span>の<span style="color:#0d3461;font-weight:700;">GPT-4o</span>、<span style="color:#0d3461;font-weight:700;">Anthropic</span>の<span style="color:#0d3461;font-weight:700;">Claude 3.5</span>、<span style="color:#0d3461;font-weight:700;">Google</span>の<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>が主導している。 <span style="color:#0d3461;font-weight:700;">GPT-4o</span>は<span style="color:#b0001e;font-weight:700;">5億人</span>のユーザー基盤と広範なエコシステムで先行し、<span style="color:#0d3461;font-weight:700;">Claude 3.5 Sonnet</span>は安全性と推論能力で高い評価を得ている。 一方、<span style="color:#0d3461;font-weight:700;">Gemini 1.5 Pro</span>は<span style="color:#b0001e;font-weight:700;">100万トークン</span>という最大級のコンテキストウィンドウを誇り、マルチモーダルタスクに優位性を持つ。 <span style="color:#0d3461;font-weight:700;">OECD</span>の<span style="color:#b0001e;font-weight:700;">2025年AI市場レポート</span>によると、主要な<span style="color:#0d3461;font-weight:700;">LLM</span>における<span style="color:#b0001e;font-weight:700;">100万</span>出力トークンあたりの価格は<span style="color:#b0001e;font-weight:700;">2023年</span>以降<span style="color:#b0001e;font-weight:700;">80%</span>以上下落し、コストはもはや主要な差別化要因ではなくなっている。 企業の<span style="color:#0d3461;font-weight:700;">LLM</span>選択は、タスクの複雑さ、コスト要件、推論の深さ、レイテンシ、プライバシー制約など、特定のユースケースに最適なモデルの特性に基づいて行われるべきだと指摘されている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="602" y="543">AIエージェント時代へ</text>
<line x1="600" y1="547" x2="1200" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1170" y="552" clip-path="url(#cdb)">AI「相談」から「委任」へ</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="1148" y="552" clip-path="url(#cdb)">企業導入が加速</text>
<foreignObject x="600" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;"><span style="color:#0d3461;font-weight:700;">AI</span>は「相談するツール」から「委任する同僚」へと急速に進化を遂げている。 <span style="color:#b0001e;font-weight:700;">スタンフォード大学</span>が発行した<span style="color:#b0001e;font-weight:700;">2026年</span>版<span style="color:#0d3461;font-weight:700;">AIインデックス</span>によると、生成<span style="color:#0d3461;font-weight:700;">AI</span>は<span style="color:#0d3461;font-weight:700;">ChatGPT</span>の登場からわずか<span style="color:#b0001e;font-weight:700;">3年</span>で人口の<span style="color:#b0001e;font-weight:700;">53%</span>に普及し、<span style="color:#0d3461;font-weight:700;">PC</span>やインターネットよりも速い普及速度を示した。 企業内での導入率は<span style="color:#b0001e;font-weight:700;">88%</span>に達している。 <span style="color:#0d3461;font-weight:700;">Gartner</span>は、<span style="color:#b0001e;font-weight:700;">2026年末</span>までに企業アプリケーションの<span style="color:#b0001e;font-weight:700;">40%</span>にタスク特化型<span style="color:#0d3461;font-weight:700;">AI</span>エージェントが組み込まれると予測しており、前年の<span style="color:#b0001e;font-weight:700;">5%未満</span>から大幅な増加となる。 特に、若手社員の間で<span style="color:#0d3461;font-weight:700;">AI</span>の活用が最も高く、知識労働全体でエージェントの導入が拡大しているという。 この「エージェント時代」は、計画立案から実行、自己チェックまでを<span style="color:#0d3461;font-weight:700;">AI</span>に委任する新たな働き方を企業にもたらしている。</p></div></foreignObject>
<text font-family="'Noto Sans JP'" font-size="8.5" fill="#0d3461" font-weight="700" x="2" y="543">拡大するAI経済圏</text>
<line x1="0" y1="547" x2="600" y2="547" stroke="#0d3461" stroke-width="0.8"/>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="570" y="552" clip-path="url(#cdc)">AI市場5145億ドル</text>
<text font-family="'Noto Serif JP'" font-weight="900" font-size="21" fill="#0d3461" writing-mode="tb-rl" x="548" y="552" clip-path="url(#cdc)">投資とインフラ急増</text>
<foreignObject x="0" y="552" width="540" height="348"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;height:348px;width:540px;overflow:hidden;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.85;text-align:justify;padding:0 8px;color:#111;"><p style="text-indent:1em;">世界の<span style="color:#0d3461;font-weight:700;">AI</span>市場は、急速な成長を続けており、<span style="color:#b0001e;font-weight:700;">2026年</span>には<span style="color:#b0001e;font-weight:700;">5145億ドル</span>に達し、前年の<span style="color:#b0001e;font-weight:700;">2025年</span>から<span style="color:#b0001e;font-weight:700;">19%</span>の増加を記録した。 投資面では、<span style="color:#b0001e;font-weight:700;">2025年</span>の<span style="color:#0d3461;font-weight:700;">アメリカ</span>における民間<span style="color:#0d3461;font-weight:700;">AI</span>投資額は<span style="color:#b0001e;font-weight:700;">2859億ドル</span>に上り、これは<span style="color:#0d3461;font-weight:700;">中国</span>の<span style="color:#b0001e;font-weight:700;">20倍</span>以上となっている。 <span style="color:#0d3461;font-weight:700;">Anthropic</span>は、コンピューティングコミットメントで約<span style="color:#b0001e;font-weight:700;">710億ドル</span>を確保し、自社製<span style="color:#0d3461;font-weight:700;">AI</span>チップの開発を進めるなど、インフラへの大規模投資が続いている。 また、ハイパースケーラー企業は、<span style="color:#b0001e;font-weight:700;">2026年</span>にデータセンターに<span style="color:#b0001e;font-weight:700;">7000億ドル</span>近くを投じる見込みで、<span style="color:#0d3461;font-weight:700;">AI</span>技術の基盤となるインフラ整備が加速している。 これらの巨大な投資は、<span style="color:#0d3461;font-weight:700;">AI</span>のさらなる進化と広範な普及を支える動向と言える。</p></div></foreignObject>
